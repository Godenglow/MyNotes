<h2><span class="n">2</span>本周主线（进行中，每晚修订）</h2>
<div class="day">
<div class="dh"><b>① 「知识库搬家」三连：语雀 → 飞书 → Notion（09-28 起）</b><span>35 篇迁飞书 · 245 处失真修复 · 18 篇转 Notion · 18/18 页面树</span></div>
<p>本周真正贯穿三天的主线是<b>把散在语雀、飞书里的学习资料逐步收拢到自建工作流里</b>。<b>09-28 第一跳（语雀 → 飞书）</b>：装 <code>lark-cli</code> 打通 Codex↔飞书文档通道，把语雀知识库 <b>35 篇文档迁进飞书「学习文档」（实际落 19 篇）</b>并逐篇核对数量，随后修复迁移造成的富文本失真——<b>上标／复选框／标题／代码块共 245 处</b>。遗留：「学习文档」标题编号体系与代码块格式不统一、Codex 写飞书被 Windows 沙箱阻塞。<b>10-02 第二跳（飞书 → Notion）</b>：WorkBuddy 空间 <b>MyStudy · Scripts</b> 自建迁移工具链（<code>sync.py</code> 10 KB、<code>notion_client.py</code> 5.6 KB、<code>converter.py</code>、<code>lark_client.py</code>、<code>README.md</code>），转换器<b>全量校验 18 篇 0 解析失败、24,936 blocks／2,709 图／3,620 代码块／211 表格</b>，<code>colspan/rowspan</code> 展开补空与 <code>strip-internal</code> 校验通过，图片通路实测 101 KB 落盘；<code>sync.py plan</code> 拉取 18 节点入 <code>state.json</code>、build-tree 建好 <b>18/18 页面树</b>，doc05 试点（348 blocks／15 图／4 表）跑通；明确三条限制：表格合并只能展开+补空、字母序号统一为数字编号、免费版单图 ≤ 5 MiB 超限降级为 callout 占位。<b>09-29 的 Codex 工作留档自动归档机制</b>是同一条主线的延伸——把「留档」这件事本身自动化。</p>
</div>
<div class="day">
<div class="dh"><b>② Notion 本地化部署与三端打通（10-02 起）</b><span>装到 D 盘 · 登录 · 内部集成 · MCP 授权</span></div>
<p>把 Notion 从「浏览器里用」变成「本地工作站里用」，并把写入权限交给 AI 助手。<b>安装</b>：官方引导安装器（3.7 MB）不给安装目录选项，先用 Geek Uninstaller 1.5.3.170 卸掉旧版并清理残留的文件／文件夹／注册表项，再按官方《部署 Windows 版 Notion》用 <code>/S</code>、<code>/D</code> 静默参数——第一次 PowerShell 执行报「必须在 &quot;/&quot; 运算符后面提供一个值表达式（行:1 字符:57）」，改用约 1 MB 的完整包 <code>Notion Setup 7.36.1.exe</code> 加 <code>/D=D:\Apps\Notion</code> 后成功，16:09:16 在 <code>D:\Apps\Notion</code> 验证到 <code>Notion.exe</code>、<code>Uninstall Notion.exe</code>、<code>chrome_100_percent.pak</code> 等文件。<b>打通</b>：Notion 用 Google 账号浏览器登录进入工作空间「wu weiguo」，随后授权 <code>workbuddy</code> 通过 <b>Notion MCP</b> 访问页面与数据库（回调走 <code>workbuddy://workbuddy/mcp/connector%3Anotion/oauth/callback</code>）；再在开发者后台新建 <b>Internal Integration「weiguowu10.2」</b>，勾选读取／更新／插入内容三项，复制 API 令牌与连接页地址（令牌明文不入报告）。<b>遗留</b>：中文版把 <code>connections</code> 译成「集成」，用户一度找不到入口；「学习文档」父页面目前只有 17 个子页面骨架，尚未挂内容。</p>
</div>

<div class="dh"><b>③ 挂机链升级与故障（09-29 起）</b><span>AUTO-MAS 5.6.0 · M9A 并入 MFW · WinError 5</span></div>
<p>09-29 把 <b>AUTO-MAS 升到 5.6.0</b>、并把 <b>M9A 脚本并入 MFW 引擎</b>，过程中报「MFW 运行前运行环境确认失败 [WinError 5] 拒绝访问」，且并入后有 <b>3 条脚本被丢弃</b>，两项均未收口；10-02 只是复算了当日「排查 M9A 今日异常问题」的结论（尝试用尽 — M9A 整体判定失败），游戏侧合计 2.1h、占本周活跃 25%。</p>

<b>③ 游戏/挂机 2.1h 全部来自 09-29 的脚本升级，且升级本身是失败的。</b>AUTO-MAS 升到 5.6.0 后 M9A 并入 MFW 遇到权限拒绝并丢了 3 条脚本，10-02 复核的结论仍是「M9A 整体判定失败」——<b>挂机链连续两周没有跑顺</b>，值得单独立项修一次，而不是每天顺带看看。
