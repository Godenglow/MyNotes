<svg width="680" height="420" viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#7d8590"/>
    </marker>
  </defs>

  <rect width="680" height="420" fill="#0d1117"/>

  <text x="340" y="28" text-anchor="middle" fill="#e6edf3" font-size="17" font-weight="700">多态的两阶段：编译看左，运行看右</text>
  <text x="340" y="48" text-anchor="middle" fill="#8b949e" font-size="11.5">Animal a = new Cat();   a.move();</text>

  <!-- 顶部代码 -->
  <g filter="url(#shadow)">
    <rect x="200" y="64" width="280" height="40" rx="7" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
    <text x="340" y="89" text-anchor="middle" fill="#79c0ff" font-size="13">Animal a = new Cat();  a.move();</text>
  </g>

  <!-- 分叉线 -->
  <line x1="340" y1="104" x2="180" y2="140" stroke="#7d8590" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="340" y1="104" x2="500" y2="140" stroke="#7d8590" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- 编译阶段 -->
  <g filter="url(#shadow)">
    <rect x="40" y="148" width="280" height="150" rx="8" fill="#21262d" stroke="#d29922" stroke-width="1.6"/>
    <text x="180" y="172" text-anchor="middle" fill="#d29922" font-size="12" font-weight="700">编译阶段 · 静态绑定</text>

    <text x="180" y="196" text-anchor="middle" fill="#8b949e" font-size="11">只看引用声明的类型（左边）</text>

    <rect x="60" y="208" width="240" height="30" rx="5" fill="#0d1117" stroke="#30363d"/>
    <text x="180" y="228" text-anchor="middle" fill="#e6edf3" font-size="11.5">a 是 Animal → 去 Animal 找 move()</text>

    <rect x="60" y="246" width="240" height="30" rx="5" fill="#0d1117" stroke="#30363d"/>
    <text x="180" y="266" text-anchor="middle" fill="#3fb950" font-size="11.5">找到 → 绑定成功，编译通过</text>
  </g>

  <!-- 运行阶段 -->
  <g filter="url(#shadow)">
    <rect x="360" y="148" width="280" height="150" rx="8" fill="#21262d" stroke="#3fb950" stroke-width="1.6"/>
    <text x="500" y="172" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="700">运行阶段 · 动态绑定</text>

    <text x="500" y="196" text-anchor="middle" fill="#8b949e" font-size="11">只看堆里的真实对象（右边）</text>

    <rect x="380" y="208" width="240" height="30" rx="5" fill="#0d1117" stroke="#30363d"/>
    <text x="500" y="228" text-anchor="middle" fill="#e6edf3" font-size="11.5">真实对象是 Cat → 调 Cat.move()</text>

    <rect x="380" y="246" width="240" height="30" rx="5" fill="#0d1117" stroke="#30363d"/>
    <text x="500" y="266" text-anchor="middle" fill="#f85149" font-size="11.5">前提：Cat 覆盖了 move()</text>
  </g>

  <!-- 中间 VS -->
  <circle cx="340" cy="223" r="17" fill="#0d1117" stroke="#484f58" stroke-width="1.4"/>
  <text x="340" y="228" text-anchor="middle" fill="#8b949e" font-size="11" font-weight="600">VS</text>

  <!-- 底部结论 -->
  <g filter="url(#shadow)">
    <rect x="40" y="318" width="600" height="80" rx="8" fill="#161b22" stroke="#1f6feb" stroke-width="1.3"/>
    <text x="340" y="342" text-anchor="middle" fill="#e6edf3" font-size="12.5" font-weight="600">编译期一种形态（Animal.move），运行期另一种形态（Cat.move）</text>
    <text x="340" y="364" text-anchor="middle" fill="#58a6ff" font-size="12.5" font-weight="700">→ 两种形态 = 多态</text>
    <text x="340" y="386" text-anchor="middle" fill="#8b949e" font-size="11">口诀：变量看左、静态方法看左、实例方法看右</text>
  </g>
</svg>
