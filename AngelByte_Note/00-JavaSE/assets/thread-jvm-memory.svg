<svg viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif">
  <rect width="680" height="320" fill="#0d1117"/>
  <text x="340" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#e6edf3">JVM 内存：谁共享、谁私有 &amp; 程序启动原理</text>

  <rect x="20" y="44" width="310" height="200" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="38" y="68" font-size="13" font-weight="bold" fill="#d29922">线程共享（全局一份）</text>
  <rect x="38" y="80" width="274" height="72" rx="8" fill="#2a2416" stroke="#d29922"/>
  <text x="50" y="102" font-size="11.5" fill="#c9d1d9">· 堆 Heap —— 对象住这里</text>
  <text x="50" y="124" font-size="11.5" fill="#c9d1d9">· 方法区 —— 类信息、常量、静态变量</text>
  <text x="38" y="176" font-size="12" font-weight="bold" fill="#f85149">每线程私有（各一份）</text>
  <rect x="38" y="186" width="274" height="48" rx="8" fill="#241616" stroke="#f85149"/>
  <text x="50" y="206" font-size="11.5" fill="#c9d1d9">· 虚拟机栈　· 本地方法栈</text>
  <text x="50" y="226" font-size="11.5" fill="#c9d1d9">· 程序计数器（记执行到哪行）</text>

  <rect x="350" y="44" width="310" height="200" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="368" y="68" font-size="13" font-weight="bold" fill="#bc8cff">为什么要这样分</text>
  <text x="368" y="94" font-size="11.5" fill="#c9d1d9">共享区：线程间通信、数据共享的地方</text>
  <text x="368" y="116" font-size="10.5" fill="#8b949e">→ 也是线程安全问题（冲突）的来源</text>
  <text x="368" y="144" font-size="11.5" fill="#c9d1d9">私有区：互不干扰，线程切换时能恢复现场</text>
  <text x="368" y="166" font-size="10.5" fill="#8b949e">→ 每个线程都有自己的调用栈和执行位置</text>
  <text x="368" y="196" font-size="11" fill="#c9d1d9">和条目十二的内存图对照记：</text>
  <text x="368" y="216" font-size="11" fill="#c9d1d9">堆/方法区 = 公共车间，栈 = 私人工位</text>

  <rect x="20" y="256" width="640" height="50" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="38" y="277" font-size="12" font-weight="bold" fill="#3fb950">java HelloWorld 回车 → 启动 JVM（一个进程）→ 至少两个线程：</text>
  <text x="38" y="297" font-size="11" fill="#c9d1d9">main 主线程（负责调用 main 方法，main 跑在主线程里）+ 垃圾回收线程；程序员可再手动建线程</text>
</svg>
