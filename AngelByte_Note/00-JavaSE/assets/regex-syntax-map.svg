<svg width="680" height="586" viewBox="0 0 680 586" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="680" height="586" fill="#0d1117"/>

  <text x="340" y="30" text-anchor="middle" fill="#f0f6fc" font-size="16" font-weight="700">正则表达式语法地图：五类符号</text>

  <rect x="182" y="52" width="36" height="32" rx="6" fill="#161b22" stroke="#8b949e" stroke-width="1.3"/>
  <text x="200" y="68" text-anchor="middle" dominant-baseline="central" fill="#8b949e" font-size="15" font-weight="700" font-family="Consolas, monospace">^</text>
  <text x="200" y="104" text-anchor="middle" fill="#8b949e" font-size="11">锚点·开始</text>

  <rect x="226" y="52" width="36" height="32" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1.3"/>
  <text x="244" y="68" text-anchor="middle" dominant-baseline="central" fill="#58a6ff" font-size="15" font-weight="700" font-family="Consolas, monospace">1</text>
  <text x="244" y="104" text-anchor="middle" fill="#58a6ff" font-size="11">字面量</text>

  <rect x="270" y="52" width="80" height="32" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1.3"/>
  <text x="310" y="68" text-anchor="middle" dominant-baseline="central" fill="#3fb950" font-size="15" font-weight="700" font-family="Consolas, monospace">[3-9]</text>
  <text x="310" y="104" text-anchor="middle" fill="#3fb950" font-size="11">字符类</text>

  <rect x="358" y="52" width="95" height="32" rx="6" fill="#161b22" stroke="#bc8cff" stroke-width="1.3"/>
  <text x="405" y="68" text-anchor="middle" dominant-baseline="central" fill="#bc8cff" font-size="15" font-weight="700" font-family="Consolas, monospace">\d{9}</text>
  <text x="405" y="104" text-anchor="middle" fill="#bc8cff" font-size="11">元字符+量词</text>

  <rect x="461" y="52" width="36" height="32" rx="6" fill="#161b22" stroke="#8b949e" stroke-width="1.3"/>
  <text x="479" y="68" text-anchor="middle" dominant-baseline="central" fill="#8b949e" font-size="15" font-weight="700" font-family="Consolas, monospace">$</text>
  <text x="479" y="104" text-anchor="middle" fill="#8b949e" font-size="11">锚点·结束</text>

  <text x="340" y="136" text-anchor="middle" fill="#8b949e" font-size="12">→ 手机号正则 ^1[3-9]\d{9}$，匹配 13812345678 这类 11 位号码</text>

  <g>
    <rect x="20" y="160" width="310" height="146" rx="9" fill="#161b22" stroke="#58a6ff" stroke-width="1.3"/>
    <text x="36" y="184" fill="#58a6ff" font-size="13" font-weight="700">① 元字符：一个符号配一类字符</text>
    <text x="36" y="206" fill="#58a6ff" font-size="12" font-family="Consolas, monospace">.</text>
    <text x="80" y="206" fill="#e6edf3" font-size="12">任意字符（除换行）</text>
    <text x="36" y="223" fill="#58a6ff" font-size="12" font-family="Consolas, monospace">\w</text>
    <text x="80" y="223" fill="#e6edf3" font-size="12">单词字符（字母数字下划线）</text>
    <text x="36" y="240" fill="#58a6ff" font-size="12" font-family="Consolas, monospace">\s</text>
    <text x="80" y="240" fill="#e6edf3" font-size="12">空白符（空格 Tab）</text>
    <text x="36" y="257" fill="#58a6ff" font-size="12" font-family="Consolas, monospace">\d</text>
    <text x="80" y="257" fill="#e6edf3" font-size="12">数字，等价 [0-9]</text>
    <text x="36" y="274" fill="#58a6ff" font-size="12" font-family="Consolas, monospace">\b</text>
    <text x="80" y="274" fill="#e6edf3" font-size="12">单词边界（位置）</text>
    <text x="36" y="291" fill="#58a6ff" font-size="12" font-family="Consolas, monospace">^  $</text>
    <text x="80" y="291" fill="#e6edf3" font-size="12">字符串开始 / 结束</text>
  </g>

  <g>
    <rect x="350" y="160" width="310" height="146" rx="9" fill="#161b22" stroke="#3fb950" stroke-width="1.3"/>
    <text x="366" y="184" fill="#3fb950" font-size="13" font-weight="700">② 量词：前面的东西重复几次</text>
    <text x="366" y="206" fill="#3fb950" font-size="12" font-family="Consolas, monospace">*</text>
    <text x="410" y="206" fill="#e6edf3" font-size="12">0 次或多次</text>
    <text x="366" y="223" fill="#3fb950" font-size="12" font-family="Consolas, monospace">+</text>
    <text x="410" y="223" fill="#e6edf3" font-size="12">1 次或多次</text>
    <text x="366" y="240" fill="#3fb950" font-size="12" font-family="Consolas, monospace">?</text>
    <text x="410" y="240" fill="#e6edf3" font-size="12">0 次或 1 次</text>
    <text x="366" y="257" fill="#3fb950" font-size="12" font-family="Consolas, monospace">{n}</text>
    <text x="410" y="257" fill="#e6edf3" font-size="12">恰好 n 次</text>
    <text x="366" y="274" fill="#3fb950" font-size="12" font-family="Consolas, monospace">{n,}</text>
    <text x="410" y="274" fill="#e6edf3" font-size="12">至少 n 次</text>
    <text x="366" y="291" fill="#3fb950" font-size="12" font-family="Consolas, monospace">{n,m}</text>
    <text x="410" y="291" fill="#e6edf3" font-size="12">n 到 m 次</text>
  </g>

  <g>
    <rect x="20" y="322" width="310" height="128" rx="9" fill="#161b22" stroke="#d29922" stroke-width="1.3"/>
    <text x="36" y="346" fill="#d29922" font-size="13" font-weight="700">③ 字符类 [] 与转义</text>
    <text x="36" y="368" fill="#d29922" font-size="12" font-family="Consolas, monospace">[abc]</text>
    <text x="92" y="368" fill="#e6edf3" font-size="12">a、b、c 任选其一</text>
    <text x="36" y="385" fill="#d29922" font-size="12" font-family="Consolas, monospace">[0-9]</text>
    <text x="92" y="385" fill="#e6edf3" font-size="12">范围，可叠加 [a-zA-Z0-9]</text>
    <text x="36" y="402" fill="#d29922" font-size="12" font-family="Consolas, monospace">[^?!]</text>
    <text x="92" y="402" fill="#e6edf3" font-size="12">[] 内 ^ 是取反：除 ? ! 外</text>
    <text x="36" y="419" fill="#d29922" font-size="12" font-family="Consolas, monospace">\.  \\</text>
    <text x="92" y="419" fill="#e6edf3" font-size="12">转义：匹配符号本身</text>
    <text x="36" y="436" fill="#8b949e" font-size="12">Java 双转义："\\d" 才是正则的 \d</text>
  </g>

  <g>
    <rect x="350" y="322" width="310" height="128" rx="9" fill="#161b22" stroke="#bc8cff" stroke-width="1.3"/>
    <text x="366" y="346" fill="#bc8cff" font-size="13" font-weight="700">④ 分组 () 与分支 |</text>
    <text x="366" y="368" fill="#bc8cff" font-size="12" font-family="Consolas, monospace">( )</text>
    <text x="410" y="368" fill="#e6edf3" font-size="12">分组，可整体加量词</text>
    <text x="366" y="385" fill="#bc8cff" font-size="12" font-family="Consolas, monospace">|</text>
    <text x="410" y="385" fill="#e6edf3" font-size="12">或：左右两个模式二选一</text>
    <text x="366" y="402" fill="#e6edf3" font-size="12" font-family="Consolas, monospace">0\d{2}-\d{8} | 0\d{3}-\d{7}</text>
    <text x="366" y="419" fill="#e6edf3" font-size="12" font-family="Consolas, monospace">(\d{1,3}\.){3}\d{1,3}</text>
    <text x="366" y="436" fill="#8b949e" font-size="12">分组让量词作用于"一整段"</text>
  </g>

  <g>
    <rect x="20" y="466" width="640" height="100" rx="9" fill="#161b22" stroke="#f85149" stroke-width="1.3"/>
    <text x="36" y="490" fill="#f85149" font-size="13" font-weight="700">⑤ 反义：字母变大写 = 取反</text>
    <text x="36" y="512" fill="#f85149" font-size="12" font-family="Consolas, monospace">\W</text>
    <text x="80" y="512" fill="#e6edf3" font-size="12">非单词字符</text>
    <text x="240" y="512" fill="#f85149" font-size="12" font-family="Consolas, monospace">\S</text>
    <text x="284" y="512" fill="#e6edf3" font-size="12">非空白符</text>
    <text x="450" y="512" fill="#f85149" font-size="12" font-family="Consolas, monospace">[^x]</text>
    <text x="500" y="512" fill="#e6edf3" font-size="12">除 x 外任意字符</text>
    <text x="36" y="529" fill="#f85149" font-size="12" font-family="Consolas, monospace">\D</text>
    <text x="80" y="529" fill="#e6edf3" font-size="12">非数字</text>
    <text x="240" y="529" fill="#f85149" font-size="12" font-family="Consolas, monospace">\B</text>
    <text x="284" y="529" fill="#e6edf3" font-size="12">非单词边界</text>
    <text x="450" y="529" fill="#8b949e" font-size="12">小写配大写，记四对即可</text>
    <text x="36" y="546" fill="#8b949e" font-size="12" font-family="Consolas, monospace">[^aeiou]</text>
    <text x="120" y="546" fill="#e6edf3" font-size="12">除 a、e、i、o、u 以外的任意字符</text>
  </g>
</svg>
