<svg viewBox="0 0 680 360" width="680" height="360" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <title>add 方法结束后栈帧被销毁</title>
  <desc>main 中的 u 仍指向堆中的 User 对象，add 栈帧虽然被销毁但对象仍存活</desc>
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#D85A30"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="360" fill="#FFFFFF"/>
  <rect x="20" y="20" width="640" height="320" rx="16" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="40" y="48" font-size="16" font-weight="500" fill="#2C2C2A">JVM</text>

  <rect x="50" y="70" width="240" height="250" rx="12" fill="#E6F1FB" stroke="#85B7EB" stroke-width="0.5"/>
  <text x="70" y="96" font-size="14" font-weight="500" fill="#0C447C">虚拟机栈 VM Stack</text>

  <rect x="70" y="90" width="200" height="110" rx="8" fill="#FFFFFF" stroke="#E24B4A" stroke-width="1" stroke-dasharray="4 2"/>
  <line x1="80" y1="100" x2="260" y2="190" stroke="#E24B4A" stroke-width="1.5"/>
  <line x1="260" y1="100" x2="80" y2="190" stroke="#E24B4A" stroke-width="1.5"/>
  <text x="170" y="125" font-size="13" font-weight="500" text-anchor="middle" fill="#A32D2D">add 方法栈帧（已销毁）</text>
  <text x="90" y="155" font-size="12" fill="#2C2C2A">User u</text>
  <ellipse cx="170" cy="155" rx="32" ry="14" fill="#FBEAF0" stroke="#D4537E" stroke-width="0.5"/>
  <text x="170" y="159" font-size="11" text-anchor="middle" fill="#72243E">0x12</text>

  <rect x="70" y="220" width="200" height="80" rx="8" fill="#FFFFFF" stroke="#378ADD" stroke-width="0.5"/>
  <text x="90" y="245" font-size="13" font-weight="500" fill="#0C447C">main 方法栈帧</text>
  <text x="90" y="275" font-size="12" fill="#2C2C2A">User u</text>
  <ellipse cx="170" cy="275" rx="32" ry="14" fill="#FBEAF0" stroke="#D4537E" stroke-width="0.5"/>
  <text x="170" y="279" font-size="11" text-anchor="middle" fill="#72243E">0x12</text>

  <rect x="340" y="70" width="300" height="250" rx="12" fill="#FAEEDA" stroke="#EF9F27" stroke-width="0.5"/>
  <text x="360" y="96" font-size="14" font-weight="500" fill="#854F0B">堆 Heap</text>
  <ellipse cx="490" cy="195" rx="110" ry="70" fill="#FFFFFF" stroke="#BA7517" stroke-width="0.5"/>
  <text x="490" y="185" font-size="14" font-weight="500" text-anchor="middle" fill="#4A1B0C">User 类型对象</text>
  <text x="490" y="210" font-size="13" text-anchor="middle" fill="#5F5E5A">int age = 11</text>

  <path d="M202 155 L380 170" fill="none" stroke="#D85A30" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <path d="M202 275 L380 220" fill="none" stroke="#D85A30" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <text x="360" y="300" font-size="12" fill="#854F0B">栈帧销毁，但对象依然存活（main 的 u 还指着它）</text>
</svg>
