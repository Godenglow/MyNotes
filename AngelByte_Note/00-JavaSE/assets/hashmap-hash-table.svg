<svg width="680" height="440" viewBox="0 0 680 440" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="ar3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#8b949e" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="680" height="440" fill="#0d1117"/>

  <text x="340" y="28" text-anchor="middle" fill="#f0f6fc" font-size="16" font-weight="700">HashMap 底层：哈希表 = 数组 + 链表（+ 红黑树）</text>

  <g>
    <rect x="20" y="48" width="310" height="286" rx="9" fill="#161b22" stroke="#58a6ff" stroke-width="1.4"/>
    <text x="36" y="72" fill="#58a6ff" font-size="13" font-weight="700">结构示意（位桶数组）</text>

    <rect x="36" y="90" width="80" height="20" rx="3" fill="#0d1117" stroke="#58a6ff" stroke-width="1"/>
    <text x="76" y="104" text-anchor="middle" fill="#8b949e" font-size="10.5" font-family="Consolas, monospace">table[0]</text>
    <rect x="36" y="116" width="80" height="20" rx="3" fill="#0d1117" stroke="#58a6ff" stroke-width="1"/>
    <text x="76" y="130" text-anchor="middle" fill="#8b949e" font-size="10.5" font-family="Consolas, monospace">table[1]</text>
    <rect x="36" y="142" width="80" height="20" rx="3" fill="#0d1117" stroke="#58a6ff" stroke-width="1"/>
    <text x="76" y="156" text-anchor="middle" fill="#8b949e" font-size="10.5" font-family="Consolas, monospace">table[2]</text>
    <rect x="36" y="168" width="80" height="20" rx="3" fill="#0d1117" stroke="#58a6ff" stroke-width="1"/>
    <text x="76" y="182" text-anchor="middle" fill="#8b949e" font-size="10.5" font-family="Consolas, monospace">table[3]</text>
    <rect x="36" y="194" width="80" height="20" rx="3" fill="#0d1117" stroke="#58a6ff" stroke-width="1"/>
    <text x="76" y="208" text-anchor="middle" fill="#8b949e" font-size="10.5" font-family="Consolas, monospace">table[4]</text>

    <line x1="116" y1="126" x2="138" y2="126" stroke="#8b949e" stroke-width="1" marker-end="url(#ar3)"/>
    <rect x="142" y="116" width="44" height="20" rx="3" fill="#0d1117" stroke="#8b949e" stroke-width="1"/>
    <text x="164" y="130" text-anchor="middle" fill="#e6edf3" font-size="10" font-family="Consolas, monospace">Node</text>
    <line x1="186" y1="126" x2="200" y2="126" stroke="#8b949e" stroke-width="1" marker-end="url(#ar3)"/>
    <rect x="204" y="116" width="44" height="20" rx="3" fill="#0d1117" stroke="#8b949e" stroke-width="1"/>
    <text x="226" y="130" text-anchor="middle" fill="#e6edf3" font-size="10" font-family="Consolas, monospace">Node</text>
    <text x="254" y="130" fill="#8b949e" font-size="10">next 串链</text>

    <line x1="116" y1="152" x2="138" y2="152" stroke="#8b949e" stroke-width="1" marker-end="url(#ar3)"/>
    <rect x="142" y="142" width="44" height="20" rx="3" fill="#0d1117" stroke="#8b949e" stroke-width="1"/>
    <text x="164" y="156" text-anchor="middle" fill="#e6edf3" font-size="10" font-family="Consolas, monospace">Node</text>

    <line x1="116" y1="204" x2="138" y2="204" stroke="#f85149" stroke-width="1.2" marker-end="url(#ar3)"/>
    <circle cx="158" cy="204" r="11" fill="#0d1117" stroke="#f85149" stroke-width="1.3"/>
    <circle cx="186" cy="188" r="11" fill="#0d1117" stroke="#f85149" stroke-width="1.3"/>
    <circle cx="186" cy="220" r="11" fill="#0d1117" stroke="#f85149" stroke-width="1.3"/>
    <line x1="167" y1="198" x2="176" y2="193" stroke="#f85149" stroke-width="1"/>
    <line x1="167" y1="210" x2="176" y2="215" stroke="#f85149" stroke-width="1"/>
    <text x="206" y="208" fill="#f85149" font-size="10.5">链表 ≥8 且数组 ≥64 → 树化</text>

    <text x="36" y="252" fill="#8b949e" font-size="11">数组：哈希定位，O(1) 快速命中</text>
    <text x="36" y="270" fill="#8b949e" font-size="11">链表：哈希冲突的 key 挂同一条链</text>
    <text x="36" y="288" fill="#8b949e" font-size="11">红黑树：链太长兜底，防查询退化 O(n)</text>
    <text x="36" y="312" fill="#8b949e" font-size="10.5">组合形态不绝对：数组+链表 / 数组+红黑树 /</text>
    <text x="36" y="328" fill="#8b949e" font-size="10.5">数组+链表+红黑树 都可能</text>
  </g>

  <g>
    <rect x="350" y="48" width="310" height="286" rx="9" fill="#161b22" stroke="#8b949e" stroke-width="1.4"/>
    <text x="366" y="72" fill="#e6edf3" font-size="13" font-weight="700">源码体现</text>

    <rect x="366" y="86" width="278" height="78" rx="6" fill="#0d1117" stroke="#58a6ff" stroke-width="1"/>
    <text x="376" y="106" fill="#58a6ff" font-size="11" font-family="Consolas, monospace">transient Node&lt;K,V&gt;[] table;</text>
    <text x="376" y="124" fill="#8b949e" font-size="10.5">位桶数组：每个下标是一个桶（bucket）</text>
    <text x="376" y="140" fill="#e6edf3" font-size="10.5">首次 put 才初始化（懒加载）</text>
    <text x="376" y="156" fill="#e6edf3" font-size="10.5">分配后长度恒为 2 的幂</text>

    <rect x="366" y="176" width="278" height="100" rx="6" fill="#0d1117" stroke="#8b949e" stroke-width="1"/>
    <text x="376" y="196" fill="#58a6ff" font-size="10.5" font-family="Consolas, monospace">static class Node&lt;K,V&gt; {</text>
    <text x="376" y="212" fill="#e6edf3" font-size="10.5" font-family="Consolas, monospace">  final int hash;   // 计算出的哈希值</text>
    <text x="376" y="228" fill="#e6edf3" font-size="10.5" font-family="Consolas, monospace">  final K key;</text>
    <text x="376" y="244" fill="#e6edf3" font-size="10.5" font-family="Consolas, monospace">  V value;</text>
    <text x="376" y="260" fill="#e6edf3" font-size="10.5" font-family="Consolas, monospace">  Node&lt;K,V&gt; next;  // 冲突成链</text>
    <text x="376" y="272" fill="#58a6ff" font-size="10.5" font-family="Consolas, monospace">}</text>

    <rect x="366" y="288" width="278" height="34" rx="6" fill="#0d1117" stroke="#3fb950" stroke-width="1.2"/>
    <text x="376" y="310" fill="#3fb950" font-size="11" font-weight="700">Node = 数组元素 + 链表节点的结合体</text>
  </g>

  <g>
    <rect x="20" y="352" width="640" height="68" rx="9" fill="#161b22" stroke="#d29922" stroke-width="1.3"/>
    <text x="36" y="374" fill="#d29922" font-size="12" font-weight="700">为什么查询和增删都高效？</text>
    <text x="36" y="394" fill="#e6edf3" font-size="11">查询：哈希 O(1) 定位桶，冲突少时一次命中；增删：桶内链表操作不搬移元素</text>
    <text x="36" y="412" fill="#e6edf3" font-size="11">综合接近 O(1) —— 远优于纯数组（增删搬移）或纯链表（查询遍历）的 O(n)</text>
  </g>
</svg>
