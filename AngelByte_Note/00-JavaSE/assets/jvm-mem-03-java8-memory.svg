<svg viewBox="0 0 680 430" width="680" height="430" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <title>Java 8 之后 JVM 内存结构</title>
  <desc>虚拟机栈、堆、元空间 Metaspace 的分布，以及局部变量和实例变量的存储位置</desc>
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="430" fill="#FFFFFF"/>
  <rect x="20" y="20" width="640" height="390" rx="16" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="40" y="48" font-size="16" font-weight="500" fill="#2C2C2A">JVM（Java 8 之后，包含 Java 8）</text>

  <rect x="40" y="70" width="180" height="330" rx="12" fill="#E6F1FB" stroke="#85B7EB" stroke-width="0.5"/>
  <text x="60" y="96" font-size="14" font-weight="500" fill="#0C447C">虚拟机栈 VM Stack</text>
  <rect x="55" y="120" width="150" height="260" rx="8" fill="#FFFFFF" stroke="#378ADD" stroke-width="0.5"/>
  <text x="70" y="145" font-size="13" font-weight="500" fill="#0C447C">main 方法栈帧</text>
  <text x="70" y="175" font-size="12" fill="#2C2C2A">int i = 10</text>
  <text x="70" y="205" font-size="12" fill="#2C2C2A">Student s1</text>
  <ellipse cx="150" cy="205" rx="32" ry="14" fill="#FBEAF0" stroke="#D4537E" stroke-width="0.5"/>
  <text x="150" y="209" font-size="11" text-anchor="middle" fill="#72243E">0x23</text>
  <text x="70" y="235" font-size="12" fill="#2C2C2A">Student s2</text>
  <ellipse cx="150" cy="235" rx="32" ry="14" fill="#FBEAF0" stroke="#D4537E" stroke-width="0.5"/>
  <text x="150" y="239" font-size="11" text-anchor="middle" fill="#72243E">0x5e6</text>
  <text x="55" y="350" font-size="11" fill="#0C447C">局部变量存储在这里</text>

  <rect x="250" y="70" width="240" height="330" rx="12" fill="#FAEEDA" stroke="#EF9F27" stroke-width="0.5"/>
  <text x="270" y="96" font-size="14" font-weight="500" fill="#854F0B">堆 Heap</text>

  <ellipse cx="370" cy="155" rx="80" ry="45" fill="#FFFFFF" stroke="#BA7517" stroke-width="0.5"/>
  <text x="370" y="145" font-size="12" font-weight="500" text-anchor="middle" fill="#4A1B0C">StudentTest01.class</text>
  <text x="370" y="165" font-size="11" text-anchor="middle" fill="#5F5E5A">String.class</text>

  <ellipse cx="370" cy="300" rx="100" ry="70" fill="#FFFFFF" stroke="#BA7517" stroke-width="0.5"/>
  <text x="370" y="280" font-size="13" font-weight="500" text-anchor="middle" fill="#4A1B0C">Student 对象</text>
  <text x="370" y="302" font-size="12" text-anchor="middle" fill="#5F5E5A">String name = "zhangsan"</text>
  <text x="370" y="320" font-size="12" text-anchor="middle" fill="#5F5E5A">int age</text>
  <text x="370" y="338" font-size="12" text-anchor="middle" fill="#5F5E5A">boolean gender</text>
  <text x="250" y="350" font-size="11" fill="#854F0B">实例变量存储在这里</text>

  <rect x="520" y="70" width="120" height="330" rx="12" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.5"/>
  <text x="530" y="96" font-size="13" font-weight="500" fill="#085041">元空间</text>
  <text x="530" y="115" font-size="12" font-weight="500" fill="#0F6E56">Metaspace</text>
  <text x="535" y="145" font-size="11" fill="#2C2C2A">StudentTest01.class</text>
  <text x="535" y="165" font-size="11" fill="#2C2C2A">Student.class</text>
  <text x="535" y="185" font-size="11" fill="#2C2C2A">String.class</text>
  <text x="535" y="205" font-size="11" fill="#2C2C2A">System.class</text>
  <text x="535" y="240" font-size="11" fill="#5F5E5A">……</text>
  <text x="535" y="350" font-size="11" fill="#085041">使用的本地内存</text>

  <path d="M182 205 L270 300" fill="none" stroke="#D85A30" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <path d="M182 235 L270 320" fill="none" stroke="#D85A30" stroke-width="1.5" marker-end="url(#arrow3)"/>
</svg>
