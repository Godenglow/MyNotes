<svg width="680" height="400" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="680" height="400" fill="#0d1117"/>

  <text x="340" y="28" text-anchor="middle" fill="#e6edf3" font-size="17" font-weight="700">is-a（是什么） vs can-do（能做什么）</text>
  <text x="340" y="48" text-anchor="middle" fill="#8b949e" font-size="11.5">抽象类定"身份"，接口定"能力" —— 一个类只能有一个身份，但可以有多种能力</text>

  <!-- 左侧：抽象类 is-a -->
  <g filter="url(#shadow)">
    <rect x="40" y="80" width="270" height="150" rx="8" fill="#21262d" stroke="#d29922" stroke-width="1.5"/>
    <text x="175" y="104" text-anchor="middle" fill="#d29922" font-size="12.5" font-weight="700">抽象类 · is-a</text>

    <text x="175" y="128" text-anchor="middle" fill="#e6edf3" font-size="11.5">Duck is-a Animal（鸭子是动物）</text>

    <rect x="60" y="140" width="230" height="34" rx="5" fill="#0d1117" stroke="#30363d"/>
    <text x="175" y="162" text-anchor="middle" fill="#8b949e" font-size="11">abstract class Animal</text>

    <text x="175" y="196" text-anchor="middle" fill="#6e7681" font-size="10.5">只能 extends 一个（血缘唯一）</text>
    <text x="175" y="215" text-anchor="middle" fill="#6e7681" font-size="10.5">复用代码骨架，强调"是什么"</text>
  </g>

  <!-- 右侧：接口 can-do -->
  <g filter="url(#shadow)">
    <rect x="370" y="80" width="270" height="150" rx="8" fill="#21262d" stroke="#3fb950" stroke-width="1.5"/>
    <text x="505" y="104" text-anchor="middle" fill="#3fb950" font-size="12.5" font-weight="700">接口 · can-do</text>

    <text x="505" y="128" text-anchor="middle" fill="#e6edf3" font-size="11.5">Duck can fly / swim（鸭子会飞会游）</text>

    <rect x="390" y="140" width="230" height="34" rx="5" fill="#0d1117" stroke="#30363d"/>
    <text x="505" y="162" text-anchor="middle" fill="#8b949e" font-size="11">interface Flyable / Swimmable</text>

    <text x="505" y="196" text-anchor="middle" fill="#6e7681" font-size="10.5">可以 implements 多个（能力叠加）</text>
    <text x="505" y="215" text-anchor="middle" fill="#6e7681" font-size="10.5">只定规范不复用代码，强调"能做什么"</text>
  </g>

  <!-- 底部代码组合 -->
  <g filter="url(#shadow)">
    <rect x="40" y="256" width="600" height="112" rx="8" fill="#161b22" stroke="#1f6feb" stroke-width="1.3"/>
    <text x="340" y="280" text-anchor="middle" fill="#58a6ff" font-size="12" font-weight="700">组合使用：一个身份 + 多种能力</text>

    <text x="70" y="304" fill="#e6edf3" font-size="11.5">class Duck extends Animal</text>
    <text x="70" y="324" fill="#e6edf3" font-size="11.5">        implements Flyable, Swimmable {</text>
    <text x="70" y="344" fill="#8b949e" font-size="11.5">    // 必须实现 eat() / fly() / swim()</text>
    <text x="70" y="360" fill="#8b949e" font-size="11.5">}</text>
  </g>
</svg>
