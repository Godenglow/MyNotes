<svg width="680" height="450" viewBox="0 0 680 450" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="680" height="450" fill="#0d1117"/>

  <text x="340" y="28" text-anchor="middle" fill="#f0f6fc" font-size="16" font-weight="700">fail-fast 本质：modCount 与 expectedModCount 的同步与不同步</text>

  <g>
    <rect x="20" y="48" width="310" height="286" rx="9" fill="#161b22" stroke="#f85149" stroke-width="1.4"/>
    <text x="36" y="74" fill="#f85149" font-size="13.5" font-weight="700">用集合删：list.remove(s)</text>

    <text x="36" y="100" fill="#8b949e" font-size="11.5">步骤 1 · 创建迭代器</text>
    <text x="36" y="118" fill="#e6edf3" font-size="11" font-family="Consolas, monospace">modCount=0  expected=0  相等 OK</text>

    <line x1="36" y1="130" x2="314" y2="130" stroke="#30363d" stroke-width="1"/>

    <text x="36" y="152" fill="#8b949e" font-size="11.5">步骤 2 · 集合删除 "B"</text>
    <text x="36" y="170" fill="#e6edf3" font-size="11" font-family="Consolas, monospace">modCount=1  expected=0</text>
    <text x="36" y="187" fill="#f85149" font-size="11">只有集合自己的计数 +1</text>
    <text x="36" y="204" fill="#f85149" font-size="11">迭代器不知道被改过</text>

    <line x1="36" y1="216" x2="314" y2="216" stroke="#30363d" stroke-width="1"/>

    <text x="36" y="238" fill="#8b949e" font-size="11.5">步骤 3 · 下一次 it.next()</text>
    <text x="36" y="256" fill="#e6edf3" font-size="11" font-family="Consolas, monospace">if (modCount != expected)</text>

    <rect x="36" y="268" width="278" height="50" rx="6" fill="#0d1117" stroke="#f85149" stroke-width="1.2"/>
    <text x="46" y="288" fill="#f85149" font-size="12" font-weight="700">1 != 0 → 当场失败</text>
    <text x="46" y="306" fill="#f85149" font-size="10.5" font-family="Consolas, monospace">ConcurrentModificationException</text>
  </g>

  <g>
    <rect x="350" y="48" width="310" height="286" rx="9" fill="#161b22" stroke="#3fb950" stroke-width="1.4"/>
    <text x="366" y="74" fill="#3fb950" font-size="13.5" font-weight="700">用迭代器删：it.remove()</text>

    <text x="366" y="100" fill="#8b949e" font-size="11.5">步骤 1 · 创建迭代器</text>
    <text x="366" y="118" fill="#e6edf3" font-size="11" font-family="Consolas, monospace">modCount=0  expected=0  相等 OK</text>

    <line x1="366" y1="130" x2="644" y2="130" stroke="#30363d" stroke-width="1"/>

    <text x="366" y="152" fill="#8b949e" font-size="11.5">步骤 2 · 迭代器删除 "B"</text>
    <text x="366" y="170" fill="#e6edf3" font-size="11" font-family="Consolas, monospace">modCount=1  expected=1</text>
    <text x="366" y="187" fill="#3fb950" font-size="11">两个计数同时 +1（同步）</text>
    <text x="366" y="204" fill="#3fb950" font-size="11">迭代器自己删的自己知道</text>

    <line x1="366" y1="216" x2="644" y2="216" stroke="#30363d" stroke-width="1"/>

    <text x="366" y="238" fill="#8b949e" font-size="11.5">步骤 3 · 下一次 it.next()</text>
    <text x="366" y="256" fill="#e6edf3" font-size="11" font-family="Consolas, monospace">if (modCount != expected)</text>

    <rect x="366" y="268" width="278" height="50" rx="6" fill="#0d1117" stroke="#3fb950" stroke-width="1.2"/>
    <text x="376" y="288" fill="#3fb950" font-size="12" font-weight="700">1 == 1 → 检查通过</text>
    <text x="376" y="306" fill="#3fb950" font-size="10.5" font-family="Consolas, monospace">正常返回下一个元素</text>
  </g>

  <g>
    <rect x="20" y="352" width="640" height="78" rx="9" fill="#161b22" stroke="#d29922" stroke-width="1.3"/>
    <text x="36" y="376" fill="#d29922" font-size="12.5" font-weight="700">两个红线（PPT 红字强调）</text>
    <text x="36" y="396" fill="#e6edf3" font-size="11.5">① 单线程也算"并发修改"——迭代期间结构被改就失败，迭代器无法预知是不是真多线程</text>
    <text x="36" y="416" fill="#e6edf3" font-size="11.5">② it.remove() 删的是"上一次 next() 返回的元素"——不先 next 就 remove → IllegalStateException</text>
  </g>
</svg>
