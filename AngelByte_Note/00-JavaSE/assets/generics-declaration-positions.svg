<svg width="680" height="260" viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="680" height="260" fill="#0d1117"/>

  <text x="340" y="28" text-anchor="middle" fill="#f0f6fc" font-size="16" font-weight="700">泛型的三个定义位置</text>

  <g>
    <rect x="20" y="48" width="200" height="190" rx="9" fill="#161b22" stroke="#58a6ff" stroke-width="1.3"/>
    <text x="36" y="72" fill="#58a6ff" font-size="13" font-weight="700">① 类上定义</text>
    <text x="36" y="96" fill="#8b949e" font-size="11" font-family="Consolas, monospace">class MyClass&lt;T&gt; {</text>
    <text x="36" y="113" fill="#8b949e" font-size="11" font-family="Consolas, monospace">  private T name;</text>
    <text x="36" y="130" fill="#8b949e" font-size="11" font-family="Consolas, monospace">}</text>
    <text x="36" y="152" fill="#e6edf3" font-size="11.5">T 跟着对象走：</text>
    <text x="36" y="169" fill="#e6edf3" font-size="11" font-family="Consolas, monospace">new MyClass&lt;String&gt;()</text>
    <text x="36" y="186" fill="#e6edf3" font-size="11.5">new 的那一刻确定类型</text>
    <text x="36" y="214" fill="#f85149" font-size="11">静态方法用不了它（没对象）</text>
  </g>

  <g>
    <rect x="240" y="48" width="200" height="190" rx="9" fill="#161b22" stroke="#bc8cff" stroke-width="1.3"/>
    <text x="256" y="72" fill="#bc8cff" font-size="13" font-weight="700">② 静态方法自带</text>
    <text x="256" y="96" fill="#8b949e" font-size="11" font-family="Consolas, monospace">static &lt;T&gt; T m(List&lt;T&gt; l)</text>
    <text x="256" y="113" fill="#8b949e" font-size="11" font-family="Consolas, monospace">       ^^^^</text>
    <text x="256" y="130" fill="#e6edf3" font-size="11.5">&lt;T&gt; 写在返回值前面，</text>
    <text x="256" y="147" fill="#e6edf3" font-size="11.5">是"方法自己声明的泛型"</text>
    <text x="256" y="170" fill="#e6edf3" font-size="11.5">调用时编译器自动推断：</text>
    <text x="256" y="187" fill="#e6edf3" font-size="11" font-family="Consolas, monospace">m(list)  →  T = String</text>
    <text x="256" y="214" fill="#d29922" font-size="11">类加载即存在，没有对象</text>
  </g>

  <g>
    <rect x="460" y="48" width="200" height="190" rx="9" fill="#161b22" stroke="#3fb950" stroke-width="1.3"/>
    <text x="476" y="72" fill="#3fb950" font-size="13" font-weight="700">③ 接口上定义</text>
    <text x="476" y="96" fill="#8b949e" font-size="11" font-family="Consolas, monospace">interface Flyable&lt;T&gt; {</text>
    <text x="476" y="113" fill="#8b949e" font-size="11" font-family="Consolas, monospace">  void fly(T t);</text>
    <text x="476" y="130" fill="#8b949e" font-size="11" font-family="Consolas, monospace">}</text>
    <text x="476" y="152" fill="#e6edf3" font-size="11.5">实现时知道类型 →</text>
    <text x="476" y="169" fill="#e6edf3" font-size="11" font-family="Consolas, monospace">implements Flyable&lt;Bird&gt;</text>
    <text x="476" y="192" fill="#e6edf3" font-size="11.5">不知道 → 继续留 T：</text>
    <text x="476" y="209" fill="#e6edf3" font-size="11" font-family="Consolas, monospace">class C&lt;T&gt; impl Flyable&lt;T&gt;</text>
    <text x="476" y="232" fill="#8b949e" font-size="11">Comparable&lt;E&gt; 就是这么用</text>
  </g>
</svg>
