<svg width="680" height="520" viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="680" height="520" fill="#0d1117"/>

  <text x="340" y="26" text-anchor="middle" fill="#e6edf3" font-size="16" font-weight="700">4 种内部类 · 位置与实例化</text>
  <text x="340" y="44" text-anchor="middle" fill="#8b949e" font-size="11">不同修饰符决定类体放在外部类的哪个区域，实例化语法也各不相同</text>

  <g filter="url(#shadow)">
    <rect x="40" y="64" width="600" height="432" rx="10" fill="#161b22" stroke="#1f6feb" stroke-width="1.6"/>
    <text x="340" y="86" text-anchor="middle" fill="#58a6ff" font-size="14" font-weight="700">class Outer { ... }</text>

    <text x="60" y="108" fill="#d29922" font-size="11" font-weight="700">// 成员区（类体顶层）</text>

    <rect x="60" y="116" width="280" height="32" rx="5" fill="#0d1117" stroke="#a371f7" stroke-width="1.2"/>
    <text x="200" y="137" text-anchor="middle" fill="#a371f7" font-size="11.5" font-weight="600">static int y;  static class StaticInner { }</text>

    <rect x="60" y="156" width="280" height="32" rx="5" fill="#0d1117" stroke="#3fb950" stroke-width="1.2"/>
    <text x="200" y="177" text-anchor="middle" fill="#3fb950" font-size="11.5" font-weight="600">int x;  class InstanceInner { }</text>

    <text x="380" y="108" fill="#d29922" font-size="11" font-weight="700">// 实例化语法</text>
    <rect x="380" y="116" width="240" height="32" rx="5" fill="#0d1117" stroke="#a371f7" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="500" y="137" text-anchor="middle" fill="#a371f7" font-size="11">new Outer.StaticInner()</text>
    <rect x="380" y="156" width="240" height="32" rx="5" fill="#0d1117" stroke="#3fb950" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="500" y="177" text-anchor="middle" fill="#3fb950" font-size="11">outer.new InstanceInner()</text>

    <line x1="60" y1="200" x2="620" y2="200" stroke="#30363d" stroke-dasharray="3 3"/>

    <text x="60" y="222" fill="#d29922" font-size="11" font-weight="700">// 方法体（局部区域）</text>

    <rect x="60" y="232" width="560" height="44" rx="6" fill="#0d1117" stroke="#58a6ff" stroke-width="1.3"/>
    <text x="80" y="251" fill="#58a6ff" font-size="11" font-weight="600">void method() {</text>
    <text x="80" y="269" fill="#e6edf3" font-size="10.5">    int localVar = 10;  // 局部变量</text>

    <rect x="80" y="286" width="260" height="36" rx="5" fill="#0d1117" stroke="#d29922" stroke-width="1.2"/>
    <text x="210" y="301" text-anchor="middle" fill="#d29922" font-size="10.5">class LocalInner { }</text>
    <text x="210" y="316" text-anchor="middle" fill="#7d8590" font-size="9">局部内部类（作用域 = method）</text>

    <rect x="360" y="286" width="240" height="36" rx="5" fill="#0d1117" stroke="#f85149" stroke-width="1.2"/>
    <text x="480" y="301" text-anchor="middle" fill="#f85149" font-size="10.5">new Runnable() { ... }</text>
    <text x="480" y="316" text-anchor="middle" fill="#7d8590" font-size="9">匿名内部类（一次性）</text>

    <rect x="80" y="332" width="260" height="32" rx="5" fill="#0d1117" stroke="#d29922" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="210" y="353" text-anchor="middle" fill="#d29922" font-size="10.5">new LocalInner()</text>
    <rect x="360" y="332" width="240" height="32" rx="5" fill="#0d1117" stroke="#f85149" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="480" y="353" text-anchor="middle" fill="#f85149" font-size="10.5">定义即实例化</text>

    <text x="60" y="384" fill="#58a6ff" font-size="11" font-weight="600">} // method 结束</text>
    <text x="60" y="402" fill="#1f6feb" font-size="11" font-weight="600">} // class Outer 结束</text>

    <line x1="60" y1="420" x2="620" y2="420" stroke="#30363d" stroke-dasharray="3 3"/>
    <text x="340" y="442" text-anchor="middle" fill="#d29922" font-size="11" font-weight="700">硬性限制</text>
    <text x="60" y="464" fill="#e6edf3" font-size="10.5">· 静态内部类 → 可以有静态成员；实例/局部/匿名 → 不能（final 常量除外）</text>
    <text x="60" y="484" fill="#e6edf3" font-size="10.5">· 后 3 种访问外部局部变量 → 必须「有效 final」（JDK 8+ 自动判定）</text>
  </g>
</svg>
