<svg width="680" height="380" viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="680" height="380" fill="#0d1117"/>

  <text x="340" y="30" text-anchor="middle" fill="#e6edf3" font-size="18" font-weight="700">Java 继承层级示例</text>
  <text x="340" y="52" text-anchor="middle" fill="#8b949e" font-size="12">extends 表示"扩展"，子类是父类的特化</text>

  <g stroke="#30363d" stroke-width="2" fill="none">
    <line x1="340" y1="100" x2="200" y2="180"/>
    <line x1="340" y1="100" x2="480" y2="180"/>
    <line x1="200" y1="180" x2="80" y2="280"/>
    <line x1="200" y1="180" x2="200" y2="280"/>
    <line x1="200" y1="180" x2="320" y2="280"/>
    <line x1="480" y1="180" x2="440" y2="280"/>
    <line x1="480" y1="180" x2="600" y2="280"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="290" y="70" width="100" height="40" rx="6" fill="#1f6feb" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="340" y="96" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="600">动物</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="150" y="160" width="100" height="40" rx="6" fill="#238636" stroke="#3fb950" stroke-width="1.5"/>
    <text x="200" y="186" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">哺乳动物</text>

    <rect x="430" y="160" width="100" height="40" rx="6" fill="#238636" stroke="#3fb950" stroke-width="1.5"/>
    <text x="480" y="186" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">爬行动物</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="40" y="260" width="80" height="36" rx="6" fill="#21262d" stroke="#8b949e" stroke-width="1.2"/>
    <text x="80" y="284" text-anchor="middle" fill="#e6edf3" font-size="13">狗</text>

    <rect x="160" y="260" width="80" height="36" rx="6" fill="#21262d" stroke="#8b949e" stroke-width="1.2"/>
    <text x="200" y="284" text-anchor="middle" fill="#e6edf3" font-size="13">猫</text>

    <rect x="280" y="260" width="80" height="36" rx="6" fill="#21262d" stroke="#8b949e" stroke-width="1.2"/>
    <text x="320" y="284" text-anchor="middle" fill="#e6edf3" font-size="13">人</text>

    <rect x="400" y="260" width="80" height="36" rx="6" fill="#21262d" stroke="#8b949e" stroke-width="1.2"/>
    <text x="440" y="284" text-anchor="middle" fill="#e6edf3" font-size="13">蛇</text>

    <rect x="560" y="260" width="80" height="36" rx="6" fill="#21262d" stroke="#8b949e" stroke-width="1.2"/>
    <text x="600" y="284" text-anchor="middle" fill="#e6edf3" font-size="13">鳄鱼</text>
  </g>

  <text x="270" y="138" text-anchor="middle" fill="#7d8590" font-size="10" font-style="italic">extends</text>
  <text x="410" y="138" text-anchor="middle" fill="#7d8590" font-size="10" font-style="italic">extends</text>

  <g font-size="11" fill="#8b949e">
    <text x="40" y="335">根类（隐式继承 Object）</text>
    <rect x="24" y="324" width="12" height="12" fill="#1f6feb" rx="2"/>

    <text x="40" y="358">父类</text>
    <rect x="24" y="347" width="12" height="12" fill="#238636" rx="2"/>

    <text x="220" y="335">子类（具体类）</text>
    <rect x="204" y="324" width="12" height="12" fill="#21262d" stroke="#8b949e" rx="2"/>

    <text x="220" y="358">每条边都是"extends"</text>
  </g>
</svg>
