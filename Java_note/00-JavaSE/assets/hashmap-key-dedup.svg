<svg width="680" height="400" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="ar2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#8b949e" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="680" height="400" fill="#0d1117"/>

  <text x="340" y="28" text-anchor="middle" fill="#f0f6fc" font-size="16" font-weight="700">HashMap 的 key 去重：两步判定 + 自定义类型陷阱</text>

  <g>
    <rect x="20" y="48" width="310" height="220" rx="9" fill="#161b22" stroke="#3fb950" stroke-width="1.4"/>
    <text x="36" y="72" fill="#3fb950" font-size="13" font-weight="700">判重两步走</text>

    <rect x="36" y="86" width="278" height="52" rx="6" fill="#0d1117" stroke="#8b949e" stroke-width="1"/>
    <text x="46" y="106" fill="#e6edf3" font-size="11.5" font-weight="700">第一步 · hashCode()</text>
    <text x="46" y="124" fill="#8b949e" font-size="10.5">算哈希值定位桶；不同 → 直接判不同 key，不调 equals</text>

    <line x1="175" y1="138" x2="175" y2="152" stroke="#8b949e" stroke-width="1.2" marker-end="url(#ar2)"/>

    <rect x="36" y="156" width="278" height="52" rx="6" fill="#0d1117" stroke="#8b949e" stroke-width="1"/>
    <text x="46" y="176" fill="#e6edf3" font-size="11.5" font-weight="700">第二步 · equals()</text>
    <text x="46" y="194" fill="#8b949e" font-size="10.5">同桶（哈希冲突）时逐个比；相等 → 判定为重复 key</text>

    <rect x="36" y="218" width="278" height="38" rx="6" fill="#0d1117" stroke="#3fb950" stroke-width="1.2"/>
    <text x="46" y="236" fill="#3fb950" font-size="11.5" font-weight="700">重复 key → value 覆盖，不新增 key</text>
    <text x="46" y="250" fill="#8b949e" font-size="10" font-family="Consolas, monospace">put("a",1); put("a",2); → {a=2}</text>
  </g>

  <g>
    <rect x="350" y="48" width="310" height="220" rx="9" fill="#161b22" stroke="#f85149" stroke-width="1.4"/>
    <text x="366" y="72" fill="#f85149" font-size="13" font-weight="700">自定义类型作 key：必须同时重写两个</text>

    <rect x="366" y="86" width="278" height="62" rx="6" fill="#0d1117" stroke="#8b949e" stroke-width="1"/>
    <text x="376" y="106" fill="#e6edf3" font-size="11" font-weight="700">只重写 equals ❌</text>
    <text x="376" y="124" fill="#8b949e" font-size="10.5">hashCode 不同 → 分到不同桶</text>
    <text x="376" y="140" fill="#8b949e" font-size="10.5">当成两个 key，去重失效（可能内存泄漏）</text>

    <rect x="366" y="158" width="278" height="52" rx="6" fill="#0d1117" stroke="#8b949e" stroke-width="1"/>
    <text x="376" y="178" fill="#e6edf3" font-size="11" font-weight="700">只重写 hashCode ❌</text>
    <text x="376" y="196" fill="#8b949e" font-size="10.5">冲突后无法正确判重</text>

    <rect x="366" y="220" width="278" height="34" rx="6" fill="#0d1117" stroke="#d29922" stroke-width="1.2"/>
    <text x="376" y="242" fill="#d29922" font-size="11" font-weight="700">规范：equals 为 true ⇒ hashCode 必须相同</text>
  </g>

  <g>
    <rect x="20" y="286" width="640" height="94" rx="9" fill="#161b22" stroke="#d29922" stroke-width="1.3"/>
    <text x="36" y="310" fill="#d29922" font-size="12.5" font-weight="700">通俗类比：一排储物柜（桶）+ 柜内钥匙牌（链表）</text>
    <text x="36" y="332" fill="#e6edf3" font-size="11.5">hashCode() = 决定进哪个柜子；equals() = 确认柜内已有的牌是不是同一把</text>
    <text x="36" y="352" fill="#e6edf3" font-size="11.5">只改"柜子号"不改"是否同一把"（或反过来），都会对不上号 —— 两个方法是一个整体</text>
    <text x="36" y="372" fill="#8b949e" font-size="11">无序：插入顺序 ≠ 取出顺序（靠哈希定位，不看插入先后）</text>
  </g>
</svg>
