<svg width="680" height="330" viewBox="0 0 680 330" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="680" height="330" fill="#0d1117"/>

  <text x="340" y="28" text-anchor="middle" fill="#f0f6fc" font-size="16" font-weight="700">泛型通配符：解决"方法参数类型写死"的尴尬</text>

  <g>
    <rect x="20" y="48" width="640" height="52" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1.2"/>
    <text x="36" y="69" fill="#f85149" font-size="12" font-weight="700">先踩个坑：泛型没有继承性</text>
    <text x="36" y="88" fill="#e6edf3" font-size="11.5" font-family="Consolas, monospace">m(List&lt;Object&gt;)  传  ArrayList&lt;String&gt;  → 编译报错！List&lt;String&gt; 不是 List&lt;Object&gt; 的子类</text>
  </g>

  <g>
    <rect x="20" y="116" width="200" height="150" rx="9" fill="#161b22" stroke="#8b949e" stroke-width="1.3"/>
    <text x="36" y="142" fill="#e6edf3" font-size="14" font-weight="700" font-family="Consolas, monospace">&lt;?&gt;</text>
    <text x="36" y="164" fill="#e6edf3" font-size="12" font-weight="700">无限通配符</text>
    <text x="36" y="186" fill="#8b949e" font-size="11.5">? 可以为任意引用类型</text>
    <text x="36" y="208" fill="#8b949e" font-size="11" font-family="Consolas, monospace">List&lt;?&gt; 任何 List 都能传</text>
    <text x="36" y="234" fill="#8b949e" font-size="11">元素类型完全未知，</text>
    <text x="36" y="250" fill="#8b949e" font-size="11">除了 Object 啥也不能加</text>
  </g>

  <g>
    <rect x="240" y="116" width="200" height="150" rx="9" fill="#161b22" stroke="#3fb950" stroke-width="1.3"/>
    <text x="256" y="142" fill="#3fb950" font-size="13" font-weight="700" font-family="Consolas, monospace">&lt;? extends Number&gt;</text>
    <text x="256" y="164" fill="#e6edf3" font-size="12" font-weight="700">上限通配符</text>
    <text x="256" y="186" fill="#8b949e" font-size="11.5">? 必须是 Number 及其子类</text>
    <text x="256" y="208" fill="#3fb950" font-size="11" font-family="Consolas, monospace">Integer、Double 都可以</text>
    <text x="256" y="234" fill="#3fb950" font-size="11">适合"只读"（生产者）</text>
    <text x="256" y="250" fill="#8b949e" font-size="11">读出来一定是个 Number</text>
  </g>

  <g>
    <rect x="460" y="116" width="200" height="150" rx="9" fill="#161b22" stroke="#d29922" stroke-width="1.3"/>
    <text x="476" y="142" fill="#d29922" font-size="13" font-weight="700" font-family="Consolas, monospace">&lt;? super Number&gt;</text>
    <text x="476" y="164" fill="#e6edf3" font-size="12" font-weight="700">下限通配符</text>
    <text x="476" y="186" fill="#8b949e" font-size="11.5">? 必须是 Number 及其父类</text>
    <text x="476" y="208" fill="#d29922" font-size="11" font-family="Consolas, monospace">Object、Number 都可以</text>
    <text x="476" y="234" fill="#d29922" font-size="11">适合"只写"（消费者）</text>
    <text x="476" y="250" fill="#8b949e" font-size="11">写的元素一定兼容 Number</text>
  </g>

  <text x="340" y="302" text-anchor="middle" fill="#d29922" font-size="12.5" font-weight="700">口诀 PECS：生产者用 extends（读），消费者用 super（写）</text>
</svg>
