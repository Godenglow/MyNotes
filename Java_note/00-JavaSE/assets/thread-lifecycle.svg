<svg viewBox="0 0 680 352" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif">
  <rect width="680" height="352" fill="#0d1117"/>
  <text x="340" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#e6edf3">线程生命周期：七个状态</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <g text-anchor="middle">
    <rect x="30" y="70" width="100" height="40" rx="8" fill="#161b22" stroke="#8b949e"/>
    <text x="80" y="87" font-size="12" font-weight="bold" fill="#c9d1d9">新建</text>
    <text x="80" y="102" font-size="9.5" fill="#8b949e">NEW</text>
    <rect x="190" y="70" width="110" height="40" rx="8" fill="#161b22" stroke="#58a6ff"/>
    <text x="245" y="87" font-size="12" font-weight="bold" fill="#58a6ff">就绪</text>
    <text x="245" y="102" font-size="9.5" fill="#8b949e">RUNNABLE</text>
    <rect x="380" y="70" width="110" height="40" rx="8" fill="#161b22" stroke="#3fb950"/>
    <text x="435" y="87" font-size="12" font-weight="bold" fill="#3fb950">运行</text>
    <text x="435" y="102" font-size="9.5" fill="#8b949e">RUNNABLE</text>
    <rect x="560" y="70" width="90" height="40" rx="8" fill="#161b22" stroke="#6e7681"/>
    <text x="605" y="87" font-size="12" font-weight="bold" fill="#8b949e">死亡</text>
    <text x="605" y="102" font-size="9.5" fill="#6e7681">TERMINATED</text>
  </g>

  <g text-anchor="middle">
    <rect x="40" y="210" width="130" height="40" rx="8" fill="#161b22" stroke="#bc8cff"/>
    <text x="105" y="227" font-size="12" font-weight="bold" fill="#bc8cff">等待</text>
    <text x="105" y="242" font-size="9.5" fill="#8b949e">WAITING（无限等）</text>
    <rect x="250" y="210" width="160" height="40" rx="8" fill="#161b22" stroke="#d29922"/>
    <text x="330" y="227" font-size="12" font-weight="bold" fill="#d29922">超时等待</text>
    <text x="330" y="242" font-size="9.5" fill="#8b949e">TIMED_WAITING（等一段时间）</text>
    <rect x="480" y="210" width="140" height="40" rx="8" fill="#161b22" stroke="#f85149"/>
    <text x="550" y="227" font-size="12" font-weight="bold" fill="#f85149">阻塞</text>
    <text x="550" y="242" font-size="9.5" fill="#8b949e">BLOCKED（等锁）</text>
  </g>

  <g stroke-width="1.2" fill="none">
    <line x1="130" y1="90" x2="186" y2="90" stroke="#8b949e" marker-end="url(#arrow)"/>
    <line x1="300" y1="90" x2="376" y2="90" stroke="#3fb950" marker-end="url(#arrow)"/>
    <path d="M435 110 C400 146 320 146 290 110" stroke="#58a6ff" marker-end="url(#arrow)"/>
    <line x1="490" y1="90" x2="556" y2="90" stroke="#6e7681" marker-end="url(#arrow)"/>
    <line x1="415" y1="110" x2="128" y2="206" stroke="#bc8cff" marker-end="url(#arrow)"/>
    <line x1="150" y1="206" x2="228" y2="114" stroke="#bc8cff" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
    <line x1="435" y1="110" x2="338" y2="206" stroke="#d29922" marker-end="url(#arrow)"/>
    <line x1="300" y1="206" x2="256" y2="114" stroke="#d29922" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
    <line x1="455" y1="110" x2="542" y2="206" stroke="#f85149" marker-end="url(#arrow)"/>
    <line x1="492" y1="206" x2="272" y2="114" stroke="#f85149" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  </g>
  <g font-size="10">
    <text x="158" y="83" text-anchor="middle" fill="#8b949e">start()</text>
    <text x="338" y="83" text-anchor="middle" fill="#3fb950">抢到 CPU 时间片</text>
    <text x="362" y="150" text-anchor="middle" fill="#58a6ff">时间片用完 / yield</text>
    <text x="522" y="83" text-anchor="middle" fill="#6e7681">run 执行完</text>
    <text x="212" y="152" text-anchor="middle" fill="#bc8cff">wait()</text>
    <text x="168" y="182" text-anchor="middle" fill="#bc8cff">notify() 唤醒</text>
    <text x="404" y="152" text-anchor="middle" fill="#d29922">sleep(n) / wait(n)</text>
    <text x="305" y="186" text-anchor="middle" fill="#d29922">时间到</text>
    <text x="526" y="152" text-anchor="middle" fill="#f85149">进 synchronized 没拿到锁</text>
    <text x="428" y="186" text-anchor="middle" fill="#f85149">拿到锁</text>
  </g>

  <rect x="20" y="278" width="640" height="56" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="38" y="299" font-size="11.5" fill="#c9d1d9">· 就绪和运行在 Java 层面<tspan fill="#58a6ff" font-weight="bold">统称 RUNNABLE</tspan>（Thread.State 只有 6 个枚举，PPT 按 7 个阶段讲）</text>
  <text x="38" y="321" font-size="11.5" fill="#c9d1d9">· 虚线 = 恢复后都先回<tspan fill="#58a6ff" font-weight="bold">就绪</tspan>重新排队抢 CPU，不会直接跳回运行；从死亡状态不能再到任何状态</text>
</svg>
