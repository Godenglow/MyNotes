<svg width="680" height="500" viewBox="0 0 680 500" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="680" height="500" fill="#0d1117"/>

  <text x="340" y="28" text-anchor="middle" fill="#f0f6fc" font-size="16" font-weight="700">泛型：把类型错误从运行时提前到编译期</text>

  <g>
    <rect x="20" y="48" width="310" height="330" rx="9" fill="#161b22" stroke="#f85149" stroke-width="1.4"/>
    <text x="36" y="74" fill="#f85149" font-size="14" font-weight="700">没有泛型（Object 方案）</text>

    <text x="36" y="100" fill="#8b949e" font-size="11.5" font-family="Consolas, monospace">List list = new ArrayList();</text>
    <text x="36" y="120" fill="#8b949e" font-size="11.5" font-family="Consolas, monospace">list.add("abc");</text>
    <text x="36" y="140" fill="#8b949e" font-size="11.5" font-family="Consolas, monospace">list.add(123);   // int 也能进</text>

    <line x1="36" y1="154" x2="314" y2="154" stroke="#30363d" stroke-width="1"/>

    <text x="36" y="176" fill="#e6edf3" font-size="12">编译期：啥都能进，检查不到</text>
    <text x="36" y="194" fill="#3fb950" font-size="12" font-family="Consolas, monospace">编译 OK 通过</text>

    <text x="36" y="222" fill="#e6edf3" font-size="12">运行期：取出来才能发现错</text>
    <text x="36" y="244" fill="#e6edf3" font-size="11.5" font-family="Consolas, monospace">String s = (String) list.get(1);</text>

    <rect x="36" y="262" width="278" height="42" rx="6" fill="#0d1117" stroke="#f85149" stroke-width="1.2"/>
    <text x="46" y="279" fill="#f85149" font-size="12" font-weight="700">运行时爆炸</text>
    <text x="46" y="296" fill="#f85149" font-size="11" font-family="Consolas, monospace">ClassCastException</text>

    <text x="36" y="330" fill="#8b949e" font-size="11.5">每次取元素都要手动强转：</text>
    <text x="36" y="348" fill="#8b949e" font-size="11.5" font-family="Consolas, monospace">(String) list.get(0)</text>
    <text x="36" y="366" fill="#8b949e" font-size="11.5" font-family="Consolas, monospace">(Integer) list.get(1)</text>
  </g>

  <g>
    <rect x="350" y="48" width="310" height="330" rx="9" fill="#161b22" stroke="#3fb950" stroke-width="1.4"/>
    <text x="366" y="74" fill="#3fb950" font-size="14" font-weight="700">有泛型（Java 5+）</text>

    <text x="366" y="100" fill="#8b949e" font-size="11.5" font-family="Consolas, monospace">List&lt;String&gt; list = new ArrayList&lt;&gt;();</text>
    <text x="366" y="120" fill="#8b949e" font-size="11.5" font-family="Consolas, monospace">list.add("abc");</text>
    <text x="366" y="140" fill="#8b949e" font-size="11.5" font-family="Consolas, monospace">list.add(123);   // int 想进</text>

    <line x1="366" y1="154" x2="644" y2="154" stroke="#30363d" stroke-width="1"/>

    <text x="366" y="176" fill="#e6edf3" font-size="12">编译期：当场拦下，写完就报错</text>
    <text x="366" y="194" fill="#f85149" font-size="12" font-family="Consolas, monospace">编译 X 报错</text>

    <text x="366" y="222" fill="#e6edf3" font-size="12">运行期：错误根本活不到运行时</text>
    <rect x="366" y="236" width="278" height="42" rx="6" fill="#0d1117" stroke="#3fb950" stroke-width="1.2"/>
    <text x="376" y="253" fill="#3fb950" font-size="12" font-weight="700">无需强转</text>
    <text x="376" y="270" fill="#3fb950" font-size="11" font-family="Consolas, monospace">String s = list.get(0);</text>

    <text x="366" y="304" fill="#8b949e" font-size="11.5">&lt;String&gt; 是"合同"：集合里只准放</text>
    <text x="366" y="322" fill="#8b949e" font-size="11.5">字符串，放别的编译器直接拦</text>
  </g>

  <g>
    <rect x="20" y="396" width="640" height="84" rx="9" fill="#161b22" stroke="#d29922" stroke-width="1.3"/>
    <text x="36" y="420" fill="#d29922" font-size="13" font-weight="700">本质：泛型只活在编译阶段（类型擦除）</text>
    <text x="36" y="442" fill="#e6edf3" font-size="12">编译后字节码里没有 &lt;String&gt;——运行时的 ArrayList 不知道自己存过什么类型</text>
    <text x="36" y="462" fill="#8b949e" font-size="11.5" font-family="Consolas, monospace">Java 7 钻石表达式：new ArrayList&lt;&gt;()  右边的类型让编译器自己推</text>
  </g>
</svg>
