<svg width="680" height="480" viewBox="0 0 680 480" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="680" height="480" fill="#0d1117"/>

  <text x="340" y="26" text-anchor="middle" fill="#e6edf3" font-size="16" font-weight="700">JUnit 4 个生命周期注解 · 执行顺序</text>
  <text x="340" y="44" text-anchor="middle" fill="#8b949e" font-size="11">@BeforeAll 跑 1 次，@BeforeEach/@AfterEach 围绕每个 @Test 跑，@AfterAll 最后收尾</text>

  <g filter="url(#shadow)">
    <rect x="200" y="68" width="280" height="40" rx="7" fill="#161b22" stroke="#a371f7" stroke-width="1.5"/>
    <text x="340" y="93" text-anchor="middle" fill="#a371f7" font-size="13" font-weight="700">@BeforeAll （static，整个类前跑 1 次）</text>
  </g>

  <line x1="340" y1="108" x2="340" y2="120" stroke="#58a6ff" stroke-width="1.5"/>

  <g filter="url(#shadow)">
    <rect x="200" y="124" width="280" height="36" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1.3"/>
    <text x="340" y="147" text-anchor="middle" fill="#58a6ff" font-size="12" font-weight="600">@BeforeEach</text>
  </g>
  <line x1="340" y1="160" x2="340" y2="170" stroke="#58a6ff" stroke-width="1.5"/>

  <g filter="url(#shadow)">
    <rect x="200" y="170" width="280" height="38" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1.6"/>
    <text x="340" y="194" text-anchor="middle" fill="#3fb950" font-size="13" font-weight="700">@Test 方法 1</text>
  </g>
  <line x1="340" y1="208" x2="340" y2="218" stroke="#58a6ff" stroke-width="1.5"/>

  <g filter="url(#shadow)">
    <rect x="200" y="218" width="280" height="36" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1.3"/>
    <text x="340" y="241" text-anchor="middle" fill="#58a6ff" font-size="12" font-weight="600">@AfterEach</text>
  </g>
  <line x1="340" y1="254" x2="340" y2="264" stroke="#58a6ff" stroke-width="1.5"/>

  <g filter="url(#shadow)">
    <rect x="200" y="268" width="280" height="32" rx="5" fill="#0d1117" stroke="#58a6ff" stroke-width="1.2"/>
    <text x="340" y="288" text-anchor="middle" fill="#58a6ff" font-size="11.5" font-weight="600">@BeforeEach</text>
  </g>
  <line x1="340" y1="300" x2="340" y2="308" stroke="#58a6ff" stroke-width="1.5"/>

  <g filter="url(#shadow)">
    <rect x="200" y="308" width="280" height="34" rx="5" fill="#0d1117" stroke="#3fb950" stroke-width="1.4"/>
    <text x="340" y="330" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="700">@Test 方法 2</text>
  </g>
  <line x1="340" y1="342" x2="340" y2="350" stroke="#58a6ff" stroke-width="1.5"/>

  <g filter="url(#shadow)">
    <rect x="200" y="350" width="280" height="32" rx="5" fill="#0d1117" stroke="#58a6ff" stroke-width="1.2"/>
    <text x="340" y="370" text-anchor="middle" fill="#58a6ff" font-size="11.5" font-weight="600">@AfterEach</text>
  </g>
  <line x1="340" y1="382" x2="340" y2="392" stroke="#58a6ff" stroke-width="1.5"/>

  <g filter="url(#shadow)">
    <rect x="200" y="392" width="280" height="40" rx="7" fill="#161b22" stroke="#a371f7" stroke-width="1.5"/>
    <text x="340" y="417" text-anchor="middle" fill="#a371f7" font-size="13" font-weight="700">@AfterAll （static，整个类后跑 1 次）</text>
  </g>

  <text x="60" y="93" text-anchor="middle" fill="#a371f7" font-size="10">1 次</text>
  <text x="60" y="190" text-anchor="middle" fill="#3fb950" font-size="10">每个 Test</text>
  <text x="60" y="320" text-anchor="middle" fill="#3fb950" font-size="10">循环</text>
  <text x="60" y="417" text-anchor="middle" fill="#a371f7" font-size="10">1 次</text>

  <g filter="url(#shadow)">
    <rect x="520" y="68" width="140" height="364" rx="7" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
    <text x="590" y="92" text-anchor="middle" fill="#d29922" font-size="11" font-weight="700">典型场景</text>

    <text x="530" y="125" fill="#a371f7" font-size="9.5">开数据库连接</text>
    <text x="530" y="142" fill="#a371f7" font-size="9.5">加载全局配置</text>

    <text x="530" y="180" fill="#58a6ff" font-size="9.5">new 新对象</text>
    <text x="530" y="196" fill="#58a6ff" font-size="9.5">准备测试数据</text>

    <text x="530" y="235" fill="#58a6ff" font-size="9.5">清理临时文件</text>
    <text x="530" y="252" fill="#58a6ff" font-size="9.5">重置状态</text>

    <text x="530" y="320" fill="#58a6ff" font-size="9.5">同上</text>

    <text x="530" y="375" fill="#a371f7" font-size="9.5">关数据库连接</text>
    <text x="530" y="392" fill="#a371f7" font-size="9.5">清理临时目录</text>

    <text x="590" y="420" text-anchor="middle" fill="#7d8590" font-size="9" font-style="italic">@Test 用例</text>
  </g>

  <text x="340" y="464" text-anchor="middle" fill="#d29922" font-size="11" font-weight="600">All（前后各 1 次·static） + Each（每个 Test 前后） = 完整的 setup/teardown 框架</text>
</svg>
