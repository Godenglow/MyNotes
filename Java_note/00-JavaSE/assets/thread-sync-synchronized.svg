<svg viewBox="0 0 680 452" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif">
  <rect width="680" height="452" fill="#0d1117"/>
  <text x="340" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#e6edf3">线程安全问题 &amp; synchronized 三种写法</text>

  <rect x="20" y="40" width="640" height="158" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="38" y="62" font-size="13" font-weight="bold" fill="#f85149">问题怎么发生：读 → 改 → 写 被交错执行</text>
  <rect x="270" y="72" width="140" height="34" rx="8" fill="#2a2416" stroke="#d29922"/>
  <text x="340" y="93" text-anchor="middle" font-size="12" font-weight="bold" fill="#d29922">共享账户　余额 10000</text>
  <text x="38" y="132" font-size="11.5" fill="#58a6ff">线程1：读到 10000 → 减 10000 → 写回 0　<tspan fill="#8b949e">（正确剧本）</tspan></text>
  <text x="38" y="154" font-size="11.5" fill="#f85149">线程2：读到 10000（线程1 还没写回！）→ 取走并覆盖　<tspan fill="#8b949e">（读到旧值）</tspan></text>
  <text x="38" y="182" font-size="11.5" fill="#c9d1d9">两个线程"同时"操作同一共享资源，执行顺序不可预测 → 最终结果与预期不符 = <tspan fill="#f85149" font-weight="bold">线程安全问题</tspan></text>

  <rect x="20" y="212" width="640" height="160" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="38" y="234" font-size="13" font-weight="bold" fill="#3fb950">synchronized 三种写法（关键看锁的是谁）</text>
  <g text-anchor="middle">
    <rect x="36" y="246" width="196" height="112" rx="8" fill="#1c2530" stroke="#58a6ff"/>
    <text x="134" y="266" font-size="12" font-weight="bold" fill="#58a6ff">同步代码块</text>
    <text x="134" y="288" font-family="Consolas,monospace" font-size="10.5" fill="#c9d1d9">synchronized(lock){...}</text>
    <text x="134" y="310" font-size="10.5" fill="#8b949e">锁 = 你指定的任意对象</text>
    <text x="134" y="330" font-size="10.5" fill="#8b949e">粒度最小，只包共享操作</text>
    <text x="134" y="348" font-size="10.5" fill="#d29922">锁对象要唯一</text>
    <rect x="246" y="246" width="196" height="112" rx="8" fill="#1c2530" stroke="#3fb950"/>
    <text x="344" y="266" font-size="12" font-weight="bold" fill="#3fb950">同步实例方法</text>
    <text x="344" y="288" font-family="Consolas,monospace" font-size="10.5" fill="#c9d1d9">public synchronized void m()</text>
    <text x="344" y="310" font-size="10.5" fill="#8b949e">锁 = 当前实例 this</text>
    <text x="344" y="330" font-size="10.5" fill="#8b949e">同一对象互斥，不同对象并发</text>
    <text x="344" y="348" font-size="10.5" fill="#d29922">锁在实例上，不在类上</text>
    <rect x="456" y="246" width="188" height="112" rx="8" fill="#1c2530" stroke="#bc8cff"/>
    <text x="550" y="266" font-size="12" font-weight="bold" fill="#bc8cff">静态同步方法</text>
    <text x="550" y="288" font-family="Consolas,monospace" font-size="10.5" fill="#c9d1d9">static synchronized void m()</text>
    <text x="550" y="310" font-size="10.5" fill="#8b949e">锁 = 类锁（XXX.class）</text>
    <text x="550" y="330" font-size="10.5" fill="#8b949e">类只有一个 → 类锁只有一把</text>
    <text x="550" y="348" font-size="10.5" fill="#d29922">保护静态变量</text>
  </g>

  <rect x="20" y="386" width="640" height="52" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="38" y="406" font-size="11.5" fill="#c9d1d9">· 监视器机制：每个对象都自带一把锁，进同步代码先<tspan fill="#3fb950" font-weight="bold">拿锁</tspan>（拿不到就去等 → BLOCKED），执行完<tspan fill="#3fb950" font-weight="bold">放锁</tspan>，别的线程才有机会</text>
  <text x="38" y="428" font-size="11.5" fill="#c9d1d9">· 三原则：同步代码尽量<tspan fill="#d29922" font-weight="bold">短</tspan>（只包共享资源操作）· 锁对象尽量<tspan fill="#d29922" font-weight="bold">唯一</tspan> · 操作尽量<tspan fill="#d29922" font-weight="bold">快</tspan></text>
</svg>
