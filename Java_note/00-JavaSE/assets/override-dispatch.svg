<svg width="680" height="400" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#58a6ff"/>
    </marker>
    <marker id="arrow-g" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#3fb950"/>
    </marker>
  </defs>

  <rect width="680" height="400" fill="#0d1117"/>

  <text x="340" y="28" text-anchor="middle" fill="#e6edf3" font-size="17" font-weight="700">动态分派 vs 静态分派</text>
  <text x="340" y="48" text-anchor="middle" fill="#8b949e" font-size="11.5">Father obj = new Son();  ——  方法看对象，变量看引用</text>

  <!-- 左侧：引用变量 -->
  <g filter="url(#shadow)">
    <rect x="40" y="90" width="150" height="64" rx="7" fill="#21262d" stroke="#8b949e" stroke-width="1.4"/>
    <text x="115" y="114" text-anchor="middle" fill="#7d8590" font-size="10.5">栈 · 引用变量</text>
    <text x="115" y="138" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="600">Father obj</text>
  </g>

  <!-- 右侧：堆里的对象 -->
  <g filter="url(#shadow)">
    <rect x="450" y="80" width="190" height="200" rx="7" fill="#21262d" stroke="#3fb950" stroke-width="1.4"/>
    <text x="545" y="104" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="600">堆 · 实际对象 new Son()</text>

    <rect x="466" y="118" width="158" height="34" rx="5" fill="#0d1117" stroke="#30363d"/>
    <text x="545" y="139" text-anchor="middle" fill="#8b949e" font-size="11">Father 部分：count = 10</text>

    <rect x="466" y="158" width="158" height="34" rx="5" fill="#0d1117" stroke="#30363d"/>
    <text x="545" y="179" text-anchor="middle" fill="#8b949e" font-size="11">Son 部分：count = 20</text>

    <rect x="466" y="198" width="158" height="34" rx="5" fill="#0d1117" stroke="#30363d"/>
    <text x="545" y="219" text-anchor="middle" fill="#8b949e" font-size="11">Son.method() 覆盖版</text>

    <text x="545" y="262" text-anchor="middle" fill="#6e7681" font-size="10">两个 count 同时存在于对象内</text>
  </g>

  <!-- 引用指向对象 -->
  <line x1="192" y1="122" x2="446" y2="150" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="300" y="128" text-anchor="middle" fill="#58a6ff" font-size="10">指向 0x11</text>

  <!-- 分派结果对比 -->
  <g filter="url(#shadow)">
    <rect x="40" y="200" width="290" height="46" rx="7" fill="#21262d" stroke="#f85149" stroke-width="1.4"/>
    <text x="185" y="220" text-anchor="middle" fill="#f85149" font-size="10.5" font-weight="600">静态分派 · 变量看引用类型</text>
    <text x="185" y="238" text-anchor="middle" fill="#e6edf3" font-size="11.5">obj.count   →   10（Father 的）</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="40" y="256" width="290" height="46" rx="7" fill="#21262d" stroke="#3fb950" stroke-width="1.4"/>
    <text x="185" y="276" text-anchor="middle" fill="#3fb950" font-size="10.5" font-weight="600">动态分派 · 方法看实际对象</text>
    <text x="185" y="294" text-anchor="middle" fill="#e6edf3" font-size="11.5">obj.method()   →   子类实现</text>
  </g>

  <!-- 底部结论 -->
  <g filter="url(#shadow)">
    <rect x="40" y="326" width="600" height="52" rx="7" fill="#161b22" stroke="#1f6feb" stroke-width="1.2"/>
    <text x="340" y="348" text-anchor="middle" fill="#e6edf3" font-size="12" font-weight="600">同名变量 = 隐藏（编译期定，看左边类型）</text>
    <text x="340" y="368" text-anchor="middle" fill="#e6edf3" font-size="12" font-weight="600">同名实例方法 = 覆盖（运行期定，看右边对象）</text>
  </g>
</svg>
