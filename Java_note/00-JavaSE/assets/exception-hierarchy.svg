<svg width="680" height="600" viewBox="0 0 680 600" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="680" height="600" fill="#0d1117"/>

  <text x="340" y="26" text-anchor="middle" fill="#e6edf3" font-size="16" font-weight="700">Java 异常继承结构</text>
  <text x="340" y="44" text-anchor="middle" fill="#8b949e" font-size="11">所有异常和错误都继承 Throwable，分 Error（不可处理）和 Exception（可处理）两支</text>

  <g filter="url(#shadow)">
    <rect x="300" y="60" width="80" height="30" rx="6" fill="#161b22" stroke="#8b949e" stroke-width="1.3"/>
    <text x="340" y="80" text-anchor="middle" fill="#8b949e" font-size="12" font-weight="700">Object</text>
  </g>
  <line x1="340" y1="90" x2="340" y2="102" stroke="#30363d" stroke-width="1.5"/>

  <g filter="url(#shadow)">
    <rect x="280" y="102" width="120" height="32" rx="6" fill="#161b22" stroke="#d29922" stroke-width="1.6"/>
    <text x="340" y="123" text-anchor="middle" fill="#d29922" font-size="13" font-weight="700">Throwable</text>
  </g>
  <line x1="340" y1="134" x2="340" y2="148" stroke="#30363d" stroke-width="1.5"/>
  <line x1="170" y1="148" x2="170" y2="162" stroke="#30363d" stroke-width="1.5"/>
  <line x1="510" y1="148" x2="510" y2="162" stroke="#30363d" stroke-width="1.5"/>

  <g filter="url(#shadow)">
    <rect x="90" y="162" width="160" height="34" rx="6" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
    <text x="170" y="184" text-anchor="middle" fill="#f85149" font-size="13" font-weight="700">Error（错误）</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="430" y="162" width="160" height="34" rx="6" fill="#161b22" stroke="#1f6feb" stroke-width="1.5"/>
    <text x="510" y="184" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="700">Exception（异常）</text>
  </g>

  <text x="170" y="212" text-anchor="middle" fill="#7d8590" font-size="9.5">JVM 层面 · 无法处理 · 出现即终止</text>
  <text x="510" y="212" text-anchor="middle" fill="#7d8590" font-size="9.5">程序层面 · 可处理 · 程序员日常打交道</text>

  <g filter="url(#shadow)">
    <rect x="60" y="222" width="120" height="32" rx="4" fill="#0d1117" stroke="#f85149" stroke-width="1.1"/>
    <text x="120" y="243" text-anchor="middle" fill="#f85149" font-size="10">OOM Error</text>

    <rect x="200" y="222" width="120" height="32" rx="4" fill="#0d1117" stroke="#f85149" stroke-width="1.1"/>
    <text x="260" y="243" text-anchor="middle" fill="#f85149" font-size="10">StackOverflow</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="360" y="222" width="150" height="32" rx="4" fill="#0d1117" stroke="#3fb950" stroke-width="1.4"/>
    <text x="435" y="243" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="700">RuntimeException</text>

    <rect x="530" y="222" width="130" height="32" rx="4" fill="#0d1117" stroke="#d29922" stroke-width="1.4"/>
    <text x="595" y="243" text-anchor="middle" fill="#d29922" font-size="11" font-weight="700">其它 Exception</text>
  </g>

  <text x="170" y="272" text-anchor="middle" fill="#f85149" font-size="9.5" font-weight="600">↑ JVM 错误</text>
  <text x="435" y="272" text-anchor="middle" fill="#3fb950" font-size="9.5" font-weight="600">运行时异常（Unchecked）</text>
  <text x="435" y="284" text-anchor="middle" fill="#7d8590" font-size="8.5">编译器不强制处理</text>
  <text x="595" y="272" text-anchor="middle" fill="#d29922" font-size="9.5" font-weight="600">编译时异常（Checked）</text>
  <text x="595" y="284" text-anchor="middle" fill="#7d8590" font-size="8.5">编译器强制要求处理</text>

  <line x1="40" y1="298" x2="640" y2="298" stroke="#30363d" stroke-dasharray="3 3"/>

  <g filter="url(#shadow)">
    <rect x="20" y="310" width="300" height="146" rx="6" fill="#0d1117" stroke="#3fb950" stroke-width="1.2"/>
    <text x="170" y="332" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="700">5 大常见运行时异常（RuntimeException 派）</text>

    <text x="36" y="356" fill="#e6edf3" font-size="10">· NullPointerException（空指针）</text>
    <text x="36" y="376" fill="#e6edf3" font-size="10">· ArrayIndexOutOfBoundsException（下标越界）</text>
    <text x="36" y="396" fill="#e6edf3" font-size="10">· ClassCastException（类型转换错）</text>
    <text x="36" y="416" fill="#e6edf3" font-size="10">· ArithmeticException（算术异常，1/0）</text>
    <text x="36" y="436" fill="#e6edf3" font-size="10">· NumberFormatException（数字格式错）</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="360" y="310" width="300" height="146" rx="6" fill="#0d1117" stroke="#d29922" stroke-width="1.2"/>
    <text x="510" y="332" text-anchor="middle" fill="#d29922" font-size="11" font-weight="700">5 大常见编译时异常（Checked 派）</text>

    <text x="376" y="356" fill="#e6edf3" font-size="10">· IOException（I/O 失败）</text>
    <text x="376" y="376" fill="#e6edf3" font-size="10">· FileNotFoundException</text>
    <text x="376" y="396" fill="#e6edf3" font-size="10">· SQLException（数据库）</text>
    <text x="376" y="416" fill="#e6edf3" font-size="10">· ClassNotFoundException（反射）</text>
    <text x="376" y="436" fill="#e6edf3" font-size="10">· InterruptedException（线程中断）</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="20" y="476" width="640" height="100" rx="7" fill="#161b22" stroke="#d29922" stroke-width="1.3"/>
    <text x="340" y="500" text-anchor="middle" fill="#d29922" font-size="12" font-weight="700">关键澄清：所有异常都是运行期发生的</text>

    <text x="40" y="524" fill="#e6edf3" font-size="11">new 异常对象只能在运行期完成 → 异常一定是运行期发生的</text>
    <text x="40" y="544" fill="#e6edf3" font-size="11">"编译时异常" = "被编译器检查"（不写 try-catch/throws 编译就报错）</text>
    <text x="40" y="566" fill="#58a6ff" font-size="11" font-weight="600">所以更准确的名字是：受检异常（Checked） / 非受检异常（Unchecked）</text>
  </g>
</svg>
