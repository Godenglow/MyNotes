<svg viewBox="0 0 680 456" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif">
  <rect width="680" height="456" fill="#0d1117"/>
  <text x="340" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#e6edf3">synchronized 互斥判断：锁对象决定一切</text>

  <rect x="20" y="40" width="640" height="62" rx="10" fill="#161b22" stroke="#58a6ff"/>
  <text x="38" y="62" font-size="12" font-weight="bold" fill="#58a6ff">核心规则：是同一把锁 → 互斥等待；不是同一把锁 → 互不干扰</text>
  <text x="38" y="84" font-size="11" fill="#c9d1d9">实例方法上的 synchronized 是<tspan font-weight="bold">语法糖</tspan> ≡ <tspan font-family="Consolas,monospace">synchronized(this){...}</tspan>；锁（monitor）存在<tspan fill="#d29922" font-weight="bold">对象头 Mark Word</tspan>，挂在对象上，不挂在方法上</text>

  <g>
    <rect x="20" y="116" width="310" height="132" rx="10" fill="#161b22" stroke="#f85149"/>
    <text x="36" y="138" font-size="12.5" font-weight="bold" fill="#f85149">① 同一对象 + 两个同步方法 → 等</text>
    <text x="36" y="160" font-size="11" fill="#c9d1d9">m1、m2 都 synchronized，t1 调 m1（耗时 5s）</text>
    <text x="36" y="180" font-size="11" fill="#c9d1d9">t2 再调 m2 → <tspan font-weight="bold">必须等</tspan> m1 执行完</text>
    <text x="36" y="206" font-size="10.5" fill="#8b949e">原因：抢的是同一个对象的 this 锁（只有一把）</text>
    <text x="36" y="230" font-family="Consolas,monospace" font-size="10.5" fill="#d29922">MyClass mc = new MyClass();  // 同一个 mc</text>

    <rect x="350" y="116" width="310" height="132" rx="10" fill="#161b22" stroke="#3fb950"/>
    <text x="366" y="138" font-size="12.5" font-weight="bold" fill="#3fb950">② 不同对象 → 不用等</text>
    <text x="366" y="160" font-size="11" fill="#c9d1d9">t2 用 new MyClass() 另一个对象调 m2</text>
    <text x="366" y="180" font-size="11" fill="#c9d1d9"><tspan font-weight="bold">不用等</tspan>，直接进</text>
    <text x="366" y="206" font-size="10.5" fill="#8b949e">原因：两个对象 = 两把不同的 this 锁</text>
    <text x="366" y="230" font-size="10.5" fill="#8b949e">锁是对象级别的，不是方法/类级别的</text>

    <rect x="20" y="262" width="310" height="132" rx="10" fill="#161b22" stroke="#d29922"/>
    <text x="36" y="284" font-size="12.5" font-weight="bold" fill="#d29922">③ 同步方法 vs 非同步方法 → 不拦</text>
    <text x="36" y="306" font-size="11" fill="#c9d1d9">withdraw() 加了锁，getBalance() 没加</text>
    <text x="36" y="326" font-size="11" fill="#c9d1d9">线程 A 在 withdraw 时，线程 B 调</text>
    <text x="36" y="346" font-size="11" fill="#c9d1d9">getBalance() <tspan font-weight="bold">照样进，不阻塞</tspan></text>
    <text x="36" y="372" font-size="10.5" fill="#8b949e">原因：非同步方法根本不参与抢锁</text>

    <rect x="350" y="262" width="310" height="132" rx="10" fill="#161b22" stroke="#bc8cff"/>
    <text x="366" y="284" font-size="12.5" font-weight="bold" fill="#bc8cff">④ 静态同步方法 → 类锁（全局一把）</text>
    <text x="366" y="306" font-size="11" fill="#c9d1d9">static synchronized 锁 MyClass.class</text>
    <text x="366" y="326" font-size="11" fill="#c9d1d9">类只有一个 → 类锁只有一把 → 都得<tspan font-weight="bold">排队</tspan></text>
    <text x="366" y="352" font-size="10.5" fill="#8b949e">注意：类锁和实例的 this 锁是<tspan fill="#bc8cff" font-weight="bold">两把不同的锁</tspan></text>
    <text x="366" y="372" font-size="10.5" fill="#8b949e">一个线程进静态同步方法，另一线程进实例同步方法 → 互不干扰</text>
  </g>

  <rect x="20" y="408" width="640" height="40" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="38" y="428" font-size="11" fill="#c9d1d9">· 引申：实例方法锁固定是 this，不够灵活；<tspan font-family="Consolas,monospace">synchronized(共享对象){...}</tspan> 可自选锁对象和同步范围，更灵活</text>
  <text x="38" y="443" font-size="11" fill="#c9d1d9">· 判断口诀：<tspan fill="#3fb950" font-weight="bold">先找锁是谁 → 同锁才互斥</tspan>，跟几个方法、几个线程无关</text>
</svg>
