<svg viewBox="0 0 680 440" width="680" height="440" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <title>方法调用时引用被复制传参</title>
  <desc>main 和 study 两个栈帧中的 zhangsan 引用都指向堆中同一个 Student 对象</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#D85A30"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="440" fill="#FFFFFF"/>
  <rect x="20" y="20" width="640" height="400" rx="16" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="40" y="48" font-size="16" font-weight="500" fill="#2C2C2A">JVM</text>

  <rect x="50" y="70" width="240" height="330" rx="12" fill="#E6F1FB" stroke="#85B7EB" stroke-width="0.5"/>
  <text x="70" y="96" font-size="14" font-weight="500" fill="#0C447C">虚拟机栈 VM Stack</text>

  <rect x="70" y="120" width="200" height="130" rx="8" fill="#FFFFFF" stroke="#378ADD" stroke-width="0.5"/>
  <text x="90" y="145" font-size="13" font-weight="500" fill="#0C447C">study 方法栈帧</text>
  <text x="90" y="170" font-size="12" fill="#5F5E5A">局部变量 1</text>
  <text x="90" y="188" font-size="12" fill="#5F5E5A">局部变量 2</text>
  <text x="90" y="206" font-size="12" fill="#5F5E5A">局部变量 3</text>
  <ellipse cx="185" cy="228" rx="26" ry="14" fill="#FBEAF0" stroke="#D4537E" stroke-width="0.5"/>
  <text x="185" y="232" font-size="11" text-anchor="middle" fill="#72243E">0x10</text>
  <text x="75" y="232" font-size="12" fill="#2C2C2A">Student zhangsan</text>

  <rect x="70" y="280" width="200" height="100" rx="8" fill="#FFFFFF" stroke="#378ADD" stroke-width="0.5"/>
  <text x="90" y="305" font-size="13" font-weight="500" fill="#0C447C">main 方法栈帧</text>
  <ellipse cx="185" cy="335" rx="26" ry="14" fill="#FBEAF0" stroke="#D4537E" stroke-width="0.5"/>
  <text x="185" y="339" font-size="11" text-anchor="middle" fill="#72243E">0x10</text>
  <text x="75" y="339" font-size="12" fill="#2C2C2A">Student zhangsan</text>

  <rect x="340" y="70" width="300" height="330" rx="12" fill="#FAEEDA" stroke="#EF9F27" stroke-width="0.5"/>
  <text x="360" y="96" font-size="14" font-weight="500" fill="#854F0B">堆 Heap</text>
  <ellipse cx="490" cy="235" rx="110" ry="80" fill="#FFFFFF" stroke="#BA7517" stroke-width="0.5"/>
  <text x="490" y="220" font-size="14" font-weight="500" text-anchor="middle" fill="#4A1B0C">Student 类型对象</text>
  <text x="490" y="245" font-size="13" text-anchor="middle" fill="#5F5E5A">String name = "张三"</text>

  <path d="M211 228 L380 190" fill="none" stroke="#D85A30" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M211 335 L380 280" fill="none" stroke="#D85A30" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="360" y="390" font-size="12" fill="#854F0B">两个 zhangsan 都保存 0x10，指向同一个对象</text>
</svg>
