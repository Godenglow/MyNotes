<svg width="680" height="420" viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#f85149"/>
    </marker>
  </defs>

  <rect width="680" height="420" fill="#0d1117"/>

  <text x="340" y="26" text-anchor="middle" fill="#e6edf3" font-size="16" font-weight="700">自定义异常 · 抛出与捕获流转</text>
  <text x="340" y="44" text-anchor="middle" fill="#8b949e" font-size="11">throw 在方法体内"真出事"，throws 在方法签名上"预告片"，调用方 try-catch 接住</text>

  <!-- 左：UserService（抛出方） -->
  <g filter="url(#shadow)">
    <rect x="40" y="70" width="280" height="190" rx="9" fill="#161b22" stroke="#f85149" stroke-width="1.4"/>
    <text x="180" y="94" text-anchor="middle" fill="#f85149" font-size="12.5" font-weight="700">UserService（抛出方）</text>

    <rect x="56" y="106" width="248" height="30" rx="5" fill="#0d1117" stroke="#30363d"/>
    <text x="180" y="126" text-anchor="middle" fill="#e6edf3" font-size="10.5">throws IllegalNameException, ...</text>
    <text x="180" y="152" text-anchor="middle" fill="#7d8590" font-size="9.5">↑ 方法签名上的"预告片"</text>

    <rect x="56" y="168" width="248" height="34" rx="5" fill="#0d1117" stroke="#f85149" stroke-width="1.2"/>
    <text x="180" y="182" text-anchor="middle" fill="#f85149" font-size="10.5" font-weight="600">throw new IllegalAgeException("...")</text>
    <text x="180" y="196" text-anchor="middle" fill="#7d8590" font-size="9">方法体内的"案发现场"，抛出后立即终止</text>

    <text x="180" y="230" text-anchor="middle" fill="#7d8590" font-size="9.5" font-style="italic">不合法 → 抛出异常对象</text>
  </g>

  <!-- 中：异常对象 -->
  <g filter="url(#shadow)">
    <rect x="270" y="286" width="140" height="44" rx="22" fill="#0d1117" stroke="#f85149" stroke-width="1.5"/>
    <text x="340" y="304" text-anchor="middle" fill="#f85149" font-size="11" font-weight="700">异常对象</text>
    <text x="340" y="320" text-anchor="middle" fill="#8b949e" font-size="9">message = "年龄必须大于18"</text>
  </g>

  <!-- 流转箭头 -->
  <line x1="200" y1="262" x2="290" y2="288" stroke="#f85149" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="400" y1="288" x2="490" y2="262" stroke="#f85149" stroke-width="2" marker-end="url(#ar)"/>
  <text x="330" y="346" text-anchor="middle" fill="#7d8590" font-size="9.5" font-style="italic">沿调用栈向上传递</text>

  <!-- 右：Test.main（捕获方） -->
  <g filter="url(#shadow)">
    <rect x="360" y="70" width="280" height="190" rx="9" fill="#161b22" stroke="#3fb950" stroke-width="1.4"/>
    <text x="500" y="94" text-anchor="middle" fill="#3fb950" font-size="12.5" font-weight="700">Test.main（捕获方）</text>

    <rect x="376" y="106" width="248" height="30" rx="5" fill="#0d1117" stroke="#30363d"/>
    <text x="500" y="126" text-anchor="middle" fill="#e6edf3" font-size="10.5">try { service.register(...) }</text>

    <rect x="376" y="144" width="248" height="30" rx="5" fill="#0d1117" stroke="#3fb950" stroke-width="1.2"/>
    <text x="500" y="164" text-anchor="middle" fill="#3fb950" font-size="10.5">catch (IllegalAgeException e)</text>

    <rect x="376" y="182" width="248" height="30" rx="5" fill="#0d1117" stroke="#30363d"/>
    <text x="500" y="202" text-anchor="middle" fill="#e6edf3" font-size="10.5">e.getMessage() → "年龄必须大于18"</text>

    <text x="500" y="230" text-anchor="middle" fill="#7d8590" font-size="9.5" font-style="italic">编译时异常不写 try-catch → 编译报错</text>
  </g>

  <!-- 底部：throw vs throws -->
  <g filter="url(#shadow)">
    <rect x="40" y="356" width="600" height="46" rx="7" fill="#161b22" stroke="#d29922" stroke-width="1.2"/>
    <text x="340" y="375" text-anchor="middle" fill="#d29922" font-size="11.5" font-weight="600">throw = 案发现场（方法体内，抛对象，立即终止）</text>
    <text x="340" y="394" text-anchor="middle" fill="#58a6ff" font-size="11.5" font-weight="600">throws = 预告片（方法签名上，声明类型，不终止）</text>
  </g>
</svg>
