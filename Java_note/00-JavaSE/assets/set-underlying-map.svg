<svg width="680" height="440" viewBox="0 0 680 440" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#d29922" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="680" height="440" fill="#0d1117"/>

  <text x="340" y="28" text-anchor="middle" fill="#f0f6fc" font-size="16" font-weight="700">Set 的底层真相：Set 就是"只用 key 的 Map"</text>

  <text x="135" y="52" text-anchor="middle" fill="#8b949e" font-size="11.5">Set 集合</text>
  <text x="545" y="52" text-anchor="middle" fill="#8b949e" font-size="11.5">底层 new 出来的 Map</text>

  <g>
    <rect x="20" y="62" width="230" height="84" rx="9" fill="#161b22" stroke="#58a6ff" stroke-width="1.4"/>
    <text x="36" y="86" fill="#58a6ff" font-size="13" font-weight="700">HashSet</text>
    <text x="36" y="106" fill="#e6edf3" font-size="11">无序 · 不可重复</text>
    <text x="36" y="126" fill="#8b949e" font-size="11">特性从哪来？↓ 看右边</text>
  </g>

  <g>
    <rect x="430" y="62" width="230" height="84" rx="9" fill="#161b22" stroke="#58a6ff" stroke-width="1.4"/>
    <text x="446" y="86" fill="#58a6ff" font-size="13" font-weight="700">HashMap</text>
    <text x="446" y="106" fill="#8b949e" font-size="11">底层哈希表</text>
    <text x="446" y="126" fill="#e6edf3" font-size="11">key 无序不可重复 → HashSet 全继承</text>
  </g>

  <line x1="250" y1="104" x2="424" y2="104" stroke="#d29922" stroke-width="1.3" marker-end="url(#arr2)"/>
  <text x="337" y="96" text-anchor="middle" fill="#d29922" font-size="11">new 了一个</text>

  <g>
    <rect x="20" y="166" width="230" height="84" rx="9" fill="#161b22" stroke="#3fb950" stroke-width="1.4"/>
    <text x="36" y="190" fill="#3fb950" font-size="13" font-weight="700">TreeSet</text>
    <text x="36" y="210" fill="#e6edf3" font-size="11">可排序 · 不可重复</text>
    <text x="36" y="230" fill="#8b949e" font-size="11"> Comparable / Comparator 排序</text>
  </g>

  <g>
    <rect x="430" y="166" width="230" height="84" rx="9" fill="#161b22" stroke="#3fb950" stroke-width="1.4"/>
    <text x="446" y="190" fill="#3fb950" font-size="13" font-weight="700">TreeMap</text>
    <text x="446" y="210" fill="#8b949e" font-size="11">底层红黑树</text>
    <text x="446" y="230" fill="#e6edf3" font-size="11">key 可排序不可重复 → TreeSet 全继承</text>
  </g>

  <line x1="250" y1="208" x2="424" y2="208" stroke="#d29922" stroke-width="1.3" marker-end="url(#arr2)"/>
  <text x="337" y="200" text-anchor="middle" fill="#d29922" font-size="11">new 了一个</text>

  <g>
    <rect x="20" y="270" width="230" height="84" rx="9" fill="#161b22" stroke="#bc8cff" stroke-width="1.4"/>
    <text x="36" y="294" fill="#bc8cff" font-size="13" font-weight="700">LinkedHashSet</text>
    <text x="36" y="314" fill="#e6edf3" font-size="11">有序 · 不可重复</text>
    <text x="36" y="334" fill="#8b949e" font-size="11">效率比 HashSet 略低</text>
  </g>

  <g>
    <rect x="430" y="270" width="230" height="84" rx="9" fill="#161b22" stroke="#bc8cff" stroke-width="1.4"/>
    <text x="446" y="294" fill="#bc8cff" font-size="13" font-weight="700">LinkedHashMap</text>
    <text x="446" y="314" fill="#8b949e" font-size="11">双向链表 + 哈希表</text>
    <text x="446" y="334" fill="#e6edf3" font-size="11">key 有序不可重复 → 全继承</text>
  </g>

  <line x1="250" y1="312" x2="424" y2="312" stroke="#d29922" stroke-width="1.3" marker-end="url(#arr2)"/>
  <text x="337" y="304" text-anchor="middle" fill="#d29922" font-size="11">new 了一个</text>

  <g>
    <rect x="20" y="368" width="640" height="56" rx="8" fill="#161b22" stroke="#d29922" stroke-width="1.2"/>
    <text x="36" y="390" fill="#d29922" font-size="11.5" font-family="Consolas, monospace">set.add(e)  →  map.put(e, PRESENT);</text>
    <text x="36" y="410" fill="#e6edf3" font-size="11.5">value 位放固定常量 PRESENT 纯占位 —— 元素存在 key 位，Set 的一切特性都来自 Map 的 key</text>
  </g>
</svg>
