<svg xmlns="http://www.w3.org/2000/svg" width="680" height="352" viewBox="0 0 680 352" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <title>类加载生命周期：加载、验证、准备、解析、初始化</title>
  <rect width="680" height="352" fill="#ffffff"/>
  <defs>
    <marker id="arrowLcF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="40" y="84" width="104" height="56" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
  <text x="92" y="106" font-size="13" font-weight="bold" fill="#2c2c2a" text-anchor="middle" dominant-baseline="central">加载</text>
  <text x="92" y="126" font-size="11" fill="#888780" text-anchor="middle" dominant-baseline="central">读字节流建 Class</text>
  <rect x="160" y="84" width="104" height="56" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
  <text x="212" y="106" font-size="13" font-weight="bold" fill="#2c2c2a" text-anchor="middle" dominant-baseline="central">验证</text>
  <text x="212" y="126" font-size="11" fill="#888780" text-anchor="middle" dominant-baseline="central">四道校验</text>
  <rect x="280" y="84" width="104" height="56" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
  <text x="332" y="106" font-size="13" font-weight="bold" fill="#2c2c2a" text-anchor="middle" dominant-baseline="central">准备</text>
  <text x="332" y="126" font-size="11" fill="#888780" text-anchor="middle" dominant-baseline="central">静态字段默认值</text>
  <rect x="400" y="84" width="104" height="56" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
  <text x="452" y="106" font-size="13" font-weight="bold" fill="#2c2c2a" text-anchor="middle" dominant-baseline="central">解析</text>
  <text x="452" y="126" font-size="11" fill="#888780" text-anchor="middle" dominant-baseline="central">符号 → 直接引用</text>
  <rect x="520" y="84" width="104" height="56" rx="8" fill="#e6f1fb" stroke="#185fa5" stroke-width="0.5"/>
  <text x="572" y="106" font-size="13" font-weight="bold" fill="#0c447c" text-anchor="middle" dominant-baseline="central">初始化</text>
  <text x="572" y="126" font-size="11" fill="#888780" text-anchor="middle" dominant-baseline="central">执行 &lt;clinit&gt;()</text>

  <path d="M146 112 L158 112" fill="none" stroke="#888780" stroke-width="1.2" marker-end="url(#arrowLcF)"/>
  <path d="M266 112 L278 112" fill="none" stroke="#888780" stroke-width="1.2" marker-end="url(#arrowLcF)"/>
  <path d="M386 112 L398 112" fill="none" stroke="#888780" stroke-width="1.2" marker-end="url(#arrowLcF)"/>
  <path d="M506 112 L518 112" fill="none" stroke="#888780" stroke-width="1.2" marker-end="url(#arrowLcF)"/>

  <path d="M160 146 L160 152 L504 152 L504 146" fill="none" stroke="#b4b2a9" stroke-width="0.5"/>
  <text x="332" y="170" font-size="11" fill="#888780" text-anchor="middle">链接（Linking）= 验证 + 准备 + 解析</text>

  <text x="40" y="200" font-size="12" fill="#888780">加载：全限定名 → 字节流（jar / class / 网络）→ 方法区数据结构 + 堆里的 Class 对象；可自定义加载器参与</text>
  <text x="40" y="222" font-size="12" fill="#888780">验证：文件格式 / 元数据 / 字节码 / 符号引用，四道校验防恶意字节码</text>
  <text x="40" y="244" font-size="12" fill="#888780">准备：静态字段分配内存设默认值（int=0）；static final 编译期常量此时直接赋真值</text>
  <text x="40" y="266" font-size="12" fill="#888780">解析：常量池符号引用替换为直接引用（指针 / 偏移量 / 句柄）</text>
  <text x="40" y="288" font-size="12" fill="#888780">初始化：执行 &lt;clinit&gt;() —— 静态赋值 + static 块，父类先执行；JVM 保证加锁 → 有类初始化死锁坑</text>
  <text x="40" y="310" font-size="12" fill="#888780">使用 → 卸载：实例全回收 + ClassLoader 被回收 + Class 无引用，三者同时满足才可能卸载</text>
  <text x="40" y="332" font-size="12" fill="#888780">触发初始化要主动引用：new / 反射 / main / 访问非常量静态字段；new Sub[10]、访问编译期常量不触发</text>
</svg>
