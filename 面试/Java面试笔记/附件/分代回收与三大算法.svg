<svg xmlns="http://www.w3.org/2000/svg" width="680" height="392" viewBox="0 0 680 392" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <title>分代回收模型：Eden、Survivor、老年代与三大回收算法</title>
  <rect width="680" height="392" fill="#ffffff"/>

  <text x="40" y="52" font-size="14" font-weight="bold" fill="#2c2c2a">怎么收：分代模型 + 三大算法</text>

  <rect x="40" y="76" width="600" height="140" rx="12" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
  <text x="56" y="98" font-size="12" font-weight="bold" fill="#2c2c2a">堆</text>
  <rect x="60" y="100" width="400" height="106" rx="8" fill="#e6f1fb" stroke="#185fa5" stroke-width="0.5"/>
  <text x="260" y="118" font-size="12" font-weight="bold" fill="#0c447c" text-anchor="middle">新生代</text>
  <rect x="76" y="130" width="180" height="64" rx="6" fill="#ffffff" stroke="#888780" stroke-width="0.5"/>
  <text x="166" y="160" font-size="12" fill="#444441" text-anchor="middle" dominant-baseline="central">Eden（新对象出生）</text>
  <rect x="266" y="130" width="90" height="64" rx="6" fill="#ffffff" stroke="#888780" stroke-width="0.5"/>
  <text x="311" y="160" font-size="12" fill="#444441" text-anchor="middle" dominant-baseline="central">S0</text>
  <rect x="366" y="130" width="86" height="64" rx="6" fill="#ffffff" stroke="#888780" stroke-width="0.5"/>
  <text x="409" y="160" font-size="12" fill="#444441" text-anchor="middle" dominant-baseline="central">S1</text>
  <rect x="480" y="100" width="150" height="106" rx="8" fill="#faeeda" stroke="#ba7517" stroke-width="0.5"/>
  <text x="555" y="142" font-size="12" font-weight="bold" fill="#633806" text-anchor="middle" dominant-baseline="central">老年代</text>
  <text x="555" y="162" font-size="11" fill="#888780" text-anchor="middle" dominant-baseline="central">长寿对象 / 大对象</text>

  <text x="40" y="238" font-size="12" fill="#888780">Eden 满 → Minor GC：存活对象复制进 S 区、年龄 +1，默认 15 岁晋升老年代</text>
  <text x="40" y="260" font-size="12" fill="#888780">老年代满 / System.gc() → Full GC：整堆回收最慢，调优就是让它少发生（STW 是停顿根源）</text>

  <rect x="40" y="284" width="200" height="56" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
  <text x="52" y="304" font-size="12" font-weight="bold" fill="#2c2c2a">标记-清除</text>
  <text x="52" y="322" font-size="11" fill="#888780">简单；产生内存碎片</text>
  <rect x="250" y="284" width="200" height="56" rx="8" fill="#e6f1fb" stroke="#185fa5" stroke-width="0.5"/>
  <text x="262" y="304" font-size="12" font-weight="bold" fill="#0c447c">标记-复制</text>
  <text x="262" y="322" font-size="11" fill="#888780">新生代用；无碎片，浪费空间</text>
  <rect x="460" y="284" width="200" height="56" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
  <text x="472" y="304" font-size="12" font-weight="bold" fill="#2c2c2a">标记-整理</text>
  <text x="472" y="322" font-size="11" fill="#888780">老年代用；移动对象，无碎片</text>

  <text x="40" y="372" font-size="12" fill="#888780">收集器演进：Serial → Parallel → CMS（已移除）→ G1（JDK 9+ 默认）→ ZGC（亚毫秒停顿）</text>
</svg>
