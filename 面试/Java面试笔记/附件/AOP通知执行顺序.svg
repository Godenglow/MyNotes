<svg xmlns="http://www.w3.org/2000/svg" width="680" height="262" viewBox="0 0 680 262" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <title>AOP 五种通知执行顺序：成功路径与异常路径</title>
  <rect width="680" height="262" fill="#ffffff"/>
  <defs>
    <marker id="arrowAdvF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="40" y="44" font-size="14" font-weight="bold" fill="#2c2c2a">五种通知的执行顺序（同一切面）</text>

  <rect x="40" y="76" width="90" height="44" rx="8" fill="#e6f1fb" stroke="#185fa5" stroke-width="0.5"/>
  <text x="85" y="92" font-size="11" fill="#0c447c" text-anchor="middle" dominant-baseline="central">@Around</text>
  <text x="85" y="108" font-size="11" fill="#888780" text-anchor="middle" dominant-baseline="central">前半（可改参）</text>
  <rect x="141" y="76" width="90" height="44" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
  <text x="186" y="92" font-size="11" fill="#2c2c2a" text-anchor="middle" dominant-baseline="central">@Before</text>
  <text x="186" y="108" font-size="11" fill="#888780" text-anchor="middle" dominant-baseline="central">方法执行前</text>
  <rect x="242" y="76" width="90" height="44" rx="8" fill="#faeeda" stroke="#ba7517" stroke-width="0.5"/>
  <text x="287" y="92" font-size="11" fill="#633806" text-anchor="middle" dominant-baseline="central">目标方法</text>
  <text x="287" y="108" font-size="11" fill="#888780" text-anchor="middle" dominant-baseline="central">proceed() 处</text>
  <rect x="343" y="76" width="90" height="44" rx="8" fill="#e6f1fb" stroke="#185fa5" stroke-width="0.5"/>
  <text x="388" y="92" font-size="11" fill="#0c447c" text-anchor="middle" dominant-baseline="central">@Around</text>
  <text x="388" y="108" font-size="11" fill="#888780" text-anchor="middle" dominant-baseline="central">后半（可改返回值）</text>
  <rect x="444" y="76" width="90" height="44" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
  <text x="489" y="92" font-size="11" fill="#2c2c2a" text-anchor="middle" dominant-baseline="central">@After</text>
  <text x="489" y="108" font-size="11" fill="#888780" text-anchor="middle" dominant-baseline="central">相当于 finally</text>
  <rect x="545" y="76" width="95" height="44" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
  <text x="592" y="92" font-size="11" fill="#085041" text-anchor="middle" dominant-baseline="central">@AfterReturning</text>
  <text x="592" y="108" font-size="11" fill="#888780" text-anchor="middle" dominant-baseline="central">拿到返回值</text>
  <path d="M132 98 L139 98" fill="none" stroke="#888780" stroke-width="1.2" marker-end="url(#arrowAdvF)"/>
  <path d="M233 98 L240 98" fill="none" stroke="#888780" stroke-width="1.2" marker-end="url(#arrowAdvF)"/>
  <path d="M334 98 L341 98" fill="none" stroke="#888780" stroke-width="1.2" marker-end="url(#arrowAdvF)"/>
  <path d="M435 98 L442 98" fill="none" stroke="#888780" stroke-width="1.2" marker-end="url(#arrowAdvF)"/>
  <path d="M536 98 L543 98" fill="none" stroke="#888780" stroke-width="1.2" marker-end="url(#arrowAdvF)"/>

  <text x="40" y="152" font-size="12" fill="#0f6e56">正常返回走上面整条链；目标方法抛异常时：Around 后半不执行 → AfterThrowing → After</text>

  <rect x="287" y="176" width="90" height="40" rx="8" fill="#fcebeb" stroke="#a32d2d" stroke-width="0.5"/>
  <text x="332" y="192" font-size="11" fill="#791f1f" text-anchor="middle" dominant-baseline="central">抛出异常</text>
  <text x="332" y="206" font-size="11" fill="#888780" text-anchor="middle" dominant-baseline="central">proceed() 向上抛</text>
  <path d="M285 196 L216 196 L216 224" fill="none" stroke="#a32d2d" stroke-width="1.2" marker-end="url(#arrowAdvF)"/>
  <rect x="171" y="226" width="90" height="32" rx="8" fill="#fcebeb" stroke="#a32d2d" stroke-width="0.5"/>
  <text x="216" y="242" font-size="11" fill="#791f1f" text-anchor="middle" dominant-baseline="central">@AfterThrowing</text>
  <path d="M171 242 L150 242 L150 106" fill="none" stroke="#888780" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrowAdvF)"/>
  <text x="155" y="180" font-size="11" fill="#888780" text-anchor="end">随后 @After（finally 语义）</text>
</svg>
