<svg xmlns="http://www.w3.org/2000/svg" width="880" height="540" viewBox="0 0 880 540" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
    <marker id="arrow3b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>
  <rect width="880" height="540" fill="#ffffff"/>

  <!-- 左侧：class 文件 -->
  <rect x="30" y="60" width="140" height="56" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="100" y="93" font-size="14" text-anchor="middle" fill="#333333">Person.class</text>

  <rect x="30" y="220" width="140" height="56" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="100" y="253" font-size="14" text-anchor="middle" fill="#333333">Car.class</text>
  <text x="100" y="300" font-size="12" text-anchor="middle" fill="#c0392b">class 文件来源于本地、网络等</text>

  <!-- 类加载箭头 -->
  <line x1="170" y1="88" x2="270" y2="150" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow3)"/>
  <line x1="170" y1="248" x2="270" y2="190" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow3)"/>
  <text x="190" y="128" font-size="13" fill="#c0392b">类加载</text>
  <text x="190" y="148" font-size="11" fill="#c0392b">ClassLoader</text>

  <!-- 内存大框 -->
  <rect x="275" y="40" width="590" height="330" rx="8" fill="#fafafa" stroke="#333333" stroke-width="1.5"/>
  <text x="570" y="65" font-size="14" text-anchor="middle" fill="#888888">内存</text>

  <!-- 方法区 -->
  <rect x="295" y="80" width="150" height="260" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="370" y="105" font-size="14" text-anchor="middle" fill="#333333">方法区</text>
  <rect x="310" y="130" width="120" height="52" rx="4" fill="#dce8f7" stroke="#333333" stroke-width="1"/>
  <text x="370" y="152" font-size="12" text-anchor="middle" fill="#333333">Car 类元数据</text>
  <text x="370" y="169" font-size="11" text-anchor="middle" fill="#555555">字段 / 方法信息</text>
  <rect x="310" y="200" width="120" height="52" rx="4" fill="#dce8f7" stroke="#333333" stroke-width="1"/>
  <text x="370" y="222" font-size="12" text-anchor="middle" fill="#333333">Person 类元数据</text>
  <text x="370" y="239" font-size="11" text-anchor="middle" fill="#555555">字段 / 方法信息</text>

  <line x1="445" y1="210" x2="490" y2="210" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow3b)"/>

  <!-- 堆区 -->
  <rect x="495" y="80" width="350" height="260" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="670" y="105" font-size="14" text-anchor="middle" fill="#333333">堆区</text>

  <!-- 实例对象 -->
  <rect x="510" y="120" width="110" height="44" rx="4" fill="#d5ead1" stroke="#333333" stroke-width="1"/>
  <text x="565" y="139" font-size="12" text-anchor="middle" fill="#333333">P1 - Person</text>
  <text x="565" y="155" font-size="11" text-anchor="middle" fill="#555555">实例对象</text>
  <rect x="510" y="176" width="110" height="44" rx="4" fill="#d5ead1" stroke="#333333" stroke-width="1"/>
  <text x="565" y="195" font-size="12" text-anchor="middle" fill="#333333">P2 - Person</text>
  <text x="565" y="211" font-size="11" text-anchor="middle" fill="#555555">实例对象</text>
  <rect x="510" y="232" width="110" height="44" rx="4" fill="#d5ead1" stroke="#333333" stroke-width="1"/>
  <text x="565" y="251" font-size="12" text-anchor="middle" fill="#333333">Pn - Person</text>
  <text x="565" y="267" font-size="11" text-anchor="middle" fill="#555555">实例对象</text>

  <rect x="630" y="120" width="110" height="44" rx="4" fill="#d5ead1" stroke="#333333" stroke-width="1"/>
  <text x="685" y="139" font-size="12" text-anchor="middle" fill="#333333">C1 - Car</text>
  <text x="685" y="155" font-size="11" text-anchor="middle" fill="#555555">实例对象</text>
  <rect x="630" y="176" width="110" height="44" rx="4" fill="#d5ead1" stroke="#333333" stroke-width="1"/>
  <text x="685" y="195" font-size="12" text-anchor="middle" fill="#333333">C2 - Car</text>
  <text x="685" y="211" font-size="11" text-anchor="middle" fill="#555555">实例对象</text>
  <rect x="630" y="232" width="110" height="44" rx="4" fill="#d5ead1" stroke="#333333" stroke-width="1"/>
  <text x="685" y="251" font-size="12" text-anchor="middle" fill="#333333">Cn - Car</text>
  <text x="685" y="267" font-size="11" text-anchor="middle" fill="#555555">实例对象</text>

  <!-- Class 对象（唯一） -->
  <rect x="750" y="120" width="88" height="60" rx="4" fill="#fdf1cf" stroke="#333333" stroke-width="1"/>
  <text x="794" y="144" font-size="12" text-anchor="middle" fill="#333333">Person 的</text>
  <text x="794" y="161" font-size="12" text-anchor="middle" fill="#c0392b">Class 对象</text>
  <text x="794" y="176" font-size="11" text-anchor="middle" fill="#555555">（唯一）</text>

  <rect x="750" y="200" width="88" height="60" rx="4" fill="#fdf1cf" stroke="#333333" stroke-width="1"/>
  <text x="794" y="224" font-size="12" text-anchor="middle" fill="#333333">Car 的</text>
  <text x="794" y="241" font-size="12" text-anchor="middle" fill="#c0392b">Class 对象</text>
  <text x="794" y="256" font-size="11" text-anchor="middle" fill="#555555">（唯一）</text>

  <!-- 底部注释 -->
  <line x1="670" y1="300" x2="670" y2="380" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow3)"/>
  <rect x="180" y="385" width="520" height="76" rx="8" fill="#fdf1cf" stroke="#c0392b" stroke-width="1.5"/>
  <text x="440" y="415" font-size="14" font-weight="bold" text-anchor="middle" fill="#c0392b">反射：获取 Class 对象（一个类在 JVM 里只有一个）</text>
  <text x="440" y="440" font-size="13" text-anchor="middle" fill="#c0392b">就能拿到类内部信息（方法、属性、构造函数），反向操控实例对象</text>
</svg>
