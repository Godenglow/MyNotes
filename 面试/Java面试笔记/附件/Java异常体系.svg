<svg xmlns="http://www.w3.org/2000/svg" width="840" height="560" viewBox="0 0 840 560" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="arrow5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666666"/>
    </marker>
  </defs>
  <rect width="840" height="560" fill="#ffffff"/>

  <!-- Throwable -->
  <rect x="330" y="36" width="180" height="54" rx="8" fill="#eef3fb" stroke="#2c5aa0" stroke-width="2"/>
  <text x="420" y="69" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c5aa0">Throwable</text>

  <!-- 连线 -->
  <line x1="370" y1="90" x2="225" y2="160" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow5)"/>
  <line x1="470" y1="90" x2="510" y2="160" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow5)"/>
  <line x1="490" y1="222" x2="430" y2="310" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow5)"/>
  <line x1="550" y1="222" x2="610" y2="310" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow5)"/>

  <!-- Error -->
  <rect x="130" y="165" width="190" height="72" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="1.8"/>
  <text x="225" y="193" font-size="15" font-weight="bold" text-anchor="middle" fill="#c0392b">Error（严重错误）</text>
  <text x="225" y="217" font-size="12" text-anchor="middle" fill="#555555">OutOfMemoryError</text>
  <text x="225" y="235" font-size="12" text-anchor="middle" fill="#555555">StackOverflowError</text>

  <!-- Exception -->
  <rect x="430" y="165" width="170" height="54" rx="8" fill="#ffffff" stroke="#2c5aa0" stroke-width="1.8"/>
  <text x="515" y="198" font-size="15" font-weight="bold" text-anchor="middle" fill="#2c5aa0">Exception</text>

  <!-- RuntimeException -->
  <rect x="280" y="315" width="250" height="88" rx="8" fill="#ffffff" stroke="#e67e22" stroke-width="1.8"/>
  <text x="405" y="343" font-size="15" font-weight="bold" text-anchor="middle" fill="#e67e22">RuntimeException</text>
  <text x="405" y="365" font-size="12" text-anchor="middle" fill="#555555">NullPointerException / 数组越界</text>
  <text x="405" y="385" font-size="12" text-anchor="middle" fill="#555555">ClassCastException / 算术异常</text>

  <!-- checked -->
  <rect x="560" y="315" width="230" height="88" rx="8" fill="#ffffff" stroke="#1a7f37" stroke-width="1.8"/>
  <text x="675" y="343" font-size="15" font-weight="bold" text-anchor="middle" fill="#1a7f37">其他 Exception（checked）</text>
  <text x="675" y="365" font-size="12" text-anchor="middle" fill="#555555">IOException / SQLException</text>
  <text x="675" y="385" font-size="12" text-anchor="middle" fill="#555555">ClassNotFoundException</text>

  <!-- 底部分类说明 -->
  <rect x="120" y="440" width="280" height="80" rx="8" fill="#f5f5f5" stroke="#888888" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="260" y="470" font-size="14" font-weight="bold" text-anchor="middle" fill="#333333">Unchecked（不检查异常）</text>
  <text x="260" y="494" font-size="12" text-anchor="middle" fill="#555555">Error + RuntimeException 及其子类</text>
  <text x="260" y="512" font-size="12" text-anchor="middle" fill="#c0392b">编译器不强制处理，不用 throws 声明</text>

  <rect x="440" y="440" width="280" height="80" rx="8" fill="#f5f5f5" stroke="#888888" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="580" y="470" font-size="14" font-weight="bold" text-anchor="middle" fill="#333333">Checked（受检异常）</text>
  <text x="580" y="494" font-size="12" text-anchor="middle" fill="#555555">Exception 中排除 RuntimeException</text>
  <text x="580" y="512" font-size="12" text-anchor="middle" fill="#1a7f37">编译器强制 try-catch 或 throws 声明</text>
</svg>
