<svg xmlns="http://www.w3.org/2000/svg" width="680" height="374" viewBox="0 0 680 374" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <title>AQS 核心模型：state、CLH 双向等待队列、LockSupport park/unpark</title>
  <rect width="680" height="374" fill="#ffffff"/>
  <defs>
    <marker id="arrowAqsF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>.mono{font-family:Consolas,'Courier New',monospace}</style>

  <text x="40" y="52" font-size="14" font-weight="bold" fill="#2c2c2a">AQS 核心模型：state + CLH 队列 + park/unpark</text>

  <text x="70" y="80" font-size="11" fill="#888780" text-anchor="middle">竞争线程</text>
  <rect x="40" y="90" width="60" height="30" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
  <text x="70" y="105" font-size="12" fill="#444441" text-anchor="middle" dominant-baseline="central">T1</text>
  <rect x="40" y="140" width="60" height="30" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
  <text x="70" y="155" font-size="12" fill="#444441" text-anchor="middle" dominant-baseline="central">T2</text>

  <text class="mono" x="179" y="92" font-size="11" fill="#888780" text-anchor="middle">CAS: state 0→1</text>
  <path d="M102 105 L256 110" fill="none" stroke="#888780" stroke-width="1.2" marker-end="url(#arrowAqsF)"/>
  <path d="M102 155 L256 132" fill="none" stroke="#888780" stroke-width="1.2" marker-end="url(#arrowAqsF)"/>

  <rect x="260" y="90" width="210" height="60" rx="8" fill="#e6f1fb" stroke="#185fa5" stroke-width="0.5"/>
  <text class="mono" x="365" y="112" font-size="12" font-weight="bold" fill="#0c447c" text-anchor="middle" dominant-baseline="central">state (volatile int)</text>
  <text x="365" y="132" font-size="11" fill="#888780" text-anchor="middle" dominant-baseline="central">0=无锁，&gt;0=重入计数</text>

  <path d="M472 120 L516 120" fill="none" stroke="#888780" stroke-width="1.2" marker-end="url(#arrowAqsF)"/>
  <text x="494" y="108" font-size="11" fill="#888780" text-anchor="middle">成功</text>

  <rect x="520" y="90" width="120" height="60" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
  <text x="580" y="112" font-size="12" font-weight="bold" fill="#2c2c2a" text-anchor="middle" dominant-baseline="central">持锁成功</text>
  <text x="580" y="132" font-size="11" fill="#888780" text-anchor="middle" dominant-baseline="central">独占线程记为 T1</text>

  <text x="163" y="210" font-size="11" fill="#888780" text-anchor="middle">CAS 失败，入队尾</text>
  <path d="M70 172 L70 255 L256 255" fill="none" stroke="#888780" stroke-width="1.2" marker-end="url(#arrowAqsF)"/>

  <rect x="260" y="225" width="210" height="80" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
  <text x="365" y="249" font-size="12" font-weight="bold" fill="#2c2c2a" text-anchor="middle" dominant-baseline="central">CLH 双向等待队列</text>
  <text x="365" y="267" font-size="11" fill="#888780" text-anchor="middle" dominant-baseline="central">Node：线程 + 等待状态</text>
  <text class="mono" x="365" y="285" font-size="11" fill="#888780" text-anchor="middle" dominant-baseline="central">LockSupport.park() 挂起</text>

  <path d="M365 152 L365 221" fill="none" stroke="#888780" stroke-width="1.2" marker-end="url(#arrowAqsF)"/>
  <text x="375" y="196" font-size="11" fill="#888780">state 归 0 → unpark 队头后继</text>

  <text x="40" y="332" font-size="12" fill="#888780">可中断：park 中被 interrupt 唤醒（lockInterruptibly）；超时：tryLockNanos 限时循环</text>
  <text x="40" y="354" font-size="12" fill="#888780">公平/非公平只差一步：非公平进队列前先 CAS 插队一次，公平先查队列有没有人排队</text>
</svg>
