<svg xmlns="http://www.w3.org/2000/svg" width="680" height="598" viewBox="0 0 680 598" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <title>SpringMVC 工作流程：DispatcherServlet 八步处理链路</title>
  <rect width="680" height="598" fill="#ffffff"/>
  <defs>
    <marker id="arrowMvF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>.mono{font-family:Consolas,'Courier New',monospace}</style>

  <text x="40" y="44" font-size="14" font-weight="bold" fill="#2c2c2a">SpringMVC 工作流程：一切请求汇聚到前端控制器</text>

  <rect x="40" y="90" width="100" height="60" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
  <text x="90" y="120" font-size="12" fill="#444441" text-anchor="middle" dominant-baseline="central">用户</text>
  <rect x="250" y="230" width="180" height="70" rx="8" fill="#e6f1fb" stroke="#185fa5" stroke-width="0.5"/>
  <text class="mono" x="340" y="252" font-size="12" font-weight="bold" fill="#0c447c" text-anchor="middle" dominant-baseline="central">DispatcherServlet</text>
  <text x="340" y="272" font-size="11" fill="#888780" text-anchor="middle" dominant-baseline="central">前端控制器（总调度）</text>
  <rect x="520" y="90" width="120" height="60" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
  <text class="mono" x="580" y="112" font-size="12" fill="#444441" text-anchor="middle" dominant-baseline="central">HandlerMapping</text>
  <text x="580" y="132" font-size="11" fill="#888780" text-anchor="middle" dominant-baseline="central">处理器映射器</text>
  <rect x="520" y="230" width="120" height="60" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
  <text class="mono" x="580" y="252" font-size="12" fill="#444441" text-anchor="middle" dominant-baseline="central">HandlerAdapter</text>
  <text x="580" y="272" font-size="11" fill="#888780" text-anchor="middle" dominant-baseline="central">处理器适配器</text>
  <rect x="520" y="370" width="120" height="60" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
  <text x="580" y="392" font-size="12" fill="#444441" text-anchor="middle" dominant-baseline="central">Handler</text>
  <text x="580" y="410" font-size="11" fill="#888780" text-anchor="middle" dominant-baseline="central">Controller 业务方法</text>
  <rect x="250" y="430" width="180" height="60" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
  <text class="mono" x="340" y="452" font-size="12" fill="#444441" text-anchor="middle" dominant-baseline="central">ViewResolver</text>
  <text x="340" y="472" font-size="11" fill="#888780" text-anchor="middle" dominant-baseline="central">视图解析器</text>
  <rect x="40" y="430" width="150" height="60" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
  <text x="115" y="452" font-size="12" font-weight="bold" fill="#085041" text-anchor="middle" dominant-baseline="central">View 视图</text>
  <text x="115" y="472" font-size="11" fill="#888780" text-anchor="middle" dominant-baseline="central">渲染：填充 Model 数据</text>

  <path d="M142 118 L246 232" fill="none" stroke="#888780" stroke-width="1.2" marker-end="url(#arrowMvF)"/>
  <text x="186" y="166" font-size="11" fill="#444441" text-anchor="middle">①</text>
  <path d="M420 228 L530 152" fill="none" stroke="#888780" stroke-width="1.2" marker-end="url(#arrowMvF)"/>
  <text x="450" y="186" font-size="11" fill="#444441" text-anchor="middle">②</text>
  <path d="M516 142 L438 228" fill="none" stroke="#888780" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrowMvF)"/>
  <text x="425" y="208" font-size="11" fill="#444441" text-anchor="middle">③</text>
  <path d="M432 268 L516 262" fill="none" stroke="#888780" stroke-width="1.2" marker-end="url(#arrowMvF)"/>
  <text x="470" y="254" font-size="11" fill="#444441" text-anchor="middle">④</text>
  <path d="M582 292 L582 366" fill="none" stroke="#888780" stroke-width="1.2" marker-end="url(#arrowMvF)"/>
  <text x="592" y="330" font-size="11" fill="#444441">⑤</text>
  <path d="M514 398 L436 298" fill="none" stroke="#888780" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrowMvF)"/>
  <text x="452" y="356" font-size="11" fill="#444441" text-anchor="middle">⑥</text>
  <text x="440" y="384" font-size="11" fill="#888780" text-anchor="end">返回 ModelAndView</text>
  <path d="M320 302 L330 426" fill="none" stroke="#888780" stroke-width="1.2" marker-end="url(#arrowMvF)"/>
  <text x="330" y="364" font-size="11" fill="#444441">⑦</text>
  <path d="M90 428 L90 154" fill="none" stroke="#888780" stroke-width="1.2" marker-end="url(#arrowMvF)"/>
  <text x="98" y="280" font-size="11" fill="#444441">⑧</text>

  <text x="40" y="530" font-size="11" fill="#888780">拦截器三时机：preHandle（④ 前）→ postHandle（⑤ 后）→ afterCompletion（渲染后）</text>
  <text x="40" y="554" font-size="11" fill="#0f6e56">前后端分离：@RestController 跳过 ⑥⑦⑧ —— HttpMessageConverter 直接写 JSON 返回</text>
  <text x="40" y="578" font-size="11" fill="#888780">三大组件（HandlerMapping / HandlerAdapter / ViewResolver）都可插拔、可自定义</text>
</svg>
