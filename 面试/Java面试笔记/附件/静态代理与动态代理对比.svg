<svg xmlns="http://www.w3.org/2000/svg" width="680" height="312" viewBox="0 0 680 312" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <title>静态代理与动态代理对比：编译期一对一、运行时一份逻辑复用</title>
  <rect width="680" height="312" fill="#ffffff"/>
  <defs>
    <marker id="arrowSpF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>.mono{font-family:Consolas,'Courier New',monospace}</style>

  <text x="40" y="44" font-size="14" font-weight="bold" fill="#2c2c2a">静态代理 vs 动态代理</text>

  <text x="40" y="72" font-size="12" font-weight="bold" fill="#2c2c2a">静态代理：编译期写死，一比一</text>
  <rect x="40" y="88" width="140" height="44" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
  <text x="110" y="106" font-size="12" fill="#444441" text-anchor="middle" dominant-baseline="central">LogProxy（手写）</text>
  <text x="110" y="122" font-size="11" fill="#888780" text-anchor="middle" dominant-baseline="central">编译期确定</text>
  <path d="M182 110 L238 110" fill="none" stroke="#888780" stroke-width="1.2" marker-end="url(#arrowSpF)"/>
  <text x="210" y="100" font-size="11" fill="#888780" text-anchor="middle">调用</text>
  <rect x="240" y="88" width="140" height="44" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
  <text x="310" y="106" font-size="12" fill="#444441" text-anchor="middle" dominant-baseline="central">UserServiceImpl</text>
  <text x="310" y="122" font-size="11" fill="#888780" text-anchor="middle" dominant-baseline="central">只能代理这一个类</text>
  <text x="40" y="156" font-size="11" fill="#888780">每个横切 × 每个目标类都要手写一个代理，接口一改两头改</text>

  <text x="360" y="72" font-size="12" font-weight="bold" fill="#2c2c2a">动态代理：运行时生成，一份逻辑复用</text>
  <rect x="360" y="88" width="140" height="44" rx="8" fill="#e6f1fb" stroke="#185fa5" stroke-width="0.5"/>
  <text class="mono" x="430" y="106" font-size="12" fill="#0c447c" text-anchor="middle" dominant-baseline="central">$Proxy0</text>
  <text x="430" y="122" font-size="11" fill="#888780" text-anchor="middle" dominant-baseline="central">运行时生成</text>
  <path d="M502 110 L538 110" fill="none" stroke="#888780" stroke-width="1.2" marker-end="url(#arrowSpF)"/>
  <rect x="540" y="88" width="100" height="44" rx="8" fill="#e6f1fb" stroke="#185fa5" stroke-width="0.5"/>
  <text x="590" y="106" font-size="11" fill="#0c447c" text-anchor="middle" dominant-baseline="central">InvocationHandler</text>
  <text x="590" y="122" font-size="11" fill="#888780" text-anchor="middle" dominant-baseline="central">一份增强逻辑</text>
  <text x="360" y="150" font-size="11" fill="#888780">横切逻辑写一次，运行时套到任意类上</text>
  <text x="360" y="166" font-size="11" fill="#888780">Spring AOP、MyBatis Mapper 都这么干</text>

  <text class="mono" x="40" y="206" font-size="11" fill="#444441">proxy.method(args) → handler.invoke(proxy, method, args) → method.invoke(target, args)</text>

  <rect x="40" y="236" width="300" height="56" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
  <text x="52" y="256" font-size="12" font-weight="bold" fill="#2c2c2a">静态代理</text>
  <text x="52" y="274" font-size="11" fill="#888780">编译期确定；一对一；样板代码多</text>
  <rect x="360" y="236" width="300" height="56" rx="8" fill="#e6f1fb" stroke="#185fa5" stroke-width="0.5"/>
  <text x="372" y="256" font-size="12" font-weight="bold" fill="#0c447c">动态代理</text>
  <text x="372" y="274" font-size="11" fill="#888780">运行期生成；一份 handler 服务 N 个目标</text>
</svg>
