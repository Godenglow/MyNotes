<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="arrow9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2c5aa0"/>
    </marker>
    <marker id="arrow9g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/>
    </marker>
  </defs>
  <rect width="980" height="560" fill="#ffffff"/>

  <!-- JVM 1 -->
  <rect x="30" y="90" width="230" height="250" rx="10" fill="#fafafa" stroke="#333333" stroke-width="1.5"/>
  <text x="145" y="120" font-size="15" font-weight="bold" text-anchor="middle" fill="#333333">JVM 1（进程 A）</text>
  <rect x="55" y="140" width="180" height="130" rx="6" fill="#eef3fb" stroke="#2c5aa0" stroke-width="1.5"/>
  <text x="145" y="166" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c5aa0">Person 对象</text>
  <text x="145" y="192" font-size="13" text-anchor="middle" fill="#555555">name = 大山</text>
  <text x="145" y="214" font-size="13" text-anchor="middle" fill="#555555">age = 25</text>
  <text x="145" y="236" font-size="13" text-anchor="middle" fill="#555555">password = transient</text>
  <text x="145" y="258" font-size="12" text-anchor="middle" fill="#888888">password 不参与序列化</text>
  <text x="145" y="315" font-size="13" text-anchor="middle" fill="#888888">只活在堆里，出不了进程</text>

  <!-- JVM 2 -->
  <rect x="720" y="90" width="230" height="250" rx="10" fill="#fafafa" stroke="#333333" stroke-width="1.5"/>
  <text x="835" y="120" font-size="15" font-weight="bold" text-anchor="middle" fill="#333333">JVM 2（进程 B）</text>
  <rect x="745" y="140" width="180" height="130" rx="6" fill="#eef3fb" stroke="#2c5aa0" stroke-width="1.5"/>
  <text x="835" y="166" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c5aa0">Person 对象（复原）</text>
  <text x="835" y="192" font-size="13" text-anchor="middle" fill="#555555">name = 大山</text>
  <text x="835" y="214" font-size="13" text-anchor="middle" fill="#555555">age = 25</text>
  <text x="835" y="236" font-size="13" text-anchor="middle" fill="#555555">password = null</text>
  <text x="835" y="258" font-size="12" text-anchor="middle" fill="#888888">transient 字段丢失</text>
  <text x="835" y="315" font-size="13" text-anchor="middle" fill="#888888">由字节流重建，构造器不执行</text>

  <!-- 序列化箭头 -->
  <line x1="260" y1="180" x2="395" y2="180" stroke="#2c5aa0" stroke-width="2.5" marker-end="url(#arrow9)"/>
  <text x="328" y="150" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c5aa0">序列化</text>
  <text x="328" y="172" font-size="12" text-anchor="middle" fill="#2c5aa0">writeObject()</text>
  <text x="490" y="248" font-size="13" text-anchor="middle" fill="#888888">打包：类元信息 + 字段值</text>

  <!-- 字节流 -->
  <rect x="405" y="145" width="170" height="70" rx="8" fill="#fdf1cf" stroke="#c0392b" stroke-width="1.8"/>
  <text x="490" y="175" font-size="15" font-weight="bold" text-anchor="middle" fill="#c0392b">字节流</text>
  <text x="490" y="200" font-size="13" text-anchor="middle" fill="#555555">0110 1001 ...</text>

  <!-- 传输箭头（双向） -->
  <line x1="575" y1="163" x2="712" y2="163" stroke="#1a7f37" stroke-width="2.5" marker-end="url(#arrow9g)"/>
  <line x1="712" y1="200" x2="575" y2="200" stroke="#1a7f37" stroke-width="2.5" marker-end="url(#arrow9g)"/>
  <text x="644" y="135" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a7f37">文件 / 网络 / Redis</text>

  <!-- 反序列化箭头 -->
  <line x1="715" y1="330" x2="265" y2="330" stroke="#2c5aa0" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arrow9)"/>
  <text x="490" y="318" font-size="13" font-weight="bold" text-anchor="middle" fill="#2c5aa0">反序列化 readObject()：校验 serialVersionUID，按格式重建对象</text>

  <!-- 底部要点 -->
  <rect x="40" y="380" width="900" height="160" rx="8" fill="#f5f5f5" stroke="#888888" stroke-width="1.2"/>
  <text x="490" y="416" font-size="14" font-weight="bold" text-anchor="middle" fill="#333333">序列化解决的是"进程边界 + 时间边界"：对象出堆就要先变成字节</text>
  <text x="490" y="450" font-size="13" text-anchor="middle" fill="#555555">transient 字段不参与序列化（对方拿到的是 null）；static 字段属于类，也不序列化</text>
  <text x="490" y="478" font-size="13" text-anchor="middle" fill="#555555">serialVersionUID 版本不一致抛 InvalidClassException —— 所以必须显式声明</text>
  <text x="490" y="510" font-size="13" text-anchor="middle" fill="#555555">原生序列化：不跨语言、性能差、有反序列化攻击风险 —— 生产用 JSON / Protobuf</text>
</svg>
