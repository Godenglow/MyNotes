<svg xmlns="http://www.w3.org/2000/svg" width="880" height="640" viewBox="0 0 880 640" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="arrow7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2c5aa0"/>
    </marker>
    <marker id="arrow7g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666666"/>
    </marker>
  </defs>
  <rect width="880" height="640" fill="#ffffff"/>

  <!-- 串行流 -->
  <rect x="10" y="20" width="860" height="200" rx="8" fill="none" stroke="#333333" stroke-width="1.5"/>
  <text x="35" y="50" font-size="15" font-weight="bold" fill="#333333">串行流（stream()）</text>

  <ellipse cx="120" cy="130" rx="85" ry="45" fill="#eef3fb" stroke="#2c5aa0" stroke-width="1.5"/>
  <text x="120" y="125" font-size="13" text-anchor="middle" fill="#333333">数据源</text>
  <text x="120" y="145" font-size="12" text-anchor="middle" fill="#555555">集合、数组</text>

  <line x1="205" y1="130" x2="300" y2="130" stroke="#2c5aa0" stroke-width="2" marker-end="url(#arrow7)"/>
  <text x="252" y="115" font-size="12" text-anchor="middle" fill="#2c5aa0">stream()</text>

  <rect x="305" y="85" width="330" height="90" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="470" y="113" font-size="13" text-anchor="middle" fill="#333333">中间操作（惰性，只搭管道不执行）</text>
  <text x="470" y="138" font-size="12" text-anchor="middle" fill="#555555">filter / map / flatMap / sorted / distinct</text>
  <text x="470" y="158" font-size="12" text-anchor="middle" fill="#555555">单个元素依次流过整条管道</text>

  <line x1="635" y1="130" x2="730" y2="130" stroke="#2c5aa0" stroke-width="2" marker-end="url(#arrow7)"/>
  <text x="682" y="115" font-size="12" text-anchor="middle" fill="#2c5aa0">终端操作</text>

  <ellipse cx="795" cy="130" rx="65" ry="45" fill="#eef3fb" stroke="#2c5aa0" stroke-width="1.5"/>
  <text x="795" y="125" font-size="13" text-anchor="middle" fill="#333333">结果</text>
  <text x="795" y="145" font-size="12" text-anchor="middle" fill="#555555">collect / count</text>

  <text x="440" y="200" font-size="12" text-anchor="middle" fill="#888888">没有终端操作，中间操作永远不会执行 —— 这就是惰性求值</text>

  <!-- 并行流 -->
  <rect x="10" y="240" width="860" height="390" rx="8" fill="none" stroke="#333333" stroke-width="1.5"/>
  <text x="35" y="270" font-size="15" font-weight="bold" fill="#333333">并行流（parallelStream() / parallel()）</text>

  <ellipse cx="110" cy="440" rx="80" ry="45" fill="#eef3fb" stroke="#2c5aa0" stroke-width="1.5"/>
  <text x="110" y="435" font-size="13" text-anchor="middle" fill="#333333">数据源</text>
  <text x="110" y="455" font-size="12" text-anchor="middle" fill="#555555"> ForkJoin 分块</text>

  <line x1="180" y1="415" x2="270" y2="355" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow7g)"/>
  <line x1="192" y1="440" x2="268" y2="440" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow7g)"/>
  <line x1="180" y1="465" x2="270" y2="525" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow7g)"/>
  <text x="440" y="300" font-size="13" fill="#c0392b">parallelStream()：数据切成多块，丢进 ForkJoinPool.commonPool 并行执行</text>

  <rect x="275" y="315" width="180" height="60" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
  <text x="365" y="350" font-size="12" text-anchor="middle" fill="#333333">块 a、b（线程1）</text>
  <rect x="275" y="410" width="180" height="60" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
  <text x="365" y="445" font-size="12" text-anchor="middle" fill="#333333">块 c（线程2）</text>
  <rect x="275" y="505" width="180" height="60" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
  <text x="365" y="540" font-size="12" text-anchor="middle" fill="#333333">块 d（线程3）</text>

  <line x1="455" y1="345" x2="530" y2="415" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow7g)"/>
  <line x1="455" y1="440" x2="528" y2="440" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow7g)"/>
  <line x1="455" y1="535" x2="530" y2="465" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow7g)"/>

  <rect x="535" y="395" width="170" height="90" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
  <text x="620" y="428" font-size="13" text-anchor="middle" fill="#333333">汇总合并</text>
  <text x="620" y="452" font-size="12" text-anchor="middle" fill="#555555">combiner 合并各块结果</text>

  <line x1="705" y1="440" x2="760" y2="440" stroke="#2c5aa0" stroke-width="2" marker-end="url(#arrow7)"/>

  <ellipse cx="800" cy="440" rx="60" ry="45" fill="#eef3fb" stroke="#2c5aa0" stroke-width="1.5"/>
  <text x="800" y="435" font-size="13" text-anchor="middle" fill="#333333">结果</text>
  <text x="800" y="455" font-size="12" text-anchor="middle" fill="#555555">（顺序可能乱）</text>

  <!-- 红色警示 -->
  <rect x="130" y="580" width="620" height="40" rx="6" fill="#f5d0cc" stroke="#c0392b" stroke-width="1.2"/>
  <text x="440" y="605" font-size="13" font-weight="bold" text-anchor="middle" fill="#c0392b">适合 CPU 密集型任务；IO 密集型任务会占满公共线程池，拖垮整个 JVM 的并行流</text>
</svg>
