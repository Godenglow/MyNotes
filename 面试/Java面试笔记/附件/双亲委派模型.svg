<svg xmlns="http://www.w3.org/2000/svg" width="680" height="408" viewBox="0 0 680 408" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <title>双亲委派模型：类加载器层级与委派/回落路径</title>
  <rect width="680" height="408" fill="#ffffff"/>
  <defs>
    <marker id="arrowBpF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>.mono{font-family:Consolas,'Courier New',monospace}</style>

  <text x="40" y="68" font-size="12" fill="#2c2c2a">① 向上委派（左侧箭头）</text>
  <text x="640" y="68" font-size="12" fill="#2c2c2a" text-anchor="end">② 父加载不了才自己加载（右侧）</text>

  <rect x="200" y="76" width="280" height="56" rx="8" fill="#faeeda" stroke="#ba7517" stroke-width="0.5"/>
  <text class="mono" x="216" y="98" font-size="12" font-weight="bold" fill="#633806">Bootstrap ClassLoader</text>
  <text x="216" y="116" font-size="11" fill="#888780">启动类加载器</text>
  <rect x="200" y="152" width="280" height="56" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
  <text class="mono" x="216" y="174" font-size="12" font-weight="bold" fill="#2c2c2a">Platform ClassLoader</text>
  <text x="216" y="192" font-size="11" fill="#888780">平台类加载器（JDK 9 前叫 Extension）</text>
  <rect x="200" y="228" width="280" height="56" rx="8" fill="#e6f1fb" stroke="#185fa5" stroke-width="0.5"/>
  <text class="mono" x="216" y="250" font-size="12" font-weight="bold" fill="#0c447c">Application ClassLoader</text>
  <text x="216" y="268" font-size="11" fill="#888780">应用类加载器</text>
  <rect x="200" y="304" width="280" height="56" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
  <text class="mono" x="216" y="326" font-size="12" font-weight="bold" fill="#2c2c2a">Custom ClassLoader</text>
  <text x="216" y="344" font-size="11" fill="#888780">自定义加载器</text>

  <path d="M240 152 L240 134" fill="none" stroke="#888780" stroke-width="1.2" marker-end="url(#arrowBpF)"/>
  <path d="M240 228 L240 210" fill="none" stroke="#888780" stroke-width="1.2" marker-end="url(#arrowBpF)"/>
  <path d="M240 304 L240 286" fill="none" stroke="#888780" stroke-width="1.2" marker-end="url(#arrowBpF)"/>
  <path d="M440 132 L440 150" fill="none" stroke="#888780" stroke-width="1.2" marker-end="url(#arrowBpF)"/>
  <path d="M440 208 L440 226" fill="none" stroke="#888780" stroke-width="1.2" marker-end="url(#arrowBpF)"/>
  <path d="M440 284 L440 302" fill="none" stroke="#888780" stroke-width="1.2" marker-end="url(#arrowBpF)"/>

  <text x="500" y="108" font-size="11" fill="#888780">java.lang.String 等</text>
  <text x="500" y="184" font-size="11" fill="#888780">平台模块（模块化后）</text>
  <text x="500" y="260" font-size="11" fill="#888780">classpath + 依赖 jar</text>
  <text x="500" y="336" font-size="11" fill="#888780">网络 / 加密 class 等来源</text>

  <text x="40" y="388" font-size="12" fill="#888780">例：自定义 java.lang.String → 逐层上抛 → Bootstrap 直接返回 JDK 的 String，自定义类永远没机会加载</text>
</svg>
