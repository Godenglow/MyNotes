<svg xmlns="http://www.w3.org/2000/svg" width="680" height="334" viewBox="0 0 680 334" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <title>单例与原型 Bean 生命周期归属对比及原型注入单例的陷阱</title>
  <rect width="680" height="334" fill="#ffffff"/>
  <defs>
    <marker id="arrowScF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="40" y="44" font-size="14" font-weight="bold" fill="#2c2c2a">单例 vs 原型：谁管生，谁管死</text>

  <rect x="40" y="64" width="290" height="150" rx="12" fill="#e6f1fb" stroke="#185fa5" stroke-width="0.5"/>
  <text x="56" y="88" font-size="12" font-weight="bold" fill="#0c447c">Singleton（默认）</text>
  <text x="56" y="112" font-size="11" fill="#444441">· 容器启动时预实例化（懒加载除外）</text>
  <text x="56" y="130" font-size="11" fill="#444441">· 整个容器一个实例，全局共享</text>
  <text x="56" y="148" font-size="11" fill="#444441">· 初始化、销毁回调全归容器管</text>
  <text x="56" y="166" font-size="11" fill="#888780">· 容器关闭 → @PreDestroy 三连</text>
  <text x="56" y="190" font-size="11" fill="#888780">注意：是"每容器一个"，不是 JVM 全局一个</text>

  <rect x="350" y="64" width="290" height="150" rx="12" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
  <text x="366" y="88" font-size="12" font-weight="bold" fill="#2c2c2a">Prototype</text>
  <text x="366" y="112" font-size="11" fill="#444441">· 每次 getBean 都新建一个</text>
  <text x="366" y="130" font-size="11" fill="#444441">· 初始化回调正常执行</text>
  <text x="366" y="148" font-size="11" fill="#888780">· 销毁回调不执行，交付后生死自理</text>
  <text x="366" y="166" font-size="11" fill="#888780">· 适合状态瞬时的对象（如载荷对象）</text>
  <text x="366" y="190" font-size="11" fill="#888780">有状态 + 多线程共享 → 单例线程不安全</text>

  <text x="40" y="244" font-size="12" font-weight="bold" fill="#2c2c2a">经典坑：单例 Bean 注入原型 Bean</text>
  <rect x="40" y="258" width="120" height="36" rx="8" fill="#e6f1fb" stroke="#185fa5" stroke-width="0.5"/>
  <text x="100" y="276" font-size="12" fill="#0c447c" text-anchor="middle" dominant-baseline="central">Singleton A</text>
  <path d="M162 276 L238 276" fill="none" stroke="#888780" stroke-width="1.2" marker-end="url(#arrowScF)"/>
  <text x="200" y="266" font-size="11" fill="#888780" text-anchor="middle">仅注入一次</text>
  <rect x="242" y="258" width="120" height="36" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
  <text x="302" y="276" font-size="12" fill="#444441" text-anchor="middle" dominant-baseline="central">Prototype B</text>
  <text x="386" y="270" font-size="11" fill="#888780">之后 A 用的永远是同一个 B，"原型"失效</text>
  <text x="386" y="290" font-size="11" fill="#0f6e56">解法：@Lookup 方法注入 / ObjectProvider</text>

  <text x="40" y="322" font-size="11" fill="#888780">作用域全家桶：singleton、prototype、request、session、application、websocket、自定义（实现 Scope 接口）</text>
</svg>
