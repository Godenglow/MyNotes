<svg xmlns="http://www.w3.org/2000/svg" width="680" height="362" viewBox="0 0 680 362" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <title>可达性分析：GC Roots 出发判活，循环引用孤岛判死</title>
  <rect width="680" height="362" fill="#ffffff"/>
  <defs>
    <marker id="arrowGcF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="40" y="52" font-size="14" font-weight="bold" fill="#2c2c2a">判活：可达性分析（JVM 采用）</text>

  <rect x="40" y="76" width="170" height="170" rx="12" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
  <text x="56" y="100" font-size="12" font-weight="bold" fill="#2c2c2a">GC Roots</text>
  <text x="56" y="124" font-size="11" fill="#5f5e5a">· 虚拟机栈局部变量</text>
  <text x="56" y="142" font-size="11" fill="#5f5e5a">· 静态变量</text>
  <text x="56" y="160" font-size="11" fill="#5f5e5a">· 常量</text>
  <text x="56" y="178" font-size="11" fill="#5f5e5a">· JNI 引用</text>
  <text x="56" y="196" font-size="11" fill="#5f5e5a">· 活跃线程</text>

  <rect x="300" y="90" width="100" height="40" rx="8" fill="#e6f1fb" stroke="#185fa5" stroke-width="0.5"/>
  <text x="350" y="110" font-size="12" fill="#0c447c" text-anchor="middle" dominant-baseline="central">对象 A</text>
  <rect x="440" y="90" width="100" height="40" rx="8" fill="#e6f1fb" stroke="#185fa5" stroke-width="0.5"/>
  <text x="490" y="110" font-size="12" fill="#0c447c" text-anchor="middle" dominant-baseline="central">对象 B</text>
  <rect x="560" y="90" width="100" height="40" rx="8" fill="#e6f1fb" stroke="#185fa5" stroke-width="0.5"/>
  <text x="610" y="110" font-size="12" fill="#0c447c" text-anchor="middle" dominant-baseline="central">对象 C</text>
  <path d="M212 110 L296 110" fill="none" stroke="#888780" stroke-width="1.2" marker-end="url(#arrowGcF)"/>
  <path d="M402 110 L436 110" fill="none" stroke="#888780" stroke-width="1.2" marker-end="url(#arrowGcF)"/>
  <path d="M542 110 L556 110" fill="none" stroke="#888780" stroke-width="1.2" marker-end="url(#arrowGcF)"/>
  <text x="480" y="152" font-size="11" fill="#0f6e56" text-anchor="middle">可达 → 存活</text>

  <rect x="300" y="196" width="100" height="40" rx="8" fill="#fcebeb" stroke="#a32d2d" stroke-width="0.5"/>
  <text x="350" y="216" font-size="12" fill="#791f1f" text-anchor="middle" dominant-baseline="central">对象 M</text>
  <rect x="440" y="196" width="100" height="40" rx="8" fill="#fcebeb" stroke="#a32d2d" stroke-width="0.5"/>
  <text x="490" y="216" font-size="12" fill="#791f1f" text-anchor="middle" dominant-baseline="central">对象 N</text>
  <path d="M402 208 L436 208" fill="none" stroke="#a32d2d" stroke-width="1.2" marker-end="url(#arrowGcF)"/>
  <path d="M436 224 L402 224" fill="none" stroke="#a32d2d" stroke-width="1.2" marker-end="url(#arrowGcF)"/>
  <text x="490" y="262" font-size="11" fill="#a32d2d" text-anchor="middle">互相引用，但到 GC Roots 不可达 → 判死</text>

  <text x="40" y="320" font-size="12" fill="#888780">引用计数法：计数器加减、归零即回收 —— 循环引用是死穴，JVM 不采用（Python、Netty 用它并另有解法）</text>
  <text x="40" y="342" font-size="12" fill="#888780">GC Roots 记忆口诀：栈、静态、常量、JNI、活线程 —— 正在被用的东西都是根</text>
</svg>
