<svg xmlns="http://www.w3.org/2000/svg" width="820" height="700" viewBox="0 0 820 700" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="arrow4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2c5aa0"/>
    </marker>
  </defs>
  <rect width="820" height="700" fill="#ffffff"/>
  <text x="410" y="36" font-size="15" font-weight="bold" text-anchor="middle" fill="#333333">注解从定义到被解析的完整生命周期</text>

  <!-- 1. 定义 -->
  <rect x="240" y="60" width="340" height="70" rx="8" fill="#eef3fb" stroke="#2c5aa0" stroke-width="1.8"/>
  <text x="410" y="88" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c5aa0">1. 定义注解 @interface</text>
  <text x="410" y="112" font-size="12" text-anchor="middle" fill="#555555">本质：继承 java.lang.annotation.Annotation 的特殊接口</text>
  <line x1="410" y1="130" x2="410" y2="162" stroke="#2c5aa0" stroke-width="2" marker-end="url(#arrow4)"/>

  <!-- 2. 编译 -->
  <rect x="240" y="165" width="340" height="88" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="410" y="192" font-size="14" font-weight="bold" text-anchor="middle" fill="#333333">2. 编译期：Retention 决定去留</text>
  <text x="410" y="216" font-size="12" text-anchor="middle" fill="#555555">SOURCE：编译后丢弃（如 Lombok、@Override）</text>
  <text x="410" y="236" font-size="12" text-anchor="middle" fill="#555555">CLASS：写入 .class 文件，运行时不可见（默认）</text>
  <line x1="410" y1="253" x2="410" y2="285" stroke="#2c5aa0" stroke-width="2" marker-end="url(#arrow4)"/>

  <!-- 3. 类加载 -->
  <rect x="240" y="288" width="340" height="70" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="410" y="316" font-size="14" font-weight="bold" text-anchor="middle" fill="#333333">3. RUNTIME：类加载时解析进内存</text>
  <text x="410" y="340" font-size="12" text-anchor="middle" fill="#555555">注解信息挂在 Class 对象上，供反射使用</text>
  <line x1="410" y1="358" x2="410" y2="390" stroke="#2c5aa0" stroke-width="2" marker-end="url(#arrow4)"/>

  <!-- 4. 反射获取 -->
  <rect x="240" y="393" width="340" height="70" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="410" y="421" font-size="14" font-weight="bold" text-anchor="middle" fill="#333333">4. 反射 getAnnotation() 获取注解</text>
  <text x="410" y="445" font-size="12" text-anchor="middle" fill="#555555">返回的是运行时生成的动态代理对象</text>
  <line x1="410" y1="463" x2="410" y2="495" stroke="#2c5aa0" stroke-width="2" marker-end="url(#arrow4)"/>

  <!-- 5. 调用属性值 -->
  <rect x="240" y="498" width="340" height="88" rx="8" fill="#fdf1cf" stroke="#c0392b" stroke-width="1.8"/>
  <text x="410" y="526" font-size="14" font-weight="bold" text-anchor="middle" fill="#c0392b">5. 调用注解属性 value() 时</text>
  <text x="410" y="550" font-size="12" text-anchor="middle" fill="#555555">走到 AnnotationInvocationHandler.invoke()</text>
  <text x="410" y="572" font-size="12" text-anchor="middle" fill="#555555">从 memberValues 这个 Map 里取值（来源于常量池）</text>

  <!-- 侧注：Target -->
  <rect x="620" y="165" width="180" height="88" rx="8" fill="#f5f5f5" stroke="#888888" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="710" y="192" font-size="13" font-weight="bold" text-anchor="middle" fill="#333333">@Target 决定用在哪</text>
  <text x="710" y="216" font-size="12" text-anchor="middle" fill="#555555">TYPE / METHOD / FIELD</text>
  <text x="710" y="236" font-size="12" text-anchor="middle" fill="#555555">与 @Retention 是两个维度</text>
  <line x1="580" y1="209" x2="618" y2="209" stroke="#888888" stroke-width="1.2" stroke-dasharray="5 4"/>
</svg>
