<svg xmlns="http://www.w3.org/2000/svg" width="780" height="662" viewBox="0 0 780 662" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>
  <rect width="780" height="662" fill="#ffffff"/>

  <!-- 浅拷贝 -->
  <rect x="10" y="10" width="760" height="300" rx="8" fill="none" stroke="#333333" stroke-width="2"/>
  <text x="30" y="42" font-size="18" font-weight="bold" fill="#333333">浅拷贝</text>

  <rect x="50" y="80" width="120" height="44" rx="6" fill="#f5f5f5" stroke="#333333" stroke-width="1.5"/>
  <text x="110" y="107" font-size="15" text-anchor="middle" fill="#333333">源对象</text>

  <rect x="50" y="190" width="120" height="44" rx="6" fill="#f5f5f5" stroke="#333333" stroke-width="1.5"/>
  <text x="110" y="217" font-size="15" text-anchor="middle" fill="#333333">拷贝对象</text>

  <rect x="420" y="60" width="220" height="150" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <line x1="420" y1="95" x2="640" y2="95" stroke="#333333" stroke-width="1.5"/>
  <text x="530" y="85" font-size="15" font-weight="bold" text-anchor="middle" fill="#333333">学生</text>
  <text x="440" y="125" font-size="14" fill="#333333">姓名：大山</text>
  <text x="440" y="152" font-size="14" fill="#333333">性别：男</text>
  <text x="440" y="179" font-size="14" fill="#333333">住址：中国浙江</text>

  <line x1="170" y1="100" x2="415" y2="120" stroke="#333333" stroke-width="1.5" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <line x1="170" y1="212" x2="415" y2="165" stroke="#333333" stroke-width="1.5" stroke-dasharray="7 5" marker-end="url(#arrow)"/>

  <text x="530" y="245" font-size="13" text-anchor="middle" fill="#c0392b">引用类型字段指向同一个对象，改一个另一个也变</text>

  <!-- 深拷贝 -->
  <rect x="10" y="330" width="760" height="322" rx="8" fill="none" stroke="#333333" stroke-width="2"/>
  <text x="30" y="362" font-size="18" font-weight="bold" fill="#333333">深拷贝</text>

  <rect x="50" y="410" width="120" height="44" rx="6" fill="#f5f5f5" stroke="#333333" stroke-width="1.5"/>
  <text x="110" y="437" font-size="15" text-anchor="middle" fill="#333333">源对象</text>

  <rect x="50" y="520" width="120" height="44" rx="6" fill="#f5f5f5" stroke="#333333" stroke-width="1.5"/>
  <text x="110" y="547" font-size="15" text-anchor="middle" fill="#333333">拷贝对象</text>

  <rect x="420" y="390" width="220" height="110" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <line x1="420" y1="425" x2="640" y2="425" stroke="#333333" stroke-width="1.5"/>
  <text x="530" y="415" font-size="15" font-weight="bold" text-anchor="middle" fill="#333333">学生</text>
  <text x="440" y="450" font-size="14" fill="#333333">姓名：大山</text>
  <text x="440" y="472" font-size="14" fill="#333333">性别：男</text>
  <text x="440" y="494" font-size="14" fill="#333333">住址：中国浙江</text>

  <rect x="420" y="520" width="220" height="110" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <line x1="420" y1="555" x2="640" y2="555" stroke="#333333" stroke-width="1.5"/>
  <text x="530" y="545" font-size="15" font-weight="bold" text-anchor="middle" fill="#333333">学生（副本）</text>
  <text x="440" y="580" font-size="14" fill="#333333">姓名：大山</text>
  <text x="440" y="602" font-size="14" fill="#333333">性别：男</text>
  <text x="440" y="624" font-size="14" fill="#333333">住址：中国浙江</text>

  <line x1="170" y1="430" x2="415" y2="440" stroke="#333333" stroke-width="1.5" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <line x1="170" y1="542" x2="415" y2="570" stroke="#333333" stroke-width="1.5" stroke-dasharray="7 5" marker-end="url(#arrow)"/>

  <text x="530" y="646" font-size="13" text-anchor="middle" fill="#1a7f37">引用类型字段也复制一份，互不影响</text>
</svg>
