<svg xmlns="http://www.w3.org/2000/svg" width="680" height="404" viewBox="0 0 680 404" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <title>CountDownLatch、CyclicBarrier、Semaphore 流程对比</title>
  <rect width="680" height="404" fill="#ffffff"/>
  <defs>
    <marker id="arrowJuc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="40" y="66" font-size="14" font-weight="bold" fill="#2c2c2a">CountDownLatch —— 倒计时门闩（一次性）</text>
  <rect x="40" y="84" width="184" height="44" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
  <text x="132" y="106" font-size="12" fill="#444441" text-anchor="middle" dominant-baseline="central">子线程完成：countDown()</text>
  <path d="M226 106 L242 106" fill="none" stroke="#888780" stroke-width="1.2" marker-end="url(#arrowJuc)"/>
  <rect x="248" y="84" width="184" height="44" rx="8" fill="#e6f1fb" stroke="#185fa5" stroke-width="0.5"/>
  <text x="340" y="106" font-size="12" fill="#0c447c" text-anchor="middle" dominant-baseline="central">计数器 3 → 2 → 1 → 0</text>
  <path d="M434 106 L450 106" fill="none" stroke="#888780" stroke-width="1.2" marker-end="url(#arrowJuc)"/>
  <rect x="456" y="84" width="184" height="44" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
  <text x="548" y="106" font-size="12" fill="#444441" text-anchor="middle" dominant-baseline="central">到 0，等待方放行</text>
  <text x="40" y="146" font-size="12" fill="#888780">await() 阻塞到计数为 0；不可重置。典型：主线程等所有子任务跑完再汇总</text>

  <text x="40" y="184" font-size="14" font-weight="bold" fill="#2c2c2a">CyclicBarrier —— 屏障（可重复）</text>
  <rect x="40" y="202" width="184" height="44" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
  <text x="132" y="224" font-size="12" fill="#444441" text-anchor="middle" dominant-baseline="central">线程到屏障点：await()</text>
  <path d="M226 224 L242 224" fill="none" stroke="#888780" stroke-width="1.2" marker-end="url(#arrowJuc)"/>
  <rect x="248" y="202" width="184" height="44" rx="8" fill="#e6f1fb" stroke="#185fa5" stroke-width="0.5"/>
  <text x="340" y="224" font-size="12" fill="#0c447c" text-anchor="middle" dominant-baseline="central">计数等齐，一起放行</text>
  <path d="M434 224 L450 224" fill="none" stroke="#888780" stroke-width="1.2" marker-end="url(#arrowJuc)"/>
  <rect x="456" y="202" width="184" height="44" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
  <text x="548" y="224" font-size="12" fill="#444441" text-anchor="middle" dominant-baseline="central">自动重置，可多轮</text>
  <text x="40" y="264" font-size="12" fill="#888780">方向和 Latch 相反：大家互相等。典型：分段任务，全员到齐再进下一阶段</text>

  <text x="40" y="302" font-size="14" font-weight="bold" fill="#2c2c2a">Semaphore —— 信号量（限流闸门）</text>
  <rect x="40" y="320" width="184" height="44" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
  <text x="132" y="342" font-size="12" fill="#444441" text-anchor="middle" dominant-baseline="central">访问前：acquire()</text>
  <path d="M226 342 L242 342" fill="none" stroke="#888780" stroke-width="1.2" marker-end="url(#arrowJuc)"/>
  <rect x="248" y="320" width="184" height="44" rx="8" fill="#e6f1fb" stroke="#185fa5" stroke-width="0.5"/>
  <text x="340" y="342" font-size="12" fill="#0c447c" text-anchor="middle" dominant-baseline="central">许可池（如 2 个许可）</text>
  <path d="M434 342 L450 342" fill="none" stroke="#888780" stroke-width="1.2" marker-end="url(#arrowJuc)"/>
  <rect x="456" y="320" width="184" height="44" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
  <text x="548" y="342" font-size="12" fill="#444441" text-anchor="middle" dominant-baseline="central">没许可排队，release() 归还</text>
  <text x="40" y="382" font-size="12" fill="#888780">控制同时访问资源的线程数。典型：限流、数据库连接池；tryAcquire() 可不阻塞直接失败</text>
</svg>
