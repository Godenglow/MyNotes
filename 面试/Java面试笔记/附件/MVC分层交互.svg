<svg xmlns="http://www.w3.org/2000/svg" width="680" height="345" viewBox="0 0 680 345" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <title>MVC 分层交互：用户、控制器、模型、视图的协作关系</title>
  <rect width="680" height="345" fill="#ffffff"/>
  <defs>
    <marker id="arrowMvcF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="40" y="44" font-size="14" font-weight="bold" fill="#2c2c2a">MVC：业务逻辑、数据、界面显示分离</text>

  <rect x="40" y="90" width="100" height="70" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
  <text x="90" y="118" font-size="12" fill="#444441" text-anchor="middle" dominant-baseline="central">用户 / 浏览器</text>
  <text x="90" y="138" font-size="11" fill="#888780" text-anchor="middle" dominant-baseline="central">发请求、看结果</text>
  <rect x="190" y="90" width="130" height="70" rx="8" fill="#e6f1fb" stroke="#185fa5" stroke-width="0.5"/>
  <text x="255" y="118" font-size="12" font-weight="bold" fill="#0c447c" text-anchor="middle" dominant-baseline="central">Controller</text>
  <text x="255" y="138" font-size="11" fill="#888780" text-anchor="middle" dominant-baseline="central">控制器：调度中枢</text>
  <rect x="370" y="64" width="270" height="160" rx="12" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
  <text x="386" y="88" font-size="12" font-weight="bold" fill="#2c2c2a">Model 模型</text>
  <rect x="386" y="100" width="238" height="52" rx="8" fill="#ffffff" stroke="#888780" stroke-width="0.5"/>
  <text x="505" y="120" font-size="12" font-weight="bold" fill="#444441" text-anchor="middle" dominant-baseline="central">业务处理 Bean</text>
  <text x="505" y="138" font-size="11" fill="#888780" text-anchor="middle" dominant-baseline="central">Service / Dao：处理请求</text>
  <rect x="386" y="160" width="238" height="52" rx="8" fill="#ffffff" stroke="#888780" stroke-width="0.5"/>
  <text x="505" y="180" font-size="12" font-weight="bold" fill="#444441" text-anchor="middle" dominant-baseline="central">数据承载 Bean</text>
  <text x="505" y="198" font-size="11" fill="#888780" text-anchor="middle" dominant-baseline="central">实体类（如 User）：承载数据</text>
  <rect x="190" y="230" width="130" height="60" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
  <text x="255" y="254" font-size="12" font-weight="bold" fill="#085041" text-anchor="middle" dominant-baseline="central">View 视图</text>
  <text x="255" y="274" font-size="11" fill="#888780" text-anchor="middle" dominant-baseline="central">界面显示</text>

  <path d="M142 125 L186 125" fill="none" stroke="#888780" stroke-width="1.2" marker-end="url(#arrowMvcF)"/>
  <text x="164" y="115" font-size="11" fill="#888780" text-anchor="middle">①</text>
  <path d="M322 112 L366 112" fill="none" stroke="#888780" stroke-width="1.2" marker-end="url(#arrowMvcF)"/>
  <text x="344" y="102" font-size="11" fill="#888780" text-anchor="middle">②</text>
  <path d="M366 142 L324 142" fill="none" stroke="#888780" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrowMvcF)"/>
  <text x="344" y="158" font-size="11" fill="#888780" text-anchor="middle">③</text>
  <path d="M255 162 L255 226" fill="none" stroke="#888780" stroke-width="1.2" marker-end="url(#arrowMvcF)"/>
  <text x="263" y="196" font-size="11" fill="#888780">④</text>
  <path d="M188 262 L90 262 L90 164" fill="none" stroke="#888780" stroke-width="1.2" marker-end="url(#arrowMvcF)"/>
  <text x="140" y="252" font-size="11" fill="#888780" text-anchor="middle">⑤</text>

  <text x="40" y="312" font-size="11" fill="#888780">① 发请求　② 转发给 Model 处理　③ 返回计算结果　④ 选择视图渲染　⑤ 响应用户</text>
  <text x="40" y="334" font-size="11" fill="#0f6e56">演进：前后端分离后 View 交给前端，@RestController 直接返回 JSON —— MVC 思想不变，View 换了实现</text>
</svg>
