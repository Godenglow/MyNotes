<svg xmlns="http://www.w3.org/2000/svg" width="680" height="364" viewBox="0 0 680 364" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <title>synchronized 底层 ObjectMonitor 模型：_owner、_EntryList、_WaitSet</title>
  <rect width="680" height="364" fill="#ffffff"/>
  <defs>
    <marker id="arrowMon" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#0f6e56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowMonG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>.mono{font-family:Consolas,'Courier New',monospace}</style>

  <text x="40" y="52" font-size="14" font-weight="bold" fill="#2c2c2a">synchronized 底层：ObjectMonitor（监视器锁）</text>

  <text x="70" y="124" font-size="11" fill="#888780" text-anchor="middle">新来的线程</text>
  <rect x="40" y="140" width="60" height="30" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
  <text x="70" y="155" font-size="12" fill="#444441" text-anchor="middle" dominant-baseline="central">T1</text>
  <rect x="40" y="180" width="60" height="30" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
  <text x="70" y="195" font-size="12" fill="#444441" text-anchor="middle" dominant-baseline="central">T2</text>
  <rect x="40" y="220" width="60" height="30" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
  <text x="70" y="235" font-size="12" fill="#444441" text-anchor="middle" dominant-baseline="central">T3</text>

  <rect x="150" y="160" width="120" height="60" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
  <text class="mono" x="210" y="184" font-size="12" font-weight="bold" fill="#2c2c2a" text-anchor="middle" dominant-baseline="central">_EntryList</text>
  <text x="210" y="202" font-size="11" fill="#888780" text-anchor="middle" dominant-baseline="central">等锁队列</text>

  <path d="M272 190 L316 190" fill="none" stroke="#888780" stroke-width="1.2" marker-end="url(#arrowMonG)"/>
  <text x="294" y="178" font-size="11" fill="#888780" text-anchor="middle">抢到锁</text>

  <rect x="320" y="150" width="160" height="80" rx="8" fill="#e6f1fb" stroke="#185fa5" stroke-width="0.5"/>
  <text class="mono" x="400" y="176" font-size="12" font-weight="bold" fill="#0c447c" text-anchor="middle" dominant-baseline="central">_owner</text>
  <text x="400" y="194" font-size="11" fill="#888780" text-anchor="middle" dominant-baseline="central">当前持锁线程</text>
  <text class="mono" x="400" y="212" font-size="11" fill="#888780" text-anchor="middle" dominant-baseline="central">_recursions 可重入计数</text>

  <path d="M482 170 L526 170" fill="none" stroke="#888780" stroke-width="1.2" marker-end="url(#arrowMonG)"/>
  <text class="mono" x="504" y="158" font-size="11" fill="#888780" text-anchor="middle">wait()</text>

  <rect x="530" y="140" width="110" height="60" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
  <text class="mono" x="585" y="164" font-size="12" font-weight="bold" fill="#2c2c2a" text-anchor="middle" dominant-baseline="central">_WaitSet</text>
  <text x="585" y="182" font-size="11" fill="#888780" text-anchor="middle" dominant-baseline="central">等 notify() 唤醒</text>

  <path d="M585 202 L585 252 L210 252 L210 222" fill="none" stroke="#0f6e56" stroke-width="1.2" marker-end="url(#arrowMon)"/>
  <text x="398" y="268" font-size="11" fill="#0f6e56" text-anchor="middle">notify() / notifyAll() 唤醒后回到等锁队列重新竞争</text>

  <text x="40" y="300" font-size="12" fill="#888780">monitorexit：计数 -1，减到 0 才真正释放锁；重入同一把锁则 +1（可重入的来源）</text>
  <text x="40" y="322" font-size="12" fill="#888780">字节码：同步代码块 = 1 个 monitorenter + 2 个 monitorexit（正常出口 + 异常出口）</text>
  <text x="40" y="344" font-size="12" fill="#888780">同步方法靠 ACC_SYNCHRONIZED 标志；wait/notify 必须持锁，否则抛 IllegalMonitorStateException</text>
</svg>
