<svg xmlns="http://www.w3.org/2000/svg" width="680" height="384" viewBox="0 0 680 384" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <title>Java 锁的分类全景：实现方式、设计思想、公平性、等锁方式</title>
  <rect width="680" height="384" fill="#ffffff"/>
  <style>.mono{font-family:Consolas,'Courier New',monospace}</style>

  <text x="40" y="50" font-size="14" font-weight="bold" fill="#2c2c2a">① 按实现方式分</text>
  <rect x="40" y="62" width="200" height="44" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
  <text class="mono" x="52" y="80" font-size="12" font-weight="bold" fill="#2c2c2a">synchronized</text>
  <text x="52" y="97" font-size="11" fill="#888780">内置锁，JVM 层，自动释放</text>
  <rect x="256" y="62" width="200" height="44" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
  <text class="mono" x="268" y="80" font-size="12" font-weight="bold" fill="#2c2c2a">ReentrantLock</text>
  <text x="268" y="97" font-size="11" fill="#888780">显式锁，手动 lock/unlock</text>
  <rect x="472" y="62" width="200" height="44" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
  <text class="mono" x="484" y="80" font-size="12" font-weight="bold" fill="#2c2c2a">ReadWriteLock</text>
  <text x="484" y="97" font-size="11" fill="#888780">读共享，写独占</text>

  <text x="40" y="136" font-size="14" font-weight="bold" fill="#2c2c2a">② 按设计思想分</text>
  <rect x="40" y="148" width="300" height="44" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
  <text x="52" y="166" font-size="12" font-weight="bold" fill="#2c2c2a">悲观锁</text>
  <text x="52" y="183" font-size="11" fill="#888780">假设最坏情况，先锁再操作</text>
  <rect x="356" y="148" width="300" height="44" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
  <text x="368" y="166" font-size="12" font-weight="bold" fill="#2c2c2a">乐观锁</text>
  <text x="368" y="183" font-size="11" fill="#888780">不锁，更新时校验：CAS、版本号</text>

  <text x="40" y="222" font-size="14" font-weight="bold" fill="#2c2c2a">③ 按公平性分</text>
  <rect x="40" y="234" width="300" height="44" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
  <text x="52" y="252" font-size="12" font-weight="bold" fill="#2c2c2a">公平锁</text>
  <text x="52" y="269" font-size="11" fill="#888780">按申请顺序分配，吞吐低，ReentrantLock 可选</text>
  <rect x="356" y="234" width="300" height="44" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
  <text x="368" y="252" font-size="12" font-weight="bold" fill="#2c2c2a">非公平锁</text>
  <text x="368" y="269" font-size="11" fill="#888780">不排队，吞吐高；synchronized 只有这种</text>

  <text x="40" y="308" font-size="14" font-weight="bold" fill="#2c2c2a">④ 拿不到锁怎么办</text>
  <rect x="40" y="320" width="200" height="44" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
  <text x="52" y="338" font-size="12" font-weight="bold" fill="#2c2c2a">阻塞等待</text>
  <text x="52" y="355" font-size="11" fill="#888780">挂起线程，让出 CPU</text>
  <rect x="256" y="320" width="200" height="44" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
  <text x="268" y="338" font-size="12" font-weight="bold" fill="#2c2c2a">自旋等待</text>
  <text x="268" y="355" font-size="11" fill="#888780">CAS 循环重试，忙等</text>
  <rect x="472" y="320" width="200" height="44" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
  <text x="484" y="338" font-size="12" font-weight="bold" fill="#2c2c2a">限时/可中断</text>
  <text x="484" y="355" font-size="11" fill="#888780">tryLock / lockInterruptibly</text>
</svg>
