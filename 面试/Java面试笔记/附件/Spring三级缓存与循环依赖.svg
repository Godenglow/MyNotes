<svg xmlns="http://www.w3.org/2000/svg" width="880" height="560" viewBox="0 0 880 560" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="cd-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2c5aa0"/>
    </marker>
  </defs>
  <rect width="880" height="560" fill="#ffffff"/>

  <text x="30" y="30" font-size="16" font-weight="bold" fill="#333333">Spring 三级缓存解决单例循环依赖（A 依赖 B，B 依赖 A）</text>

  <rect x="40" y="90" width="250" height="80" rx="8" fill="#eef3fb" stroke="#2c5aa0" stroke-width="1.5"/>
  <text x="60" y="120" font-size="13" fill="#333333">一级缓存 singletonObjects</text>
  <text x="60" y="146" font-size="12" fill="#555555">完整的成品 Bean</text>

  <line x1="60" y1="205" x2="60" y2="174" stroke="#2c5aa0" stroke-width="2" marker-end="url(#cd-a)"/>
  <text x="78" y="194" font-size="11" fill="#888888">移入一级，清空二三级</text>

  <rect x="40" y="205" width="250" height="80" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
  <text x="60" y="235" font-size="13" fill="#333333">二级缓存 earlySingletonObjects</text>
  <text x="60" y="261" font-size="12" fill="#555555">提前暴露的半成品引用</text>

  <line x1="60" y1="320" x2="60" y2="289" stroke="#2c5aa0" stroke-width="2" marker-end="url(#cd-a)"/>
  <text x="78" y="309" font-size="11" fill="#888888">getObject() 生成早期引用</text>

  <rect x="40" y="320" width="250" height="80" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
  <text x="60" y="350" font-size="13" fill="#333333">三级缓存 singletonFactories</text>
  <text x="60" y="376" font-size="12" fill="#555555">ObjectFactory 工厂，延迟生成代理</text>

  <rect x="320" y="80" width="520" height="340" rx="8" fill="none" stroke="#333333" stroke-width="1.2"/>
  <text x="340" y="108" font-size="13" font-weight="bold" fill="#333333">创建过程：先暴露自己，再去要对方</text>
  <text x="340" y="140" font-size="12" fill="#555555">① getBean(A)：实例化 A（此时 A 只是半成品，属性还没填）</text>
  <text x="340" y="166" font-size="12" fill="#555555">② A 把自己的 ObjectFactory 放进三级缓存</text>
  <text x="340" y="192" font-size="12" fill="#555555">③ 填充属性发现依赖 B → getBean(B) → 实例化 B</text>
  <text x="340" y="218" font-size="12" fill="#555555">④ B 填充属性发现依赖 A → 从三级缓存 getObject() 拿到 A 的早期引用</text>
  <text x="340" y="244" font-size="12" fill="#555555">⑤ 该引用被移入二级缓存；B 装配完成，进入一级缓存</text>
  <text x="340" y="270" font-size="12" fill="#555555">⑥ 回到 A：A 拿到就绪的 B，完成初始化进一级缓存，清空二、三级</text>

  <line x1="340" y1="292" x2="820" y2="292" stroke="#dddddd" stroke-width="1"/>

  <text x="340" y="316" font-size="13" font-weight="bold" fill="#c0392b">为什么必须有第三级？</text>
  <text x="340" y="340" font-size="12" fill="#555555">· 只有真发生循环依赖时才需要提前暴露引用，不循环就不能提前暴露</text>
  <text x="340" y="364" font-size="12" fill="#555555">· 第三级存的是「工厂」不是「对象」，才能把「要不要生成代理」推迟到被依赖的</text>
  <text x="340" y="384" font-size="12" fill="#555555">　 那一刻（getEarlyBeanReference）</text>
  <text x="340" y="408" font-size="12" fill="#555555">· 若只有一个二级缓存，普通 Bean 也会被提前暴露，AOP 语义会被破坏</text>

  <rect x="40" y="450" width="800" height="80" rx="6" fill="#fff8e6" stroke="#c0392b" stroke-width="1.2"/>
  <text x="60" y="476" font-size="12" fill="#c0392b">· 构造器注入形成的循环依赖解决不了：实例化阶段就卡住了，直接抛 BeanCurrentlyInCreationException</text>
  <text x="60" y="500" font-size="12" fill="#c0392b">· prototype 作用域也不行（不缓存），只有单例 Bean 才有这套缓存</text>
  <text x="60" y="522" font-size="12" fill="#c0392b">· Spring Boot 2.6 起默认禁止循环依赖（allow-circular-references=false），会直接启动失败</text>
</svg>
