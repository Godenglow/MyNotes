<svg xmlns="http://www.w3.org/2000/svg" width="680" height="552" viewBox="0 0 680 552" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <title>Bean 生命周期八阶段：实例化、填充、感知、前后处理、初始化、使用、销毁</title>
  <rect width="680" height="552" fill="#ffffff"/>
  <defs>
    <marker id="arrowBnF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>.mono{font-family:Consolas,'Courier New',monospace}</style>

  <text x="40" y="44" font-size="14" font-weight="bold" fill="#2c2c2a">Bean 生命周期（单例）—— 八步走</text>
  <text x="40" y="150" font-size="11" fill="#888780">出生阶段</text>

  <rect x="150" y="68" width="340" height="44" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
  <text x="320" y="90" font-size="12" fill="#444441" text-anchor="middle" dominant-baseline="central">① 实例化（构造器 / 工厂方法）</text>
  <rect x="150" y="128" width="340" height="44" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
  <text x="320" y="150" font-size="12" fill="#444441" text-anchor="middle" dominant-baseline="central">② 属性填充（依赖注入进来）</text>
  <rect x="150" y="188" width="340" height="44" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
  <text x="320" y="206" font-size="12" fill="#444441" text-anchor="middle" dominant-baseline="central">③ Aware 回调</text>
  <text class="mono" x="320" y="224" font-size="11" fill="#888780" text-anchor="middle" dominant-baseline="central">BeanName → BeanFactory → ApplicationContext</text>
  <rect x="150" y="248" width="340" height="44" rx="8" fill="#e6f1fb" stroke="#185fa5" stroke-width="0.5"/>
  <text class="mono" x="320" y="270" font-size="12" fill="#0c447c" text-anchor="middle" dominant-baseline="central">④ BeanPostProcessor#before</text>
  <rect x="150" y="308" width="340" height="44" rx="8" fill="#e6f1fb" stroke="#185fa5" stroke-width="0.5"/>
  <text x="320" y="326" font-size="12" fill="#0c447c" text-anchor="middle" dominant-baseline="central">⑤ 初始化（按序三连）</text>
  <text class="mono" x="320" y="344" font-size="11" fill="#888780" text-anchor="middle" dominant-baseline="central">@PostConstruct → afterPropertiesSet → init-method</text>
  <rect x="150" y="368" width="340" height="44" rx="8" fill="#e6f1fb" stroke="#185fa5" stroke-width="0.5"/>
  <text class="mono" x="320" y="390" font-size="12" fill="#0c447c" text-anchor="middle" dominant-baseline="central">⑥ BeanPostProcessor#after</text>
  <rect x="150" y="428" width="340" height="44" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
  <text x="320" y="450" font-size="12" fill="#444441" text-anchor="middle" dominant-baseline="central">⑦ 使用中（单例驻留容器）</text>
  <rect x="150" y="488" width="340" height="44" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
  <text x="320" y="506" font-size="12" fill="#444441" text-anchor="middle" dominant-baseline="central">⑧ 容器关闭 → 销毁</text>
  <text class="mono" x="320" y="524" font-size="11" fill="#888780" text-anchor="middle" dominant-baseline="central">@PreDestroy → destroy() → destroy-method</text>

  <path d="M320 112 L320 126" fill="none" stroke="#888780" stroke-width="1.2" marker-end="url(#arrowBnF)"/>
  <path d="M320 172 L320 186" fill="none" stroke="#888780" stroke-width="1.2" marker-end="url(#arrowBnF)"/>
  <path d="M320 232 L320 246" fill="none" stroke="#888780" stroke-width="1.2" marker-end="url(#arrowBnF)"/>
  <path d="M320 292 L320 306" fill="none" stroke="#888780" stroke-width="1.2" marker-end="url(#arrowBnF)"/>
  <path d="M320 352 L320 366" fill="none" stroke="#888780" stroke-width="1.2" marker-end="url(#arrowBnF)"/>
  <path d="M320 412 L320 426" fill="none" stroke="#888780" stroke-width="1.2" marker-end="url(#arrowBnF)"/>
  <path d="M320 472 L320 486" fill="none" stroke="#888780" stroke-width="1.2" marker-end="url(#arrowBnF)"/>

  <text x="505" y="382" font-size="11" fill="#791f1f">★ AOP 代理在这里生成</text>
  <text x="505" y="400" font-size="11" fill="#888780">循环依赖时提前到实例化后</text>
  <text x="505" y="452" font-size="11" fill="#888780">prototype 不归容器销毁</text>
  <text x="505" y="512" font-size="11" fill="#888780">销毁顺序：@PreDestroy 最先</text>
  <text x="40" y="330" font-size="11" fill="#888780">初始化阶段</text>
  <text x="40" y="510" font-size="11" fill="#888780">销毁阶段</text>
</svg>
