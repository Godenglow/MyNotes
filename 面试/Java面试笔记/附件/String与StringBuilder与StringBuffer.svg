<svg xmlns="http://www.w3.org/2000/svg" width="880" height="660" viewBox="0 0 880 660" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="arrow6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666666"/>
    </marker>
    <marker id="arrow6r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect width="880" height="660" fill="#ffffff"/>

  <!-- 三张对比卡片 -->
  <rect x="40" y="30" width="250" height="150" rx="8" fill="#eef3fb" stroke="#2c5aa0" stroke-width="1.8"/>
  <text x="165" y="58" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c5aa0">String</text>
  <text x="165" y="84" font-size="13" text-anchor="middle" fill="#333333">不可变 Immutable</text>
  <text x="165" y="106" font-size="13" text-anchor="middle" fill="#333333">天然线程安全</text>
  <text x="165" y="128" font-size="13" text-anchor="middle" fill="#555555">频繁修改时性能最低</text>
  <text x="165" y="158" font-size="12" text-anchor="middle" fill="#1a7f37">场景：静态字符串、常量池复用</text>

  <rect x="315" y="30" width="250" height="150" rx="8" fill="#e8f5e9" stroke="#1a7f37" stroke-width="1.8"/>
  <text x="440" y="58" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a7f37">StringBuilder</text>
  <text x="440" y="84" font-size="13" text-anchor="middle" fill="#333333">可变，非线程安全</text>
  <text x="440" y="106" font-size="13" text-anchor="middle" fill="#333333">性能最高（无同步开销）</text>
  <text x="440" y="128" font-size="13" text-anchor="middle" fill="#555555">JDK 5 引入</text>
  <text x="440" y="158" font-size="12" text-anchor="middle" fill="#1a7f37">场景：单线程下的字符串拼接（首选）</text>

  <rect x="590" y="30" width="250" height="150" rx="8" fill="#fdf1cf" stroke="#e67e22" stroke-width="1.8"/>
  <text x="715" y="58" font-size="16" font-weight="bold" text-anchor="middle" fill="#e67e22">StringBuffer</text>
  <text x="715" y="84" font-size="13" text-anchor="middle" fill="#333333">可变，方法加 synchronized</text>
  <text x="715" y="106" font-size="13" text-anchor="middle" fill="#333333">线程安全，性能略低</text>
  <text x="715" y="128" font-size="13" text-anchor="middle" fill="#555555">JDK 1.0 遗留</text>
  <text x="715" y="158" font-size="12" text-anchor="middle" fill="#1a7f37">场景：多线程共享可变字符串（罕见）</text>

  <!-- 下半部分：拼接的内存行为 -->
  <text x="440" y="230" font-size="15" font-weight="bold" text-anchor="middle" fill="#333333">为什么循环拼接字符串时禁止用 String：看内存里发生了什么</text>

  <!-- String 拼接 -->
  <rect x="40" y="260" width="390" height="290" rx="8" fill="#fafafa" stroke="#333333" stroke-width="1.5"/>
  <text x="235" y="290" font-size="14" font-weight="bold" text-anchor="middle" fill="#c0392b">String s = "a"; s += "b"; s += "c";</text>

  <rect x="70" y="320" width="70" height="40" rx="4" fill="#f5d0cc" stroke="#c0392b" stroke-width="1"/>
  <text x="105" y="345" font-size="13" text-anchor="middle" fill="#333333">"a"</text>
  <rect x="170" y="320" width="70" height="40" rx="4" fill="#f5d0cc" stroke="#c0392b" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="205" y="345" font-size="13" text-anchor="middle" fill="#888888">"ab"</text>
  <rect x="70" y="390" width="70" height="40" rx="4" fill="#f5d0cc" stroke="#c0392b" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="105" y="415" font-size="13" text-anchor="middle" fill="#888888">"abc"</text>

  <text x="330" y="345" font-size="12" text-anchor="middle" fill="#c0392b">每次 += 都新建对象</text>
  <text x="330" y="368" font-size="12" text-anchor="middle" fill="#c0392b">旧对象变垃圾等 GC</text>
  <text x="330" y="415" font-size="12" text-anchor="middle" fill="#c0392b">循环 N 次 = O(N²) 量级的浪费</text>

  <line x1="140" y1="340" x2="168" y2="340" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow6r)"/>
  <line x1="105" y1="362" x2="105" y2="388" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow6r)"/>

  <!-- StringBuilder 拼接 -->
  <rect x="460" y="260" width="380" height="290" rx="8" fill="#fafafa" stroke="#333333" stroke-width="1.5"/>
  <text x="650" y="290" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a7f37">StringBuilder sb = new StringBuilder("a");</text>
  <text x="650" y="310" font-size="13" text-anchor="middle" fill="#1a7f37">sb.append("b").append("c");</text>

  <rect x="540" y="340" width="220" height="70" rx="4" fill="#d5ead1" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="650" y="370" font-size="13" text-anchor="middle" fill="#333333">内部 char[] / byte[] 数组</text>
  <text x="650" y="393" font-size="12" text-anchor="middle" fill="#555555">"a b c" 原地扩容，始终是同一个对象</text>

  <line x1="650" y1="425" x2="650" y2="455" stroke="#1a7f37" stroke-width="1.5" marker-end="url(#arrow6)"/>
  <text x="650" y="480" font-size="12" text-anchor="middle" fill="#1a7f37">满了才扩容一次（约 2 倍），最后 toString() 一次</text>
  <text x="650" y="510" font-size="12" text-anchor="middle" fill="#1a7f37">整体接近 O(N)</text>

  <!-- 结论 -->
  <rect x="40" y="580" width="800" height="56" rx="8" fill="#fdf1cf" stroke="#c0392b" stroke-width="1.5"/>
  <text x="440" y="605" font-size="14" font-weight="bold" text-anchor="middle" fill="#c0392b">结论：内容固定用 String；循环/频繁拼接用 StringBuilder；</text>
  <text x="440" y="627" font-size="14" font-weight="bold" text-anchor="middle" fill="#c0392b">多线程共享可变字符串才考虑 StringBuffer（实际开发很少见）</text>
</svg>
