<svg xmlns="http://www.w3.org/2000/svg" width="680" height="322" viewBox="0 0 680 322" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <title>单例 Setter 循环依赖解决流程：A 与 B 互相依赖的五步接力</title>
  <rect width="680" height="322" fill="#ffffff"/>
  <defs>
    <marker id="arrowCdF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="40" y="44" font-size="14" font-weight="bold" fill="#2c2c2a">单例 Setter 循环依赖的解决流程（A ⇄ B）</text>

  <rect x="40" y="68" width="140" height="56" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
  <text x="110" y="88" font-size="11" font-weight="bold" fill="#2c2c2a" text-anchor="middle" dominant-baseline="central">① 实例化 A</text>
  <text x="110" y="106" font-size="11" fill="#888780" text-anchor="middle" dominant-baseline="central">构造函数完成</text>
  <rect x="194" y="68" width="140" height="56" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
  <text x="264" y="88" font-size="11" font-weight="bold" fill="#2c2c2a" text-anchor="middle" dominant-baseline="central">② A 工厂入三级</text>
  <text x="264" y="106" font-size="11" fill="#888780" text-anchor="middle" dominant-baseline="central">提前暴露</text>
  <rect x="348" y="68" width="140" height="56" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
  <text x="418" y="88" font-size="11" font-weight="bold" fill="#2c2c2a" text-anchor="middle" dominant-baseline="central">③ A 填属性：要 B</text>
  <text x="418" y="106" font-size="11" fill="#888780" text-anchor="middle" dominant-baseline="central">转去创建 B</text>
  <rect x="502" y="68" width="140" height="56" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
  <text x="572" y="88" font-size="11" font-weight="bold" fill="#2c2c2a" text-anchor="middle" dominant-baseline="central">④ 实例化 B</text>
  <text x="572" y="106" font-size="11" fill="#888780" text-anchor="middle" dominant-baseline="central">B 工厂也入三级</text>
  <path d="M182 96 L192 96" fill="none" stroke="#888780" stroke-width="1.2" marker-end="url(#arrowCdF)"/>
  <path d="M336 96 L346 96" fill="none" stroke="#888780" stroke-width="1.2" marker-end="url(#arrowCdF)"/>
  <path d="M490 96 L500 96" fill="none" stroke="#888780" stroke-width="1.2" marker-end="url(#arrowCdF)"/>
  <path d="M572 124 L572 160 L140 160 L140 186" fill="none" stroke="#888780" stroke-width="1.2" marker-end="url(#arrowCdF)"/>

  <rect x="40" y="190" width="200" height="56" rx="8" fill="#e6f1fb" stroke="#185fa5" stroke-width="0.5"/>
  <text x="140" y="210" font-size="11" font-weight="bold" fill="#0c447c" text-anchor="middle" dominant-baseline="central">⑤ B 要 A：三级命中</text>
  <text x="140" y="228" font-size="11" fill="#888780" text-anchor="middle" dominant-baseline="central">产出早期引用入二级，工厂删除</text>
  <rect x="250" y="190" width="200" height="56" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
  <text x="350" y="210" font-size="11" font-weight="bold" fill="#2c2c2a" text-anchor="middle" dominant-baseline="central">⑥ B 初始化完成</text>
  <text x="350" y="228" font-size="11" fill="#888780" text-anchor="middle" dominant-baseline="central">升入一级缓存</text>
  <rect x="460" y="190" width="200" height="56" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
  <text x="560" y="210" font-size="11" font-weight="bold" fill="#085041" text-anchor="middle" dominant-baseline="central">⑦ 回溯：B 注入 A</text>
  <text x="560" y="228" font-size="11" fill="#888780" text-anchor="middle" dominant-baseline="central">A 完成初始化，闭环</text>
  <path d="M242 218 L248 218" fill="none" stroke="#888780" stroke-width="1.2" marker-end="url(#arrowCdF)"/>
  <path d="M452 218 L458 218" fill="none" stroke="#888780" stroke-width="1.2" marker-end="url(#arrowCdF)"/>

  <text x="40" y="280" font-size="11" fill="#888780">关键：⑤ 拿到的是 A 的半成品引用 —— 引用指向对象本体，塞进 B 不需要 A 初始化完成</text>
  <text x="40" y="302" font-size="11" fill="#888780">为什么三级不是两级：把「要不要提前生成代理」延迟到真正发生循环依赖时才决策，不破坏生命周期</text>
</svg>
