<svg xmlns="http://www.w3.org/2000/svg" width="680" height="244" viewBox="0 0 680 244" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <title>synchronized 锁升级流程：无锁、偏向锁、轻量级锁、重量级锁</title>
  <rect width="680" height="244" fill="#ffffff"/>
  <defs>
    <marker id="arrowLock" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="40" y="52" font-size="14" font-weight="bold" fill="#2c2c2a">synchronized 锁升级流程（JDK 8 语境：只升不降）</text>
  <text x="184" y="76" font-size="11" fill="#888780" text-anchor="middle">首次访问</text>
  <text x="340" y="76" font-size="11" fill="#888780" text-anchor="middle">第二个线程来竞争</text>
  <text x="496" y="76" font-size="11" fill="#888780" text-anchor="middle">竞争加剧，自旋超限</text>

  <rect x="44" y="88" width="124" height="60" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
  <text x="106" y="110" font-size="13" font-weight="bold" fill="#444441" text-anchor="middle" dominant-baseline="central">无锁</text>
  <text x="106" y="130" font-size="11" fill="#888780" text-anchor="middle" dominant-baseline="central">对象刚创建</text>
  <rect x="200" y="88" width="124" height="60" rx="8" fill="#e6f1fb" stroke="#185fa5" stroke-width="0.5"/>
  <text x="262" y="110" font-size="13" font-weight="bold" fill="#0c447c" text-anchor="middle" dominant-baseline="central">偏向锁</text>
  <text x="262" y="130" font-size="11" fill="#888780" text-anchor="middle" dominant-baseline="central">单线程复用，零开销</text>
  <rect x="356" y="88" width="124" height="60" rx="8" fill="#e6f1fb" stroke="#185fa5" stroke-width="0.5"/>
  <text x="418" y="110" font-size="13" font-weight="bold" fill="#0c447c" text-anchor="middle" dominant-baseline="central">轻量级锁</text>
  <text x="418" y="130" font-size="11" fill="#888780" text-anchor="middle" dominant-baseline="central">CAS 自旋抢，不阻塞</text>
  <rect x="512" y="88" width="124" height="60" rx="8" fill="#faeeda" stroke="#ba7517" stroke-width="0.5"/>
  <text x="574" y="110" font-size="13" font-weight="bold" fill="#633806" text-anchor="middle" dominant-baseline="central">重量级锁</text>
  <text x="574" y="130" font-size="11" fill="#888780" text-anchor="middle" dominant-baseline="central">OS 互斥，阻塞挂起</text>

  <path d="M172 118 L196 118" fill="none" stroke="#888780" stroke-width="1.2" marker-end="url(#arrowLock)"/>
  <path d="M328 118 L352 118" fill="none" stroke="#888780" stroke-width="1.2" marker-end="url(#arrowLock)"/>
  <path d="M484 118 L508 118" fill="none" stroke="#888780" stroke-width="1.2" marker-end="url(#arrowLock)"/>

  <text x="40" y="180" font-size="12" fill="#888780">偏向锁自 JDK 15 起默认禁用并废弃（JEP 374）；答题先按 JDK 8 讲流程，再补这句是加分项</text>
  <text x="40" y="202" font-size="12" fill="#888780">ReentrantLock 没有这套膨胀：一开始就是 AQS 队列 + CAS 的显式锁</text>
  <text x="40" y="224" font-size="12" fill="#888780">轻量级阶段自旋多少次由 JVM 自适应自旋决定，避免白白烧 CPU</text>
</svg>
