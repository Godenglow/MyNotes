<svg xmlns="http://www.w3.org/2000/svg" width="880" height="680" viewBox="0 0 880 680" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="tp-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2c5aa0"/>
    </marker>
  </defs>
  <rect width="880" height="680" fill="#ffffff"/>

  <text x="30" y="32" font-size="16" font-weight="bold" fill="#333333">ThreadPoolExecutor 提交任务后的去路（execute / submit）</text>

  <!-- 入口 -->
  <rect x="330" y="55" width="220" height="46" rx="23" fill="#eef3fb" stroke="#2c5aa0" stroke-width="1.5"/>
  <text x="440" y="84" font-size="13" text-anchor="middle" fill="#333333">提交任务</text>

  <line x1="440" y1="101" x2="440" y2="136" stroke="#2c5aa0" stroke-width="2" marker-end="url(#tp-a)"/>

  <!-- Q1 核心线程 -->
  <rect x="300" y="140" width="280" height="58" rx="8" fill="#fff8e6" stroke="#333333" stroke-width="1.5"/>
  <text x="440" y="166" font-size="13" text-anchor="middle" fill="#333333">线程数 &lt; corePoolSize ？</text>
  <text x="440" y="187" font-size="12" text-anchor="middle" fill="#888888">是就新建核心线程，不去看队列</text>

  <rect x="40" y="141" width="210" height="56" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
  <text x="145" y="167" font-size="13" text-anchor="middle" fill="#333333">新建核心线程执行</text>
  <text x="145" y="186" font-size="12" text-anchor="middle" fill="#888888">即使已有空闲线程</text>

  <line x1="300" y1="169" x2="254" y2="169" stroke="#2c5aa0" stroke-width="2" marker-end="url(#tp-a)"/>
  <text x="277" y="161" font-size="12" text-anchor="middle" fill="#c0392b">是</text>

  <line x1="440" y1="198" x2="440" y2="246" stroke="#2c5aa0" stroke-width="2" marker-end="url(#tp-a)"/>
  <text x="452" y="226" font-size="12" fill="#c0392b">否</text>

  <!-- Q2 队列 -->
  <rect x="300" y="250" width="280" height="58" rx="8" fill="#fff8e6" stroke="#333333" stroke-width="1.5"/>
  <text x="440" y="276" font-size="13" text-anchor="middle" fill="#333333">workQueue 是否已满？</text>
  <text x="440" y="297" font-size="12" text-anchor="middle" fill="#888888">没满就先进队列排队等待</text>

  <rect x="630" y="251" width="210" height="56" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
  <text x="735" y="277" font-size="13" text-anchor="middle" fill="#333333">任务入队排队</text>
  <text x="735" y="296" font-size="12" text-anchor="middle" fill="#888888">等线程空闲后取出</text>

  <line x1="580" y1="279" x2="626" y2="279" stroke="#2c5aa0" stroke-width="2" marker-end="url(#tp-a)"/>
  <text x="603" y="271" font-size="12" text-anchor="middle" fill="#c0392b">是</text>

  <line x1="440" y1="308" x2="440" y2="356" stroke="#2c5aa0" stroke-width="2" marker-end="url(#tp-a)"/>
  <text x="452" y="336" font-size="12" fill="#c0392b">否</text>

  <!-- Q3 最大线程数 -->
  <rect x="300" y="360" width="280" height="58" rx="8" fill="#fff8e6" stroke="#333333" stroke-width="1.5"/>
  <text x="440" y="386" font-size="13" text-anchor="middle" fill="#333333">线程数 &lt; maximumPoolSize ？</text>
  <text x="440" y="407" font-size="12" text-anchor="middle" fill="#888888">队列满了才开始扩容</text>

  <rect x="40" y="361" width="210" height="56" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
  <text x="145" y="387" font-size="13" text-anchor="middle" fill="#333333">新建非核心线程执行</text>
  <text x="145" y="406" font-size="12" text-anchor="middle" fill="#888888">用完会被回收</text>

  <line x1="300" y1="389" x2="254" y2="389" stroke="#2c5aa0" stroke-width="2" marker-end="url(#tp-a)"/>
  <text x="277" y="381" font-size="12" text-anchor="middle" fill="#c0392b">是</text>

  <line x1="440" y1="418" x2="440" y2="466" stroke="#2c5aa0" stroke-width="2" marker-end="url(#tp-a)"/>
  <text x="452" y="446" font-size="12" fill="#c0392b">否</text>

  <!-- 拒绝 -->
  <rect x="320" y="470" width="240" height="54" rx="8" fill="#f5d0cc" stroke="#c0392b" stroke-width="1.5"/>
  <text x="440" y="495" font-size="13" font-weight="bold" text-anchor="middle" fill="#c0392b">执行拒绝策略</text>
  <text x="440" y="514" font-size="12" text-anchor="middle" fill="#c0392b">此时任务被拒，业务方需感知</text>

  <!-- 四种拒绝策略 -->
  <rect x="40" y="545" width="800" height="70" rx="8" fill="none" stroke="#333333" stroke-width="1.2"/>
  <text x="60" y="568" font-size="13" font-weight="bold" fill="#333333">RejectedExecutionHandler 四种实现</text>
  <text x="60" y="590" font-size="12" fill="#555555">AbortPolicy 抛 RejectedExecutionException（默认）　　CallerRunsPolicy 调用者线程自己执行</text>
  <text x="60" y="608" font-size="12" fill="#555555">DiscardPolicy 静默丢弃　　DiscardOldestPolicy 丢弃队列中最老的任务再重试提交</text>

  <rect x="40" y="630" width="800" height="38" rx="6" fill="#fff8e6" stroke="#c0392b" stroke-width="1.2"/>
  <text x="440" y="655" font-size="13" text-anchor="middle" fill="#c0392b">最常答错的一点：队列满了才会扩容到 maximumPoolSize，所以「最大线程数」在无界队列下永远用不上</text>
</svg>
